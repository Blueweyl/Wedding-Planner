<script>
/* Phone support, and nothing else: when this page is served from a web
   address it announces itself as an installable app and registers the
   offline worker sitting beside it. Opened as a local file — the way the
   download works — this does nothing at all and asks for nothing.

   The planner itself reads EVERMORE_PWA.state to say whether it is offline
   ready, whether a newer version is waiting, or whether the worker could not
   be registered. Nothing here is allowed to break the planner, so every step
   is wrapped and the state simply stays where it was. */
(function () {
  var pwa = window.EVERMORE_PWA = {
    state: 'idle',      // idle | pending | ready | update | failed
    detail: '',
    notify: null,       // the planner hooks itself in here once it is running
    activate: null      // set when a newer version is waiting to take over
  };
  function set(state, detail) {
    if (pwa.state === state) return;
    pwa.state = state;
    pwa.detail = detail || '';
    if (typeof pwa.notify === 'function') { try { pwa.notify(); } catch (e) {} }
  }
  if (!/^https?:$/.test(location.protocol)) return;

  var manifest = document.createElement('link');
  manifest.rel = 'manifest';
  manifest.href = 'manifest.webmanifest';
  document.head.appendChild(manifest);
  var touch = document.createElement('link');
  touch.rel = 'apple-touch-icon';
  touch.href = 'apple-touch-icon.png';
  document.head.appendChild(touch);

  if (!('serviceWorker' in navigator)) {
    set('failed', 'this browser has no offline support');
    return;
  }
  set('pending');

  // A worker was already in charge before this load, so anything that takes
  // over mid-session is a newer version of the planner.
  var hadController = !!navigator.serviceWorker.controller;
  var swept = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (hadController && !swept) { swept = true; set('update'); }
  });

  function watch(reg) {
    function look() {
      var next = reg.waiting;
      if (!next || !navigator.serviceWorker.controller) return;
      pwa.activate = function () {
        try { next.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
      };
      set('update');
    }
    look();
    reg.addEventListener('updatefound', function () {
      var installing = reg.installing;
      if (!installing) return look();
      installing.addEventListener('statechange', look);
    });
  }

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(function (reg) {
        watch(reg);
        // Ask the host whether there is a newer planner: on every open, and
        // again whenever an installed app is brought back to the foreground.
        function refresh() {
          if (navigator.onLine === false) return;
          try { reg.update(); } catch (e) {}
        }
        var last = 0;
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) return;
          var now = Date.now();
          if (now - last < 60000) return;
          last = now;
          refresh();
        });
        refresh();
        return navigator.serviceWorker.ready;
      })
      .then(function () {
        // Only now is the page genuinely covered offline.
        if (pwa.state === 'pending') set('ready');
      })['catch'](function (err) {
        set('failed', (err && err.message) ? String(err.message).slice(0, 120) : '');
      });
  });
})();

<style>
  :root {
    --bg: #faf6f0;
    --card: #fdfaf6;
    --line: #e8e0d6;
    --line-soft: #f0e9e1;
    --ink: #2e2521;
    --body: #6b5d54;
    --muted: #6f6055;          /* 4.9:1 on blush, 5.6:1 on ivory (WCAG AA) */
    --deep: #4a2f28;
    --blush: #f2e4dc;
    --accent: #a8705a;         /* borders, bars and focus rings */
    --accent-ink: #8c5a46;     /* the same rose, dark enough for small text */
    --good: #3f6e4d;
    --warn: #93641f;
    --over: #a3482f;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select, button { font-family: var(--sans); font-size: 14px; color: var(--ink); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  .label {

    color: var(--accent-ink); font-weight: 600;
  }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; gap: 22px; }

  /* Header */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(250,246,240,.95);

  .tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .tab-spark { color: var(--accent); margin-left: 3px; }
  .tab.active .tab-spark { color: #f2d3c4; }
  .tab {
    border: none; background: none; color: var(--body);
    padding: 8px 14px; border-radius: 18px; font-size: 13.5px; font-weight: 500;
  }
  .tab:hover { background: var(--blush); }
  .tab.active { background: var(--deep); color: #fdfaf6; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Setup screen */
  .setup { max-width: 540px; margin: 0 auto; padding: 60px 24px; }

  .field input, .field select { width: 100%; }

  .field label.row { display: flex; margin-bottom: 5px; }

  /* Home */
  .quote {
    background: var(--blush); border-radius: 8px; padding: 20px 26px; margin-bottom: 26px;
    font-family: var(--serif); font-style: italic; font-size: 17.5px; line-height: 1.55; color: var(--deep);
  }
  .stat { font-family: var(--serif); font-size: 52px; font-weight: 600; line-height: 1; color: var(--deep); }

  .list-row {

    max-width: 1180px; margin: 12px auto 0; padding: 14px 20px; border-radius: 8px;

  }

  .warn-bar.warn-info { background: var(--blush); color: var(--deep); }
  .warn-bar > div:first-child { max-width: 760px; overflow-wrap: anywhere; }
  .undo-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    max-width: 1180px; margin: 14px auto 0; padding: 11px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    font-size: 13.5px; color: var(--body);
  }
  .notice {
    background: #f7ecd6; color: #6b5324; border-radius: 8px; padding: 11px 15px;

  .btn-icon { min-width: 32px; min-height: 32px; }
  .brand { overflow-wrap: anywhere; }
  .longtext { overflow-wrap: anywhere; word-break: break-word; }
  .tag-over { background: var(--over); color: #fff; font-weight: 600; letter-spacing: .04em; }
  .tag-good { background: #dceadf; color: #2f5c3b; }

    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;

  }

  .phase-now { border-color: var(--accent); }
  .phase-late { border-color: #e6c4b8; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-width: 780px) {
    .vows-grid { grid-template-columns: minmax(0, 1fr) !important; }
  }
  @media (max-width: 520px) {

    .list-row > input, .list-row > select { flex: 1 1 100%; width: auto !important; min-width: 0; }

    .money-row label { flex: 1 1 100%; }
    .money-row input[type="number"] { width: 100%; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 22px 16px 60px; }
    .card { padding: 20px; }
    .topbar-inner { padding: 12px 16px; }
    .stat { font-size: 42px; }
    .setup { padding: 40px 18px; }
    .setup h1 { font-size: 32px; }
    .warn-bar, .undo-bar { margin-left: 16px; margin-right: 16px; padding: 12px 16px; }
    .keepsake { padding: 36px 16px; }
    .topbar-inner { flex-wrap: nowrap; flex-direction: column; align-items: stretch; gap: 8px; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; }
    .cg-hero { padding: 20px; }
    .cg-title { font-size: 25px; }
    .modal { padding: 20px; }
    .cg-grid { grid-template-columns: minmax(0, 1fr); }
  }

  /* Smart Concierge */
  .skip {
    position: absolute; left: -999px; top: 8px; z-index: 50; background: var(--deep); color: #fdfaf6;
    padding: 8px 14px; border-radius: 18px; font-size: 13px; text-decoration: none;
  }
  .skip:focus { left: 12px; }
  .cg-hero {
    background: linear-gradient(135deg, var(--blush), #f8efe8 60%, var(--card));
    border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; margin-bottom: 22px;
  }
  .cg-title { font-family: var(--serif); font-size: 30px; font-weight: 600; color: var(--deep); line-height: 1.15; margin: 4px 0 6px; }
  .cg-step {
    display: flex; gap: 14px; align-items: flex-start; background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 10px;
  }
  .cg-step.cg-crit { border-left: 4px solid var(--over); }
  .cg-step.cg-high { border-left: 4px solid var(--warn); }
  .cg-step.cg-norm { border-left: 4px solid var(--accent); }
  .cg-num {

    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600;

  .cg-body { min-width: 0; flex: 1; }

  .cg-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn-link { border: none; background: none; color: var(--accent-ink); padding: 6px 4px; font-size: 12.5px; text-decoration: underline; }
  .cg-grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .cg-section h3 { font-family: var(--serif); font-size: 20px; font-weight: 600; margin: 0 0 4px; color: var(--deep); }
  .cg-item { padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; color: var(--body); overflow-wrap: anywhere; }
  .cg-item:last-child { border-bottom: none; }
  .cg-item strong { color: var(--ink); }
  .cg-answer {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    margin-top: 12px; font-size: 14px; color: var(--body); white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--body); border-radius: 14px;
    padding: 5px 11px; font-size: 12.5px;
  }
  .chip:hover { border-color: var(--accent); background: var(--blush); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .ai-out {
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
    font-size: 14px; line-height: 1.65; color: var(--ink); overflow-wrap: anywhere; margin-top: 14px;
  }
  .ai-out p { margin: 0 0 10px; }
  .ai-out ul { margin: 0 0 10px; padding-left: 20px; }
  .ai-meta { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .pill { display: inline-block; font-size: 11px; border-radius: 10px; padding: 2px 9px; font-weight: 600; letter-spacing: .03em; }
  .pill-off { background: var(--line-soft); color: var(--muted); }
  .pill-on { background: #dceadf; color: #2f5c3b; }
  .pill-bad { background: #f7ded4; color: #6d3323; }
  .spin {
    display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--deep);
    border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } .bar > div { transition: none; } }

  /* Dialogs and toasts */
  .modal-back {
    position: fixed; inset: 0; background: rgba(46,37,33,.42); z-index: 60;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal {
    background: var(--card); border-radius: 12px; border: 1px solid var(--line); max-width: 560px; width: 100%;
    max-height: calc(100vh - 32px); overflow: auto; padding: 24px 26px; box-shadow: 0 18px 50px rgba(46,37,33,.25);
  }
  .modal h2 { font-family: var(--serif); font-size: 24px; font-weight: 600; margin: 0 0 10px; color: var(--deep); }
  .modal pre {
    white-space: pre-wrap; overflow-wrap: anywhere; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; font-size: 12.5px; max-height: 300px; overflow: auto; margin: 0;
  }
  .modal .diff-old { background: #f7ded4; border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .modal .diff-new { background: #dceadf; border-radius: 6px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70;
    background: var(--deep); color: #fdfaf6; padding: 11px 18px; border-radius: 20px; font-size: 13.5px;
    max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(46,37,33,.25);
  }
  .home-cg { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .home-cg ol { margin: 8px 0 0; padding-left: 20px; font-size: 13.5px; color: var(--body); }
  .home-cg li { margin-bottom: 5px; overflow-wrap: anywhere; }
  .task-del { opacity: .55; }
  .check:hover .task-del, .task-del:focus { opacity: 1; }

  /* Keepsake print view */
  .keepsake { max-width: 680px; margin: 0 auto; padding: 50px 28px; }
  @media print {
    @page { margin: 1.4cm; }
    .no-print, .topbar, #warnings, .undo-bar, .toast, .modal-back { display: none !important; }
    body { background: #fff; }
    .keepsake { padding: 0; max-width: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

<script>

  var undoable = null;        // one step of undo for a deletion
  var notice = '';            // inline message on the Guests tab
  var setupError = '';        // inline message on the setup screen
  var setupDraft = null;      // what was typed, kept across a failed attempt
  var settingsDraft = null;   // Settings edits not yet good enough to save
  var settingsError = '';     // why the last Settings edit was not saved
  var pwaWarnHidden = false;  // the offline-worker warning has been dismissed

     has to be declared before the flag that reads it. */

  var tab = 'home';

  var draft = { guest: '', diaryText: '', diaryMood: 'Joyful', diaryDate: today() };

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (raw == null) return defaultData();
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    var clean = parsed === null ? null : validate(parsed);
    if (clean) { loadRepairs = lastRepairs; return clean; }

    // its own key first, because the next save goes to the usual key — v1
    // promised to leave it alone and then wrote over it on the next keystroke.

  /**
   * Returns a clean, fully-typed copy of `raw` when it is recognisably a plan,
   * or null when it is not (wrong shape entirely). Small damage — a bad date,
   * an unknown status, a non-number amount — is repaired to a safe default and
   * counted in `lastRepairs`, rather than throwing the whole plan away over
   * one field. A null result must always mean "keep the current data".
   */

    function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
    function isStr(v) { return typeof v === 'string'; }
    var fixes = 0;
    function str(v, max) {
      if (v == null) return '';
      if (typeof v !== 'string') { fixes++; return typeof v === 'number' ? String(v) : ''; }
      return max && v.length > max ? (fixes++, v.slice(0, max)) : v;
    }
    function amount(v) {
      if (v == null || v === '') return 0;
      var n = Number(v);
      if (!isFinite(n)) { fixes++; return 0; }
      return money2(Math.max(0, n));
    }
    function date(v) {
      if (v == null || v === '') return '';
      if (isIsoDate(v)) return v;
      fixes++; return '';
    }
    function bool(v) {
      if (v == null) return false;
      if (typeof v !== 'boolean') fixes++;
      return v === true;
    }
    function list(v) {
      if (Array.isArray(v)) return v;
      if (v != null) fixes++;
      return [];
    }

    if (!isObj(raw)) return null;
    // A v2 backup may arrive wrapped as { evermore: {...meta}, plan: {...} }.
    if (isObj(raw.plan) && isObj(raw.evermore)) raw = raw.plan;
    var p = raw.profile;
    if (!isObj(p)) return null;
    // It has to look like a planner file, not any JSON with a "profile".
    if (!Array.isArray(raw.budget) && !Array.isArray(raw.guests) && !Array.isArray(raw.timeline)) return null;

    var budget = [];
    list(raw.budget).forEach(function (c) {
      if (!isObj(c)) { fixes++; return; }
      budget.push({ name: str(c.name, 120), planned: amount(c.planned), spent: amount(c.spent) });
    });

    var guests = [];
    list(raw.guests).forEach(function (g) {
      if (!isObj(g) || !isStr(g.name)) { fixes++; return; }
      var status = GUEST_STATUSES.indexOf(g.status) === -1 ? (fixes++, 'Pending') : g.status;
      // A declined guest has no meal and no plus-one, whatever the file says.
      var declined = status === 'No';
      var hasPlus = !declined && bool(g.plusOne);
      guests.push({ name: str(g.name, 160), status: status, meal: declined ? '' : str(g.meal, 120),
        plusOne: hasPlus, plusOneName: hasPlus ? str(g.plusOneName, 160) : '' });
    });

    var vendors = [];
    list(raw.vendors).forEach(function (v) {
      if (!isObj(v)) { fixes++; return; }
      var status = VENDOR_STATUSES.indexOf(v.status) === -1 ? (fixes++, 'Inquiring') : v.status;
      vendors.push({ name: str(v.name, 160), category: str(v.category, 80), contact: str(v.contact, 200),
        status: status, deposit: date(v.deposit), final: date(v.final),
        cost: amount(v.cost), depositAmount: amount(v.depositAmount), paidAmount: amount(v.paidAmount) });
    });

    var timeline = [];
    list(raw.timeline).forEach(function (ph) {
      if (!isObj(ph) || !isStr(ph.phase)) { fixes++; return; }
      var tasks = [];
      list(ph.tasks).forEach(function (t) {
        if (!isObj(t) || !isStr(t.text)) { fixes++; return; }
        tasks.push({ text: str(t.text, 300), done: bool(t.done), key: t.key === true });
      });
      timeline.push({ phase: str(ph.phase, 80), tasks: tasks });
    });
    // A plan with no timeline at all gets the starter checklist back.
    if (!timeline.length) { fixes++; timeline = starterTimeline(); }

    var diary = [];
    list(raw.diary).forEach(function (e) {
      if (!isObj(e) || !isStr(e.text)) { fixes++; return; }
      diary.push({ date: date(e.date), text: str(e.text, 20000), mood: str(e.mood, 40) || 'Reflective',
        shared: bool(e.shared) });
    });

    var vw = isObj(raw.vows) ? raw.vows : (raw.vows != null ? (fixes++, {}) : {});
    var vows = {};
    ['opening', 'memory', 'promises', 'closing'].forEach(function (k) { vows[k] = str(vw[k], 20000); });
    vows.tone = TONES.indexOf(vw.tone) === -1 ? 'Heartfelt' : vw.tone;
    vows.inKeepsake = vw.inKeepsake === true;

    var snoozed = {};
    var cg = isObj(raw.concierge) ? raw.concierge : {};
    if (isObj(cg.snoozed)) {
      Object.keys(cg.snoozed).slice(0, 200).forEach(function (k) {
        if (/^[a-z0-9:_-]{1,80}$/i.test(k) && isIsoDate(cg.snoozed[k])) snoozed[k] = cg.snoozed[k];
      });
    }

    lastRepairs = fixes;
    return {
      setupDone: raw.setupDone === true,
      profile: { partnerA: str(p.partnerA, 80), partnerB: str(p.partnerB, 80), date: date(p.date),
        vibe: str(p.vibe, 200), story: str(p.story, 20000), currency: curStore(p.currency) },
      budget: budget, guests: guests, vendors: vendors, timeline: timeline, diary: diary, vows: vows,
      concierge: { snoozed: snoozed }

  }

  /** Persist without throwing. Returns false when the browser refused. */
  function save() {
    var was = saveFailed;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      saveFailed = false;
    } catch (e) {
      saveFailed = true;
    }
    if (was !== saveFailed) updateWarnings();
    return !saveFailed;
  }

  /* ---------------- device storage & safety copies ---------------- */

  function readJson(key, fallback) {

    } catch (e) { return fallback; }
  }

    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
  }

  function setDevice(k, v) { var d = device(); d[k] = v; writeJson(DEVICE_KEY, d); }

    var list = readJson(SNAPSHOT_KEY, []);

      return s && typeof s.at === 'string' && s.data && typeof s.data === 'object';
    }) : [];
  }

  /** Keep a copy of the plan as it is now. The newest three are kept. */
  function takeSnapshot(reason) {
    if (!data.setupDone) return false;
    var list = snapshots();
    list.unshift({ at: new Date().toISOString(), reason: String(reason || '').slice(0, 80),
      data: JSON.parse(JSON.stringify(data)) });
    list = list.slice(0, 3);
    // If storage is nearly full, fewer copies is better than none.
    while (list.length && !writeJson(SNAPSHOT_KEY, list)) list.pop();
    return list.length > 0;
  }

  function dailySnapshot() {
    var last = device().lastDailySnapshot;
    if (last === today() || !data.setupDone) return;
    if (takeSnapshot('Daily safety copy')) setDevice('lastDailySnapshot', today());
  }

  /* ---------------- helpers ---------------- */

  /** Today in the couple's own time zone (v1 used UTC, so evenings in the
      Americas and mornings in Asia stamped diary entries with the wrong day). */
  function today() { return isoOf(new Date()); }

  /** Money is held to the cent so payments add up exactly. */
  function money2(n) { return Math.round(num(n) * 100) / 100; }
  function sumMoney(list) {
    var cents = 0;
    list.forEach(function (n) { cents += Math.round(num(n) * 100); });
    return cents / 100;
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  /* The symbol the couple picked in Settings. Kept as a plain symbol so a

  function currencyEntry(code) {

    }

  }

  /** What gets stored: a code where we know one, otherwise the value as-is. */

  function currencyCode() { return curStore(data.profile.currency); }

  /* Currencies with no minor unit in everyday use. */
  var NO_CENTS = { JPY: true };

  function money(n) {
    var v = money2(n);

    // 'CHF 1,200' reads properly; '$1,200' should not gain a space.
    var gap = /[A-Za-z]$/.test(sym) ? ' ' : '';

    // some ('$1,200.50') — v1 rounded them away, so payments looked settled
    // when 50 cents were still owed.
    var abs = Math.abs(v);
    var cents = !NO_CENTS[currencyCode()] && Math.round(abs * 100) % 100 !== 0;

    try {

  function currencyOptions() {
    var cur = currencyCode();

  /** Names match if they differ only by case or by extra whitespace. */

  /* The three details the planner depends on. An edit that breaks one of

    var missing = [];

    if (!tidy(p.partnerB)) missing.push("your partner's name");
    if (!isIsoDate(p.date)) missing.push('a wedding date');
    if (missing.length) {

    if (p.date !== data.profile.date && daysUntil(p.date) < 0) {

  /** A payment is 'overdue' once its date has passed unpaid, 'soon' within 14 days. */

    return null;

  /* A payment counts as made either from the booking status or from the

  /* The booking status and the recorded money can disagree \u2014 'Paid in
     Full' with nothing paid, say. We never rewrite either one: we describe
     the disagreement and let the money drive the sums. A row with no
     amounts recorded at all has nothing to contradict, so it stays quiet. */
  function vendorConflict(v) {
    var m = vendorMoney(v);
    if (m.cost === 0 && m.deposit === 0 && m.paid === 0) return '';

    if (v.status === 'Paid in Full' && m.cost > 0 && m.paid < m.cost) {
      return m.paid === 0
        ? 'Marked paid in full, but no payment is recorded against ' + money(m.cost) +
          '. Update the status or the amounts.'
        : 'Marked paid in full, but only ' + money(m.paid) + ' of ' + money(m.cost) +
          ' is recorded. Update the status or the amounts.';

    if (DEPOSIT_PAID.indexOf(v.status) !== -1 && m.deposit > 0 && m.paid < m.deposit) {
      return m.paid === 0
        ? 'Marked \u201c' + v.status + '\u201d, but no payment is recorded against the ' +
          money(m.deposit) + ' deposit. Update the status or the amounts.'
        : 'Marked \u201c' + v.status + '\u201d, but only ' + money(m.paid) + ' of the ' +
          money(m.deposit) + ' deposit is recorded. Update the status or the amounts.';
    }
    if (m.cost > 0 && m.paid >= m.cost && v.status !== 'Paid in Full') {

  /* A payment counts as settled from the recorded money first. The status is

  function depositPaid(v) {
    var m = vendorMoney(v);
    if (m.deposit > 0 && m.paid >= m.deposit) return true;
    if (m.cost > 0 && m.paid >= m.cost) return true;
    return DEPOSIT_PAID.indexOf(v.status) !== -1 && !vendorConflict(v);
  }
  function finalPaid(v) {

    if (m.cost > 0 && m.paid >= m.cost) return true;
    return v.status === 'Paid in Full' && !vendorConflict(v);

  /** Cost / paid / balance for one vendor. */
  function vendorMoney(v) {
    var cost = money2(Math.max(0, num(v.cost)));
    var paid = money2(Math.max(0, num(v.paidAmount)));

  /** Totals across every vendor, for the summary at the top of the tab.

      ahead to one vendor never hides a debt to another. */
  function vendorTotals() {
    var cost = [], paid = [], owed = [];
    data.vendors.forEach(function (v) {
      var m = vendorMoney(v);
      cost.push(m.cost);
      paid.push(m.paid);
      owed.push(Math.max(0, m.balance));
    });
    return { cost: sumMoney(cost), paid: sumMoney(paid), balance: sumMoney(owed) };
  }

  /* Phases are named relative to the day ("6 Months Out"), so the wedding

  function phaseTarget(phase) {

    if (!wed) return null;
    var d = new Date(wed.getTime());
    var m = /(\d+)\s*month/i.exec(phase);
    if (m) {

      d.setDate(1);
      d.setMonth(d.getMonth() - Number(m[1]));
      // Clamp to a shorter month: 31 May minus 3 months is 28/29 Feb.
      var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
      return d;
    }
    if (/week/i.test(phase)) { d.setDate(d.getDate() - 7); return d; }
    return null;
  }

    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  }

  /** done | overdue | now | later | undated, plus what is left to do. */
  function phaseState(p) {
    var left = p.tasks.filter(function (t) { return !t.done; }).length;
    var target = phaseTarget(p.phase);
    var iso = target ? isoOf(target) : '';
    var days = iso ? daysUntil(iso) : null;
    var span = /week/i.test(p.phase) ? 7 : 30;
    var status = !p.tasks.length || left === 0 ? 'done'

      : days < 0 ? 'overdue'
      : days <= span ? 'now'
      : 'later';

  }

  /** Budget state, shared by the Budget tab, Home milestones and health. */
  function budgetState() {
    var planned = [], spent = [], over = [], unplanned = [];
    data.budget.forEach(function (c) {
      var p = money2(c.planned), s = money2(c.spent);
      planned.push(p); spent.push(s);
      if (p > 0 && s > p) over.push(c);
      else if (p === 0 && s > 0) unplanned.push(c);

    return { planned: planned, spent: spent, over: over, unplanned: unplanned,
      notSet: planned === 0, onTrack: planned > 0 && !over.length && !unplanned.length };
  }

  function overduePayments() {
    return data.vendors.filter(function (v) {
