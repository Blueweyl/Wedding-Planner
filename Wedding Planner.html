<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evermore — Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0;
    --card: #fdfaf6;
    --line: #e8e0d6;
    --line-soft: #f0e9e1;
    --ink: #2e2521;
    --body: #6b5d54;
    --muted: #8a7a6e;
    --deep: #4a2f28;
    --blush: #f2e4dc;
    --accent: #a8705a;
    --good: #4a7c59;
    --warn: #c08a3e;
    --over: #b5573f;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select, button { font-family: var(--sans); font-size: 14px; color: var(--ink); }
  input, textarea, select {
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    background: #fff; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; line-height: 1.6; }
  button { cursor: pointer; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--body);
    padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--blush); border-color: var(--accent); }
  .btn-primary { background: var(--deep); color: #fdfaf6; border-color: var(--deep); }
  .btn-primary:hover { background: #3a231e; border-color: #3a231e; color: #fdfaf6; }
  .btn-icon {
    border: none; background: none; color: var(--muted); font-size: 18px;
    line-height: 1; padding: 4px 8px; border-radius: 6px;
  }
  .btn-icon:hover { background: var(--blush); color: var(--over); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  .label {
    font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 500;
  }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; gap: 22px; }

  /* Header */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(250,246,240,.95);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-family: var(--serif); font-size: 21px; font-style: italic; color: var(--deep); white-space: nowrap; }
  .tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .tab {
    border: none; background: none; color: var(--body);
    padding: 8px 14px; border-radius: 18px; font-size: 13.5px; font-weight: 500;
  }
  .tab:hover { background: var(--blush); }
  .tab.active { background: var(--deep); color: #fdfaf6; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Setup screen */
  .setup { max-width: 540px; margin: 0 auto; padding: 60px 24px; }
  .setup h1 { font-family: var(--serif); font-weight: 500; font-size: 42px; line-height: 1.1; margin: 0 0 14px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--body); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select { width: 100%; }

  /* Home */
  .quote {
    background: var(--blush); border-radius: 8px; padding: 20px 26px; margin-bottom: 26px;
    font-family: var(--serif); font-style: italic; font-size: 17.5px; line-height: 1.55; color: var(--deep);
  }
  .stat { font-family: var(--serif); font-size: 52px; font-weight: 600; line-height: 1; color: var(--deep); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; transition: width .3s; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* Lists */
  .list-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 0; border-bottom: 1px solid var(--line-soft);
  }
  .list-row:last-of-type { border-bottom: none; }
  .tag {
    font-size: 10.5px; background: var(--blush); color: var(--deep);
    padding: 3px 9px; border-radius: 10px; white-space: nowrap; font-weight: 500;
  }
  .tag-warn { background: #f7e3d3; color: #8a4a2e; }
  .check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 11px; cursor: pointer; }
  .check input { margin-top: 3px; flex-shrink: 0; cursor: pointer; }
  .check.done span.txt { color: var(--muted); text-decoration: line-through; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 28px 10px; }

  @media (max-width: 640px) {
    .wrap { padding: 22px 16px 60px; }
    .card { padding: 20px; }
    .topbar-inner { padding: 12px 16px; }
    .stat { font-size: 42px; }
    .setup { padding: 40px 18px; }
    .setup h1 { font-size: 32px; }
  }

  /* Keepsake print view */
  .keepsake { max-width: 680px; margin: 0 auto; padding: 50px 28px; }
  @media print {
    @page { margin: 1.4cm; }
    .no-print { display: none !important; }
    body { background: #fff; }
    .keepsake { padding: 0; max-width: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'evermore_planner_v1';

  /* ---------------------------------------------------------------
     Reflections shown on the Home tab. Chosen by planning context so
     the line matches where the couple actually is.
  ----------------------------------------------------------------*/
  var WISDOM = {
    general: [
      "The best marriages aren't built on grand gestures — they're built on choosing each other, quietly, every single day.",
      "Love is deciding, over and over, that this person's happiness matters as much as your own.",
      "The vows matter less than the version of you that keeps them, twenty years from now.",
      "Family isn't who you're born to — it's who you choose to build a life with, on purpose.",
      "Say the hard thing gently. Say the small thing often. That's most of what love actually is.",
      "The best partners aren't the ones who never disappoint you — they're the ones who stay to repair it.",
      "Plan the wedding together. It's practice for planning the life.",
      "You are not merging two lives. You're building a third one, made of both.",
      "A good marriage is two people who keep choosing curiosity over certainty about each other.",
      "The wedding is one day. The marriage is every ordinary Tuesday after it — plan for those, too."
    ],
    budget: [
      "Budgets are just love letters written in numbers — they say what you're willing to sacrifice for.",
      "Money fights are rarely about money. They're about what you each think safety looks like.",
      "A wedding that costs less but starts a marriage without debt is the better deal, every time.",
      "The guest list you can't afford isn't the wedding you're planning — the one you can is."
    ],
    rsvpDone: [
      "Now you know exactly who's showing up for you. Let that be enough for tonight.",
      "A full guest list is just a room full of people who already love you both. You did the hard part."
    ],
    weekOf: [
      "Nothing left to plan now but to notice it happening. Let the small mistakes be funny later.",
      "You will not remember the seating chart. You will remember how you felt walking in."
    ],
    justStarted: [
      "Start with the guest count and the budget. Every other decision hangs off those two.",
      "Book the venue and the date first. Everything else can move; those can't."
    ]
  };

  var STARTER_CATEGORIES = [
    'Venue', 'Catering & Bar', 'Photography', 'Attire & Beauty',
    'Flowers & Decor', 'Music & Entertainment', 'Cake & Desserts',
    'Stationery', 'Rings', 'Transport', 'Thank-You Cards', 'Buffer / Misc'
  ];

  function starterTimeline() {
    return [
      { phase: '12 Months Out', tasks: [
        { text: 'Set your total wedding budget together', done: false, key: true },
        { text: 'Choose your date and overall style', done: false, key: false },
        { text: 'Draft the guest list (this drives everything)', done: false, key: true },
        { text: 'Tour and book your venue', done: false, key: true },
        { text: 'Decide who is paying for what', done: false, key: true }
      ] },
      { phase: '9 Months Out', tasks: [
        { text: 'Book photographer and videographer', done: false, key: false },
        { text: 'Book caterer and schedule a tasting', done: false, key: false },
        { text: 'Choose your wedding party', done: false, key: false },
        { text: 'Check your marriage license requirements and timing', done: false, key: true },
        { text: 'Start shopping for attire', done: false, key: false }
      ] },
      { phase: '6 Months Out', tasks: [
        { text: 'Send save-the-dates', done: false, key: false },
        { text: 'Book florist and decor', done: false, key: false },
        { text: 'Book your officiant', done: false, key: true },
        { text: 'Order attire and schedule fittings', done: false, key: false },
        { text: 'Arrange guest accommodation and transport', done: false, key: false },
        { text: 'Book the honeymoon and check passport expiry', done: false, key: true }
      ] },
      { phase: '3 Months Out', tasks: [
        { text: 'Mail the invitations', done: false, key: false },
        { text: 'Plan the rehearsal dinner', done: false, key: true },
        { text: 'Finalize the menu and drinks', done: false, key: false },
        { text: 'Purchase the rings', done: false, key: false },
        { text: 'Write your vows (start early — it takes longer than you think)', done: false, key: true },
        { text: 'Book hair and makeup trials', done: false, key: false }
      ] },
      { phase: '1 Month Out', tasks: [
        { text: 'Give the caterer your final headcount', done: false, key: false },
        { text: 'Schedule all final vendor payments', done: false, key: true },
        { text: 'Book your marriage license appointment', done: false, key: true },
        { text: 'Build the seating chart', done: false, key: false },
        { text: 'Confirm timings with every vendor', done: false, key: true },
        { text: 'Set aside a thank-you card budget', done: false, key: true }
      ] },
      { phase: 'Week Of', tasks: [
        { text: 'Hold the rehearsal', done: false, key: false },
        { text: 'Pack an emergency kit (pins, plasters, stain pen, snacks)', done: false, key: true },
        { text: 'Confirm a weather backup plan', done: false, key: true },
        { text: 'Delegate day-of tasks to someone other than you two', done: false, key: true },
        { text: 'Prepare vendor tips and final envelopes', done: false, key: false },
        { text: 'Put your phone down and eat a real meal', done: false, key: false }
      ] }
    ];
  }

  function defaultData() {
    return {
      setupDone: false,
      profile: { partnerA: '', partnerB: '', date: '', vibe: '', story: '' },
      budget: STARTER_CATEGORIES.map(function (n) {
        return { name: n, planned: 0, spent: 0 };
      }),
      guests: [],
      vendors: [],
      timeline: starterTimeline(),
      diary: [],
      vows: { tone: 'Heartfelt', opening: '', memory: '', promises: '', closing: '' }
    };
  }

  /* ---------------- state ---------------- */

  var data = load();
  var tab = 'home';
  var view = 'app';           // 'app' | 'keepsake'
  var draft = { guest: '', diaryText: '', diaryMood: 'Joyful', diaryDate: today() };

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return migrate(JSON.parse(raw));
    } catch (e) {}
    return defaultData();
  }

  function migrate(d) {
    var base = defaultData();
    if (!d || typeof d !== 'object') return base;
    // Fill in anything a older/partial save is missing so the app never
    // renders against an undefined branch.
    d.profile = Object.assign({}, base.profile, d.profile || {});
    d.vows = Object.assign({}, base.vows, d.vows || {});
    if (!Array.isArray(d.budget)) d.budget = base.budget;
    if (!Array.isArray(d.guests)) d.guests = [];
    if (!Array.isArray(d.vendors)) d.vendors = [];
    if (!Array.isArray(d.diary)) d.diary = [];
    if (!Array.isArray(d.timeline) || !d.timeline.length) d.timeline = base.timeline;
    d.setupDone = !!d.setupDone;
    return d;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
  }

  /* ---------------- helpers ---------------- */

  function today() { return new Date().toISOString().slice(0, 10); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return '$' + v.toLocaleString();
  }

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(s) {
    var d = parseDate(s);
    if (!d) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function daysUntil(s) {
    var d = parseDate(s);
    if (!d) return null;
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((d - now) / 86400000);
  }

  function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }

  function coupleName() {
    var a = (data.profile.partnerA || '').trim();
    var b = (data.profile.partnerB || '').trim();
    if (a && b) return a + ' & ' + b;
    return a || b || 'Our Wedding';
  }

  /* ---------------- derived ---------------- */

  function health() {
    var all = [];
    data.timeline.forEach(function (p) { all = all.concat(p.tasks); });
    var total = all.length;
    var done = all.filter(function (t) { return t.done; }).length;
    var score = total ? Math.round((done / total) * 100) : 0;
    var gaps = [];

    all.forEach(function (t) {
      if (t.key && !t.done) gaps.push(t.text);
    });

    var over = data.budget.filter(function (c) { return c.spent > c.planned && c.planned > 0; });
    if (over.length) {
      score -= 4 * over.length;
      gaps.unshift('Over budget on ' + over.map(function (c) { return c.name; }).join(', '));
    }

    var pending = data.guests.filter(function (g) { return g.status === 'Pending'; }).length;
    if (pending) gaps.push(pending + ' RSVP' + (pending > 1 ? 's' : '') + ' still outstanding');

    return { score: Math.max(0, Math.min(100, score)), gaps: gaps, done: done, total: total };
  }

  function wisdomLine() {
    var left = daysUntil(data.profile.date);
    var over = data.budget.some(function (c) { return c.spent > c.planned && c.planned > 0; });
    var rsvpDone = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });
    var h = health();
    var pool;
    if (left !== null && left <= 14 && left >= 0) pool = WISDOM.weekOf;
    else if (over) pool = WISDOM.budget;
    else if (rsvpDone) pool = WISDOM.rsvpDone;
    else if (h.done <= 2) pool = WISDOM.justStarted;
    else pool = WISDOM.general;
    var n = new Date();
    return pick(pool, n.getDate() + n.getMonth());
  }

  /* ---------------- render ---------------- */

  var app = document.getElementById('app');

  function render() {
    if (!data.setupDone) { app.innerHTML = setupView(); return; }
    if (view === 'keepsake') { app.innerHTML = keepsakeView(); return; }
    app.innerHTML = topbar() + '<div class="wrap">' + tabView() + '</div>';
  }

  function setupView() {
    var p = data.profile;
    return '' +
      '<div class="setup">' +
        '<div class="label" style="margin-bottom:14px;">Welcome</div>' +
        '<h1>Let\'s set up<br>your wedding.</h1>' +
        '<p style="color:var(--body);margin:0 0 30px;">Everything you enter stays on this computer. ' +
        'You can change any of it later.</p>' +

        '<div class="field"><label>Your name</label>' +
        '<input id="su-a" value="' + esc(p.partnerA) + '" placeholder="e.g. Alex" autofocus></div>' +

        '<div class="field"><label>Your partner\'s name</label>' +
        '<input id="su-b" value="' + esc(p.partnerB) + '" placeholder="e.g. Sam"></div>' +

        '<div class="field"><label>Wedding date <span class="muted">(a rough guess is fine)</span></label>' +
        '<input id="su-date" type="date" value="' + esc(p.date) + '"></div>' +

        '<div class="field"><label>The vibe you\'re going for</label>' +
        '<input id="su-vibe" value="' + esc(p.vibe) + '" placeholder="e.g. cozy backyard, black tie, beach at sunset"></div>' +

        '<button class="btn btn-primary" style="padding:13px 30px;font-size:14px;margin-top:8px;" ' +
        'onclick="APP.finishSetup()">Start planning</button>' +
      '</div>';
  }

  function topbar() {
    var tabs = [
      ['home', 'Home'], ['budget', 'Budget'], ['guests', 'Guests'],
      ['timeline', 'Timeline'], ['vendors', 'Vendors'], ['diary', 'Diary'],
      ['vows', 'Vows'], ['settings', 'Settings']
    ];
    var btns = tabs.map(function (t) {
      return '<button class="tab' + (tab === t[0] ? ' active' : '') + '" ' +
             'onclick="APP.go(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('');

    return '' +
      '<div class="topbar"><div class="topbar-inner">' +
        '<div class="brand">' + esc(coupleName()) + '</div>' +
        '<div class="tabs">' + btns + '</div>' +
      '</div></div>';
  }

  function tabView() {
    switch (tab) {
      case 'budget': return budgetView();
      case 'guests': return guestsView();
      case 'timeline': return timelineView();
      case 'vendors': return vendorsView();
      case 'diary': return diaryView();
      case 'vows': return vowsView();
      case 'settings': return settingsView();
      default: return homeView();
    }
  }

  /* ---------------- home ---------------- */

  function homeView() {
    var h = health();
    var left = daysUntil(data.profile.date);
    var color = h.score >= 70 ? 'var(--good)' : h.score >= 40 ? 'var(--warn)' : 'var(--over)';

    var count;
    if (left === null) count = '<div class="stat">—</div><div class="muted" style="margin-top:8px;">Add your date in Settings</div>';
    else if (left > 0) count = '<div class="stat">' + left + '</div><div class="muted" style="margin-top:8px;">days to go — ' + esc(fmtDate(data.profile.date)) + '</div>';
    else if (left === 0) count = '<div class="stat serif" style="font-size:38px;">Today</div><div class="muted" style="margin-top:8px;">It\'s today. Go get married.</div>';
    else count = '<div class="stat serif" style="font-size:34px;">Married</div><div class="muted" style="margin-top:8px;">' + esc(fmtDate(data.profile.date)) + '</div>';

    var gaps = h.gaps.length
      ? h.gaps.slice(0, 3).map(function (g) {
          return '<div style="font-size:13.5px;color:var(--body);margin-bottom:7px;">· ' + esc(g) + '</div>';
        }).join('')
      : '<div style="font-size:13.5px;color:var(--body);">Nothing urgent — you\'re in good shape.</div>';

    // Counts either source of truth: the timeline checkbox, or a venue vendor
    // the couple has actually committed to. Otherwise the two disagree.
    var COMMITTED = ['Deposit Paid', 'Contracted', 'Paid in Full'];
    var venueBooked =
      data.timeline.some(function (p) {
        return p.tasks.some(function (t) { return /venue/i.test(t.text) && t.done; });
      }) ||
      data.vendors.some(function (v) {
        return /venue/i.test((v.category || '') + ' ' + (v.name || '')) &&
               COMMITTED.indexOf(v.status) !== -1;
      });
    var onBudget = !data.budget.some(function (c) { return c.spent > c.planned && c.planned > 0; });
    var rsvpIn = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });

    function milestone(label, on) {
      return '<div class="row" style="margin-bottom:12px;gap:11px;">' +
        '<div class="dot" style="background:' + (on ? 'var(--good)' : 'var(--line)') + ';"></div>' +
        '<div style="font-size:13.5px;color:var(--body);">' + label + '</div></div>';
    }

    return '' +
      '<div class="quote">"' + esc(wisdomLine()) + '"</div>' +

      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:22px;">' +

        '<div class="card" style="text-align:center;">' +
          '<div class="label" style="margin-bottom:12px;">Countdown</div>' + count +
          (data.profile.vibe ? '<div class="muted" style="margin-top:10px;font-style:italic;">' + esc(data.profile.vibe) + '</div>' : '') +
        '</div>' +

        '<div class="card">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:14px;">' +
            '<div class="label">Planning Health</div>' +
            '<div class="serif" style="font-size:30px;font-weight:600;color:' + color + ';">' + h.score + '</div>' +
          '</div>' +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' + h.score + '%;background:' + color + ';"></div></div>' +
          gaps +
        '</div>' +

        '<div class="card">' +
          '<div class="label" style="margin-bottom:14px;">Milestones</div>' +
          milestone('Venue booked', venueBooked) +
          milestone('Budget on track', onBudget) +
          milestone('All RSVPs in', rsvpIn) +
          milestone('Vows written', (data.vows.promises || '').trim().length > 40) +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="serif" style="font-size:22px;font-weight:600;margin-bottom:6px;">Our Story</div>' +
        '<div class="muted" style="margin-bottom:12px;">How you met, or anything you want to remember later.</div>' +
        '<textarea rows="4" style="width:100%;" placeholder="We met when..." ' +
        'oninput="APP.setStory(this.value)">' + esc(data.profile.story) + '</textarea>' +
      '</div>';
  }

  /* ---------------- budget ---------------- */

  function budgetView() {
    var planned = data.budget.reduce(function (a, c) { return a + (Number(c.planned) || 0); }, 0);
    var spent = data.budget.reduce(function (a, c) { return a + (Number(c.spent) || 0); }, 0);
    var over = data.budget.filter(function (c) { return c.spent > c.planned && c.planned > 0; });

    var warn = over.length
      ? '<div class="quote" style="font-family:var(--sans);font-style:normal;font-size:14px;">' +
        '<strong style="color:var(--over);">Heads up — </strong>' +
        esc(over.map(function (c) { return c.name + ' is ' + money(c.spent - c.planned) + ' over'; }).join(', ')) + '.' +
        '<div class="serif" style="font-style:italic;font-size:15px;margin-top:8px;">"' +
        esc(pick(WISDOM.budget, new Date().getDate())) + '"</div></div>'
      : '';

    var rows = data.budget.map(function (c, i) {
      var p = Number(c.planned) || 0;
      var s = Number(c.spent) || 0;
      var isOver = s > p && p > 0;
      // Each bar shows how much of THAT category's own budget is used, so a
      // small category running over still reads as full rather than a sliver.
      var w = p > 0 ? Math.min(100, (s / p) * 100) : (s > 0 ? 100 : 0);
      return '' +
        '<div style="padding:14px 0;border-bottom:1px solid var(--line-soft);">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:9px;">' +
            '<input value="' + esc(c.name) + '" style="border:none;background:none;font-weight:600;font-size:15px;padding:4px 0;min-width:140px;flex:1;" ' +
            'oninput="APP.budgetField(' + i + ',\'name\',this.value)">' +
            '<div class="row" style="gap:7px;">' +
              '<span class="muted">planned</span>' +
              '<input type="number" min="0" step="50" value="' + (Number(c.planned) || 0) + '" style="width:92px;" ' +
              'onchange="APP.budgetNum(' + i + ',\'planned\',this.value)">' +
              '<span class="muted">spent</span>' +
              '<input type="number" min="0" step="50" value="' + (Number(c.spent) || 0) + '" style="width:92px;" ' +
              'onchange="APP.budgetNum(' + i + ',\'spent\',this.value)">' +
              '<button class="btn-icon" title="Remove" onclick="APP.budgetRemove(' + i + ')">&times;</button>' +
            '</div>' +
          '</div>' +
          '<div class="bar"><div style="width:' + w + '%;background:' + (isOver ? 'var(--over)' : 'var(--accent)') + ';"></div></div>' +
        '</div>';
    }).join('');

    var remaining = planned - spent;

    return warn +
      '<div class="row" style="gap:34px;margin-bottom:22px;">' +
        '<div><div class="label">Planned</div><div class="serif" style="font-size:28px;font-weight:600;">' + money(planned) + '</div></div>' +
        '<div><div class="label">Spent</div><div class="serif" style="font-size:28px;font-weight:600;">' + money(spent) + '</div></div>' +
        '<div><div class="label">Remaining</div><div class="serif" style="font-size:28px;font-weight:600;color:' +
          (remaining < 0 ? 'var(--over)' : 'var(--good)') + ';">' + money(remaining) + '</div></div>' +
      '</div>' +
      '<div class="card">' + rows +
        '<button class="btn" style="margin-top:16px;" onclick="APP.budgetAdd()">+ Add category</button>' +
      '</div>';
  }

  /* ---------------- guests ---------------- */

  function guestsView() {
    var g = data.guests;
    var yes = g.filter(function (x) { return x.status === 'Yes'; }).length;
    var no = g.filter(function (x) { return x.status === 'No'; }).length;
    var pend = g.filter(function (x) { return x.status === 'Pending'; }).length;
    var plus = g.filter(function (x) { return x.plusOne && x.status === 'Yes'; }).length;

    function stat(n, l) {
      return '<div><span style="font-weight:600;font-size:17px;">' + n + '</span> <span class="muted">' + l + '</span></div>';
    }

    var rows = g.length ? g.map(function (x, i) {
      return '' +
        '<div class="list-row">' +
          '<input value="' + esc(x.name) + '" style="border:none;background:none;flex:1;min-width:130px;font-size:14.5px;" ' +
          'oninput="APP.guestField(' + i + ',\'name\',this.value)">' +
          '<select onchange="APP.guestField(' + i + ',\'status\',this.value,true)">' +
            ['Pending', 'Yes', 'No'].map(function (s) {
              return '<option' + (x.status === s ? ' selected' : '') + '>' + s + '</option>';
            }).join('') +
          '</select>' +
          '<input value="' + esc(x.meal || '') + '" placeholder="meal" style="width:120px;" ' +
          'oninput="APP.guestField(' + i + ',\'meal\',this.value)">' +
          '<label class="row" style="gap:5px;font-size:13px;color:var(--body);cursor:pointer;">' +
            '<input type="checkbox"' + (x.plusOne ? ' checked' : '') + ' onchange="APP.guestPlus(' + i + ',this.checked)"> +1' +
          '</label>' +
          '<button class="btn-icon" onclick="APP.guestRemove(' + i + ')">&times;</button>' +

    return '' +
      '<div class="row" style="gap:24px;margin-bottom:20px;">' +
        stat(g.length + plus, 'attending total') + stat(yes, 'yes') + stat(no, 'no') +
        stat(pend, 'pending') + stat(plus, 'plus-ones') +
      '</div>' +
      '<div class="card">' + rows +
        '<div class="row" style="gap:8px;margin-top:18px;">' +
          '<input id="guest-input" placeholder="Add a guest name" style="flex:1;min-width:180px;" ' +
          'onkeydown="if(event.key===\'Enter\')APP.guestAdd()">' +
          '<button class="btn btn-primary" onclick="APP.guestAdd()">Add</button>' +
          '<button class="btn" onclick="APP.exportCsv()">Export CSV</button>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- timeline ---------------- */

  function timelineView() {
    var cards = data.timeline.map(function (p, pi) {
      var done = p.tasks.filter(function (t) { return t.done; }).length;
      var tasks = p.tasks.map(function (t, ti) {
        return '' +
          '<label class="check' + (t.done ? ' done' : '') + '">' +
            '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="APP.toggleTask(' + pi + ',' + ti + ')">' +
            '<span class="txt" style="font-size:13.5px;line-height:1.45;">' + esc(t.text) +
            (t.key && !t.done ? ' <span class="tag tag-warn">often missed</span>' : '') +
            '</span>' +
          '</label>';
      }).join('');

      return '' +
        '<div class="card">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:14px;">' +
            '<div class="serif" style="font-size:19px;font-weight:600;">' + esc(p.phase) + '</div>' +
            '<div class="muted">' + done + ' / ' + p.tasks.length + '</div>' +
          '</div>' +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' +
            (p.tasks.length ? (done / p.tasks.length) * 100 : 0) + '%;background:var(--good);"></div></div>' +
          tasks +
        '</div>';
    }).join('');

    return '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));">' + cards + '</div>';

  /* ---------------- vendors ---------------- */

            '<input value="' + esc(v.category || '') + '" placeholder="category" style="width:130px;" ' +

            '<input value="' + esc(v.contact || '') + '" placeholder="email or phone" style="width:190px;" ' +

            '<span>deposit due <input type="date" value="' + esc(v.deposit || '') + '" style="font-size:12.5px;padding:5px 7px;" ' +
            'onchange="APP.vendorField(' + i + ',\'deposit\',this.value,true)"></span>' +

  function diaryView() {

              '<label class="row" style="gap:5px;font-size:12.5px;color:var(--body);cursor:pointer;">' +

      '<div class="card" style="margin-bottom:20px;">' +

        '<div class="row" style="justify-content:space-between;margin-top:12px;">' +
          '<button class="btn btn-primary" onclick="APP.diaryAdd()">Save entry</button>' +
          '<button class="btn" onclick="APP.openKeepsake()">Compile keepsake</button>' +
        '</div>' +
      '</div>' + entries;
  }

  /* ---------------- vows ---------------- */

  function vowsView() {
    var v = data.vows;
    var notes = {
      Heartfelt: 'Keep it warm and sincere — say the true thing, even if your voice shakes.',
      Funny: 'A little humor never hurts, but let one line be completely serious.',
      Traditional: 'Classic and steady — built to be read aloud calmly.',
      Short: 'Under a minute. Every word has to earn its place.'
    };

    var tones = ['Heartfelt', 'Funny', 'Traditional', 'Short'].map(function (t) {
      var on = v.tone === t;
      return '<button class="btn' + (on ? ' btn-primary' : '') + '" style="padding:8px 16px;" ' +
             'onclick="APP.setTone(\'' + t + '\')">' + t + '</button>';
    }).join('');

    var words = (v.opening + ' ' + v.memory + ' ' + v.promises + ' ' + v.closing)
      .trim().split(/\s+/).filter(Boolean).length;
    var wColor = words < 120 ? 'var(--muted)' : words <= 260 ? 'var(--good)' : 'var(--warn)';
    var wNote = words === 0 ? 'Start anywhere — the middle is fine.'
      : words < 120 ? 'Still finding your words — keep going.'
      : words <= 260 ? 'That\'s about right for one to two minutes.'
      : 'Getting long — consider trimming.';
    var secs = Math.round((words / 130) * 60);
    var speak = secs < 60 ? secs + ' sec' : (Math.round(secs / 6) / 10) + ' min';

    function block(key, title, hint, rows) {
      return '' +
        '<div style="margin-bottom:22px;">' +
          '<div class="label" style="margin-bottom:5px;">' + title + '</div>' +
          '<div class="muted" style="margin-bottom:8px;">' + hint + '</div>' +
          '<textarea rows="' + rows + '" style="width:100%;" oninput="APP.setVow(\'' + key + '\',this.value)">' +
          esc(v[key]) + '</textarea>' +
        '</div>';
    }

    return '' +
      '<div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr);align-items:start;">' +
        '<div class="card">' +
          '<div class="row" style="gap:8px;margin-bottom:14px;">' + tones + '</div>' +
          '<div class="serif" style="font-style:italic;font-size:15px;color:var(--body);margin-bottom:24px;">' +
            esc(notes[v.tone] || '') + '</div>' +
          block('opening', 'Opening line', 'A first line that sounds like you, not like a wedding.', 2) +
          block('memory', 'A shared memory', 'What is the moment you knew this was it?', 3) +
          block('promises', 'Your promises', 'What promise matters most, on an ordinary day?', 5) +
          block('closing', 'Closing line', 'The last thing they hear before "I do."', 2) +
        '</div>' +
        '<div class="card">' +
          '<div class="label" style="margin-bottom:8px;">Word count</div>' +
          '<div class="serif" style="font-size:38px;font-weight:600;color:' + wColor + ';">' + words + '</div>' +
          '<div class="muted" style="margin:8px 0 16px;">' + wNote + '</div>' +
          '<div class="muted">About ' + speak + ' spoken aloud.</div>' +
          '<div class="muted" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">' +
            'Read them out loud before the day. They always sound different in your mouth than on the page.' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- keepsake ---------------- */

          (data.profile.date ? '<div class="muted" style="margin-top:8px;">' + esc(fmtDate(data.profile.date)) + '</div>' : '') +
          '<div class="label" style="margin-top:12px;">Our Story</div>' +

        (story ? '<div class="serif" style="font-size:18px;line-height:1.75;text-align:center;margin-bottom:40px;white-space:pre-wrap;">' + esc(story) + '</div>' : '') +

  /* ---------------- actions ---------------- */

  // Text inputs call the *quiet* path: state + save, no re-render, so the
  // caret never jumps mid-word. Anything structural re-renders.
  function quiet() { save(); }
  function loud() { save(); render(); }

  var APP = {
    go: function (t) { tab = t; window.scrollTo(0, 0); render(); },

    finishSetup: function () {
      data.profile.partnerA = (document.getElementById('su-a').value || '').trim();
      data.profile.partnerB = (document.getElementById('su-b').value || '').trim();
      data.profile.date = document.getElementById('su-date').value;
      data.profile.vibe = (document.getElementById('su-vibe').value || '').trim();
      data.setupDone = true;
      loud();
    },

    profile: function (k, v, re) { data.profile[k] = v; re ? loud() : quiet(); },
    setStory: function (v) { data.profile.story = v; quiet(); },

    budgetField: function (i, k, v) { data.budget[i][k] = v; quiet(); },
    budgetNum: function (i, k, v) { data.budget[i][k] = Math.max(0, Number(v) || 0); loud(); },
    budgetAdd: function () { data.budget.push({ name: 'New category', planned: 0, spent: 0 }); loud(); },
    budgetRemove: function (i) { data.budget.splice(i, 1); loud(); },

    guestField: function (i, k, v, re) { data.guests[i][k] = v; re ? loud() : quiet(); },
    guestPlus: function (i, v) { data.guests[i].plusOne = v; loud(); },
    guestRemove: function (i) { data.guests.splice(i, 1); loud(); },
    guestAdd: function () {
      var el = document.getElementById('guest-input');
      var name = (el.value || '').trim();
      if (!name) { el.focus(); return; }
      data.guests.push({ name: name, status: 'Pending', meal: '', plusOne: false });
      loud();
      var next = document.getElementById('guest-input');
      if (next) next.focus();
    },

    toggleTask: function (p, t) {
      data.timeline[p].tasks[t].done = !data.timeline[p].tasks[t].done;
      loud();
    },

    vendorField: function (i, k, v, re) { data.vendors[i][k] = v; re ? loud() : quiet(); },
    vendorAdd: function () {
      data.vendors.push({ name: '', category: '', contact: '', status: 'Inquiring', deposit: '', final: '' });
      loud();
    },
    vendorRemove: function (i) { data.vendors.splice(i, 1); loud(); },

    draftSet: function (k, v) { draft[k] = v; },
    diaryAdd: function () {
      var text = (draft.diaryText || '').trim();
      if (!text) { var t = document.getElementById('d-text'); if (t) t.focus(); return; }
      data.diary.push({ date: draft.diaryDate || today(), text: text, mood: draft.diaryMood, shared: false });
      draft.diaryText = '';
      loud();
    },
    diaryShare: function (i, v) { data.diary[i].shared = v; quiet(); },
    diaryRemove: function (i) { data.diary.splice(i, 1); loud(); },

    setTone: function (t) { data.vows.tone = t; loud(); },
    setVow: function (k, v) {
      data.vows[k] = v;
      save();
      // live-update just the counter so typing stays smooth
      var words = (data.vows.opening + ' ' + data.vows.memory + ' ' + data.vows.promises + ' ' + data.vows.closing)
        .trim().split(/\s+/).filter(Boolean).length;
      var el = document.querySelector('.card .serif[style*="38px"]');
      if (el) el.textContent = words;
    },

    openKeepsake: function () { view = 'keepsake'; window.scrollTo(0, 0); render(); },
    closeKeepsake: function () { view = 'app'; render(); },

    exportJson: function () {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      download(blob, 'wedding-planner-backup.json');
    },

    importJson: function (ev) {
      var file = ev.target.files && ev.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          data = migrate(JSON.parse(reader.result));
          loud();
        } catch (e) {
          alert('That file could not be read as a backup.');
        }
      };
      reader.readAsText(file);
      ev.target.value = '';
    },

    exportCsv: function () {
      var rows = [['Name', 'RSVP', 'Meal', 'Plus One']].concat(data.guests.map(function (g) {
        return [g.name, g.status, g.meal || '', g.plusOne ? 'Yes' : 'No'];
      }));
      var csv = rows.map(function (r) {
        return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\r\n');
      download(new Blob([csv], { type: 'text/csv' }), 'guest-list.csv');
    },

    reset: function () {
      if (!confirm('Erase everything and start over? This cannot be undone.')) return;
      data = defaultData();
      tab = 'home';
      loud();
    }
  };

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  window.APP = APP;
  render();
})();
</script>
</body>
</html>
