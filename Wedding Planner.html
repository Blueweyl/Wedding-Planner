             paymentFlag(v.final, finalPaid(v)) === 'overdue';
    });
  }

  /** Confirmed attendance: yes guests plus the plus-ones they confirmed. */
  function attendance() {
    var yes = data.guests.filter(function (g) { return g.status === 'Yes'; });
    var plus = yes.filter(function (g) { return g.plusOne === true; }).length;
    return { yes: yes.length, plusOnes: plus, attending: yes.length + plus,
      no: data.guests.filter(function (g) { return g.status === 'No'; }).length,
      pending: data.guests.filter(function (g) { return g.status === 'Pending'; }).length,
      invited: data.guests.length };
  }

  function duplicateNameKeys() {
    var counts = {}, dupes = {};
    data.guests.forEach(function (g) {
      var k = normName(g.name);
      if (!k) return;
      counts[k] = (counts[k] || 0) + 1;
      if (counts[k] > 1) dupes[k] = true;
    });
    return dupes;
  }

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(s) {
    var d = parseDate(s);
    if (!d) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function daysUntil(s) {
    var d = parseDate(s);
    if (!d) return null;
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((d - now) / 86400000);
  }

  function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }

  function coupleName() {
    var a = (data.profile.partnerA || '').trim();
    var b = (data.profile.partnerB || '').trim();
    if (a && b) return a + ' & ' + b;
    return a || b || 'Our Wedding';
  }

  /* ---------------- derived ---------------- */

  function health() {
    var all = [];
    data.timeline.forEach(function (p) { all = all.concat(p.tasks); });
    var total = all.length;
    var done = all.filter(function (t) { return t.done; }).length;
    var score = total ? Math.round((done / total) * 100) : 0;
    var gaps = [];

    all.forEach(function (t) {
      if (t.key && !t.done) gaps.push(t.text);
    });

    var b = budgetState();
    if (b.over.length) {
      score -= 4 * b.over.length;
      gaps.unshift('Over budget on ' + b.over.map(function (c) { return c.name; }).join(', '));
    }
    if (b.unplanned.length) {
      score -= 4 * b.unplanned.length;
      gaps.unshift('Unplanned spending on ' + b.unplanned.map(function (c) { return c.name; }).join(', '));
    }
    if (b.notSet) gaps.push('No budget planned yet');

    var pending = data.guests.filter(function (g) { return g.status === 'Pending'; }).length;
    if (pending) gaps.push(pending + ' RSVP' + (pending > 1 ? 's' : '') + ' still outstanding');

    // A missed payment date is the most time-critical gap, so it leads.
    var late = overduePayments();
    if (late.length) {
      score -= 5 * late.length;
      gaps.unshift('Payment overdue for ' + late.map(function (v) { return v.name || 'a vendor'; }).join(', '));
    }

    return { score: Math.max(0, Math.min(100, score)), gaps: gaps, done: done, total: total };
  }

  function wisdomLine() {
    var left = daysUntil(data.profile.date);
    var bs = budgetState();
    var over = bs.over.length > 0 || bs.unplanned.length > 0;
    var rsvpDone = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });
    var h = health();
    var pool;
    if (left !== null && left <= 14 && left >= 0) pool = WISDOM.weekOf;
    else if (over) pool = WISDOM.budget;
    else if (rsvpDone) pool = WISDOM.rsvpDone;
    else if (h.done <= 2) pool = WISDOM.justStarted;
    else pool = WISDOM.general;
    var n = new Date();
    return pick(pool, n.getDate() + n.getMonth());
  }

  /* ---------------- render ---------------- */

  var app = document.getElementById('app');
  var warnBox = document.getElementById('warnings');

  function render() {
    updateWarnings();
    if (!data.setupDone) { app.innerHTML = setupView(); }
    else if (view === 'keepsake') { app.innerHTML = keepsakeView(); }
    else { app.innerHTML = topbar() + undoBar() + '<div class="wrap">' + tabView() + '</div>'; }
    updateOfflineStatus();
  }

  /* Warnings live outside #app so they can appear while the couple is typing
     without re-rendering the tab (which would move the caret). */
  function updateWarnings() {
    if (!warnBox) return;
    var html = '';
    if (saveFailed) {
      html += '<div class="warn-bar" role="alert">' +
        '<div><strong>Your last change is not saved.</strong> This browser refused to store it \u2014 it may be ' +
        'full, or in private mode. Nothing you typed was lost, but it will go when you close this tab. ' +
        'Save a backup file now.</div>' +
        '<div class="row" style="gap:8px;">' +
          '<button class="btn" onclick="APP.exportJson()">Save backup file</button>' +
          '<button class="btn" onclick="APP.retrySave()">Try saving again</button>' +
        '</div></div>';
    }
    if (loadFailed) {
      html += '<div class="warn-bar warn-soft" role="alert">' +
        '<div><strong>Saved data in this browser could not be read.</strong> ' +
        (rescued
          ? 'A copy of it has been put safely to one side, so nothing is lost by carrying on. ' +
            'Restore your latest backup from Settings, or download the unreadable copy and send it to support.'
          : 'This browser would not let us copy it aside, so save a backup of anything new before you close the tab, ' +
            'and restore your latest backup from Settings.') + '</div>' +
        '<div class="row" style="gap:8px;">' +
          (rescued ? '<button class="btn" onclick="APP.downloadRescue()">Download unreadable copy</button>' : '') +
          '<button class="btn" onclick="APP.dismissLoadWarning()">Dismiss</button>' +
        '</div></div>';
    }
    if (loadRepairs > 0 && !loadFailed) {
      html += '<div class="warn-bar warn-info" role="status">' +
        '<div>Your plan opened, but ' + loadRepairs + ' damaged field' + (loadRepairs === 1 ? ' was' : 's were') +
        ' reset to a safe default (an unreadable date or amount, for example). Everything else is exactly as you left it.</div>' +
        '<button class="btn" onclick="APP.dismissRepairs()">OK</button></div>';
    }
    if (pwaState() === 'update') {
      html += '<div class="warn-bar warn-soft" role="status">' +
        '<div><strong>A newer version of the planner is ready.</strong> Reload to use it. ' +
        'Your plan stays exactly as it is.</div>' +
        '<button class="btn" onclick="APP.applyUpdate()">Reload</button></div>';
    }
    if (pwaState() === 'failed' && !pwaWarnHidden) {
      html += '<div class="warn-bar warn-soft" role="status">' +
        '<div>Offline mode could not be set up on this device, so the planner needs a connection ' +
        'to open. Everything else works as normal, and your plan is still saved here.</div>' +
        '<button class="btn" onclick="APP.dismissOfflineWarning()">Dismiss</button></div>';
    }
    if (hostedCopy() && !deviceNoteDone) {
      html += '<div class="warn-bar warn-info" role="status">' +
        '<div><strong>This device keeps its own plan.</strong> It does not sync with your computer ' +
        'or any other phone — nothing is sent anywhere. If you have already planned elsewhere, ' +
        'restore your latest backup file here first.</div>' +
        '<div class="row" style="gap:8px;">' +
          '<label class="btn" style="display:inline-block;">Restore latest backup' +
            '<input type="file" accept="application/json,.json" style="display:none;" ' +
            'onchange="APP.dismissDeviceNote();APP.importJson(event)">' +
          '</label>' +
          '<button class="btn" onclick="APP.dismissDeviceNote()">Got it</button>' +
        '</div></div>';
    }
    // Rewriting identical markup would reset a half-finished file pick and
    // costs a layout on every keystroke, so only real changes are written.
    if (warnBox.getAttribute('data-html') === html) return;
    warnBox.setAttribute('data-html', html);
    warnBox.innerHTML = html;
  }

  /* Updated in place for the same reason as the warning bars: the worker can
     report in at any moment, including mid-sentence. */
  function updateOfflineStatus() {
    var el = document.getElementById('offline-status');
    if (!el) return;
    var line = offlineLine();
    el.textContent = line;
    el.style.display = line ? '' : 'none';
  }

  /* Shown and hidden in place: re-rendering the tab mid-word would move
     the caret out from under the couple. */
  function updateSettingsError() {
    var el = document.getElementById('settings-error');
    if (!el) return;
    el.textContent = settingsError;
    el.style.display = settingsError ? '' : 'none';
  }

  function undoBar() {
    if (!undoable) return '';
    return '<div class="undo-bar" role="status">' +
      '<div>' + esc(undoable.text || ('Removed ' + undoable.label + '.')) + '</div>' +
      '<div class="row" style="gap:8px;">' +
        '<button class="btn" onclick="APP.undo()">Undo</button>' +
        '<button class="btn-icon" aria-label="Dismiss undo notice" title="Dismiss" onclick="APP.dismissUndo()">&times;</button>' +
      '</div></div>';
  }

  function setupView() {
    var p = setupDraft || data.profile;
    return '' +
      '<div class="setup">' +
        '<div class="label" style="margin-bottom:14px;">Welcome</div>' +
        '<h1>Let\'s set up<br>your wedding.</h1>' +
        '<p style="color:var(--body);margin:0 0 30px;">Everything you enter stays on this computer. ' +
        'You can change any of it later.</p>' +

        '<div class="field"><label for="su-a">Your name</label>' +
        '<input id="su-a" value="' + esc(p.partnerA) + '" placeholder="e.g. Alex" autofocus></div>' +

        '<div class="field"><label for="su-b">Your partner\'s name</label>' +
        '<input id="su-b" value="' + esc(p.partnerB) + '" placeholder="e.g. Sam"></div>' +

        '<div class="field"><label for="su-date">Wedding date <span class="muted">(a rough guess is fine)</span></label>' +
        '<input id="su-date" type="date" value="' + esc(p.date) + '"></div>' +

        '<div class="field"><label for="su-vibe">The vibe you\'re going for <span class="muted">(optional)</span></label>' +
        '<input id="su-vibe" value="' + esc(p.vibe) + '" placeholder="e.g. cozy backyard, black tie, beach at sunset"></div>' +

        (setupError
          ? '<div class="notice" role="alert" style="margin-bottom:16px;">' + esc(setupError) + '</div>'
          : '') +

        '<button class="btn btn-primary" style="padding:13px 30px;font-size:14px;margin-top:8px;" ' +
        'onclick="APP.finishSetup()">Start planning</button>' +
      '</div>';
  }

  function topbar() {
    var tabs = [
      ['home', 'Home'], ['concierge', 'Concierge'], ['budget', 'Budget'], ['guests', 'Guests'],
      ['timeline', 'Timeline'], ['vendors', 'Vendors'], ['diary', 'Diary'],
      ['vows', 'Vows'], ['settings', 'Settings']
    ];
    var btns = tabs.map(function (t) {
      var on = tab === t[0];
      return '<button type="button" class="tab' + (on ? ' active' : '') + '"' +
             (on ? ' aria-current="page"' : '') +
             ' onclick="APP.go(\'' + t[0] + '\')">' + t[1] +
             (t[0] === 'concierge' ? '<span class="tab-spark" aria-hidden="true">\u2726</span>' : '') + '</button>';
    }).join('');

    return '' +
      '<div class="topbar"><div class="topbar-inner">' +
        '<div class="brand">' + esc(coupleName()) + '</div>' +
        '<nav class="tabs" aria-label="Planner sections">' + btns + '</nav>' +
      '</div></div>';
  }

  function tabView() {
    switch (tab) {
      case 'budget': return budgetView();
      case 'guests': return guestsView();
      case 'timeline': return timelineView();
      case 'vendors': return vendorsView();
      case 'diary': return diaryView();
      case 'vows': return vowsView();
      case 'settings': return settingsView();
      case 'concierge': return conciergeView();
      default: return homeView();
    }
  }

  /* ---------------- home ---------------- */

  function homeView() {
    var h = health();
    var left = daysUntil(data.profile.date);
    var color = h.score >= 70 ? 'var(--good)' : h.score >= 40 ? 'var(--warn)' : 'var(--over)';

    var count;
    if (left === null) count = '<div class="stat">—</div><div class="muted" style="margin-top:8px;">Add your date in Settings</div>';
    else if (left > 0) count = '<div class="stat">' + left + '</div><div class="muted" style="margin-top:8px;">days to go — ' + esc(fmtDate(data.profile.date)) + '</div>';
    else if (left === 0) count = '<div class="stat serif" style="font-size:38px;">Today</div><div class="muted" style="margin-top:8px;">It\'s today. Go get married.</div>';
    else count = '<div class="stat serif" style="font-size:34px;">Married</div><div class="muted" style="margin-top:8px;">' + esc(fmtDate(data.profile.date)) + '</div>';

    var gaps = h.gaps.length
      ? h.gaps.slice(0, 3).map(function (g) {
          return '<div style="font-size:13.5px;color:var(--body);margin-bottom:7px;">· ' + esc(g) + '</div>';
        }).join('')
      : '<div style="font-size:13.5px;color:var(--body);">Nothing urgent — you\'re in good shape.</div>';

    // Counts either source of truth: the timeline checkbox, or a venue vendor
    // the couple has actually committed to. Otherwise the two disagree.
    var COMMITTED = ['Deposit Paid', 'Contracted', 'Paid in Full'];
    var venueBooked =
      data.timeline.some(function (p) {
        return p.tasks.some(function (t) { return /venue/i.test(t.text) && t.done; });
      }) ||
      data.vendors.some(function (v) {
        return /venue/i.test((v.category || '') + ' ' + (v.name || '')) &&
               COMMITTED.indexOf(v.status) !== -1;
      });
    var bs = budgetState();
    var rsvpIn = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });

    function milestone(label, on) {
      return '<div class="row" style="margin-bottom:12px;gap:11px;">' +
        '<div class="dot" style="background:' + (on ? 'var(--good)' : 'var(--line)') + ';"></div>' +
        '<div style="font-size:13.5px;color:var(--body);">' + label + '</div></div>';
    }

    var next = Concierge.analyze().next;
    var shortcut = '' +
      '<div class="card home-cg" id="home-concierge">' +
        '<div style="min-width:0;flex:1 1 280px;">' +
          '<div class="label">Smart Concierge \u2726</div>' +
          '<div class="serif" style="font-size:22px;font-weight:600;margin-top:4px;">' +
            (next.length ? 'Your next ' + (next.length === 1 ? 'step' : next.length + ' steps') : 'You are all caught up') + '</div>' +
          (next.length
            ? '<ol>' + next.map(function (r) { return '<li>' + esc(r.title) + '</li>'; }).join('') + '</ol>'
            : '<div class="muted" style="margin-top:6px;">Nothing needs you right now. Enjoy it.</div>') +
        '</div>' +
        '<button class="btn btn-primary" onclick="APP.go(\'concierge\')">Open Concierge</button>' +
      '</div>';

    return '' +
      '<div class="quote">"' + esc(wisdomLine()) + '"</div>' + shortcut +

      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:22px;">' +

        '<div class="card" style="text-align:center;">' +
          '<div class="label" style="margin-bottom:12px;">Countdown</div>' + count +
          (data.profile.vibe ? '<div class="muted" style="margin-top:10px;font-style:italic;">' + esc(data.profile.vibe) + '</div>' : '') +
        '</div>' +

        '<div class="card">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:14px;">' +
            '<div class="label">Planning Health</div>' +
            '<div class="serif" style="font-size:30px;font-weight:600;color:' + color + ';">' + h.score + '</div>' +
          '</div>' +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' + h.score + '%;background:' + color + ';"></div></div>' +
          gaps +
        '</div>' +

        '<div class="card">' +
          '<div class="label" style="margin-bottom:14px;">Milestones</div>' +
          milestone('Venue booked', venueBooked) +
          milestone(bs.notSet ? 'Budget not set' : 'Budget on track', bs.onTrack) +
          milestone('All RSVPs in', rsvpIn) +
          milestone('Vows written', (data.vows.promises || '').trim().length > 40) +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="serif" style="font-size:22px;font-weight:600;margin-bottom:6px;">Our Story</div>' +
        '<div class="muted" style="margin-bottom:12px;">How you met, or anything you want to remember later.</div>' +
        '<textarea rows="4" style="width:100%;" placeholder="We met when..." aria-label="Our story" ' +
        'oninput="APP.setStory(this.value)">' + esc(data.profile.story) + '</textarea>' +
      '</div>';
  }

  /* ---------------- budget ---------------- */

  function budgetView() {
    var bs = budgetState();
    var planned = bs.planned, spent = bs.spent;
    var problems = bs.over.map(function (c) { return (c.name || 'A category') + ' is ' + money(sumMoney([c.spent, -c.planned])) + ' over'; })
      .concat(bs.unplanned.map(function (c) { return c.name + ' has ' + money(c.spent) + ' spent with nothing planned'; }));

    var warn = problems.length
      ? '<div class="quote longtext" style="font-family:var(--sans);font-style:normal;font-size:14px;">' +
        '<strong style="color:var(--over);">Heads up — </strong>' +
        esc(problems.join(', ')) + '.' +
        '<div class="serif" style="font-style:italic;font-size:15px;margin-top:8px;">"' +
        esc(pick(WISDOM.budget, new Date().getDate())) + '"</div></div>'
      : '';

    var rows = data.budget.map(function (c, i) {
      var p = num(c.planned);
      var s = num(c.spent);
      var isOver = p > 0 && s > p;
      var isUnplanned = p === 0 && s > 0;
      var label = esc(c.name || 'this category');
      // Each bar shows how much of THAT category's own budget is used, so a
      // small category running over still reads as full rather than a sliver.
      var w = p > 0 ? Math.min(100, (s / p) * 100) : (s > 0 ? 100 : 0);
      var note = isUnplanned ? 'Unplanned — ' + money(s) + ' spent with nothing planned'
        : isOver ? money(sumMoney([s, -p])) + ' over plan' : '';
      return '' +
        '<div style="padding:14px 0;border-bottom:1px solid var(--line-soft);">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:9px;">' +
            '<input value="' + esc(c.name) + '" aria-label="Budget category name" style="border:none;background:none;font-weight:600;font-size:15px;padding:4px 0;min-width:120px;flex:1;" ' +
            'oninput="APP.budgetField(' + i + ',\'name\',this.value)">' +
            '<div class="row" style="gap:7px;">' +
              '<label class="row" style="gap:6px;"><span class="muted">planned</span>' +
              '<input type="number" min="0" step="0.01" inputmode="decimal" value="' + p + '" style="width:92px;" ' +
              'aria-label="Planned amount for ' + label + '" ' +
              'onchange="APP.budgetNum(' + i + ',\'planned\',this.value)"></label>' +
              '<label class="row" style="gap:6px;"><span class="muted">spent</span>' +
              '<input type="number" min="0" step="0.01" inputmode="decimal" value="' + s + '" style="width:92px;" ' +
              'aria-label="Spent amount for ' + label + '" ' +
              'onchange="APP.budgetNum(' + i + ',\'spent\',this.value)"></label>' +
              '<button class="btn-icon" aria-label="Remove budget category ' + label + '" ' +
              'title="Remove budget category ' + label + '" onclick="APP.budgetRemove(' + i + ')">&times;</button>' +
            '</div>' +
          '</div>' +
          '<div class="bar"><div style="width:' + w + '%;background:' + (isOver || isUnplanned ? 'var(--over)' : 'var(--accent)') + ';"></div></div>' +
          (note ? '<div class="longtext" style="font-size:12.5px;color:var(--over);margin-top:7px;">' + esc(note) + '</div>' : '') +
        '</div>';
    }).join('');

    var remaining = sumMoney([planned, -spent]);

    return warn +
      '<div class="row" style="gap:34px;margin-bottom:22px;">' +
        '<div><div class="label">Planned</div><div id="budget-planned" class="serif" style="font-size:28px;font-weight:600;">' +
          (bs.notSet ? 'Not set' : esc(money(planned))) + '</div></div>' +
        '<div><div class="label">Spent</div><div id="budget-spent" class="serif" style="font-size:28px;font-weight:600;">' + esc(money(spent)) + '</div></div>' +
        '<div><div class="label">Remaining</div><div id="budget-remaining" class="serif" style="font-size:28px;font-weight:600;color:' +
          (bs.notSet ? 'var(--muted)' : remaining < 0 ? 'var(--over)' : 'var(--good)') + ';">' +
          (bs.notSet ? '\u2014' : esc(money(remaining))) + '</div></div>' +
      '</div>' +
      (bs.notSet
        ? '<div class="notice" id="budget-not-set" style="margin-bottom:18px;">Budget not set — add a planned amount to a category and we\'ll track your spending against it.</div>'
        : '') +
      '<div class="card">' + rows +
        '<button class="btn" style="margin-top:16px;" onclick="APP.budgetAdd()">+ Add category</button>' +
      '</div>';
  }

  /* ---------------- guests ---------------- */

  function guestsView() {
    var g = data.guests;
    var a = attendance();
    var dupes = duplicateNameKeys();
    var dupeCount = Object.keys(dupes).length;

    function stat(n, l, id) {
      return '<div' + (id ? ' id="' + id + '"' : '') + '><span style="font-weight:600;font-size:17px;">' + n +
        '</span> <span class="muted">' + l + '</span></div>';
    }

    var rows = g.length ? g.map(function (x, i) {
      var who = esc(x.name || 'this guest');
      var declined = x.status === 'No';
      var isDupe = dupes[normName(x.name)] === true;
      return '' +
        '<div class="list-row">' +
          '<input value="' + esc(x.name) + '" aria-label="Guest name" style="border:none;background:none;flex:1;min-width:120px;font-size:14.5px;" ' +
          'oninput="APP.guestField(' + i + ',\'name\',this.value)">' +
          (isDupe ? '<span class="tag tag-warn">duplicate name</span>' : '') +
          '<select aria-label="RSVP for ' + who + '" onchange="APP.guestField(' + i + ',\'status\',this.value,true)">' +
            GUEST_STATUSES.map(function (s) {
              return '<option' + (x.status === s ? ' selected' : '') + '>' + s + '</option>';
            }).join('') +
          '</select>' +
          '<input value="' + esc(x.meal || '') + '" placeholder="' + (declined ? 'not needed' : 'meal') + '" style="width:110px;"' +
          (declined ? ' disabled' : '') +
          ' aria-label="Meal for ' + who + '" oninput="APP.guestField(' + i + ',\'meal\',this.value)">' +
          '<label class="row" style="gap:5px;font-size:13px;color:' + (declined ? 'var(--muted)' : 'var(--body)') + ';cursor:pointer;">' +
            '<input type="checkbox"' + (x.plusOne && !declined ? ' checked' : '') + (declined ? ' disabled' : '') +
            ' aria-label="Plus-one attending with ' + who + '"' +
            ' onchange="APP.guestPlus(' + i + ',this.checked)"> +1' +
          '</label>' +
          // The +1's name only becomes editable once there is a +1 to name.
          '<input value="' + esc(x.plusOneName || '') + '" placeholder="+1 name" style="width:122px;"' +
          (x.plusOne && !declined ? '' : ' disabled') +
          ' aria-label="Name of the plus-one for ' + who + '"' +
          ' oninput="APP.guestField(' + i + ',\'plusOneName\',this.value)">' +
          '<button class="btn-icon" aria-label="Remove guest ' + who + '" title="Remove guest ' + who + '" ' +
          'onclick="APP.guestRemove(' + i + ')">&times;</button>' +
        '</div>';
    }).join('') : '<div class="empty">No guests yet. Add your first one below.</div>';

    return '' +
      '<div class="row" style="gap:24px;margin-bottom:8px;">' +
        stat(a.attending, 'attending', 'guest-attending') + stat(a.invited, 'invited') +
        stat(a.yes, 'yes') + stat(a.no, 'no') + stat(a.pending, 'pending') +
        stat(a.plusOnes, 'confirmed plus-ones') +
      '</div>' +
      '<div class="muted" style="margin-bottom:18px;">Attending counts confirmed "yes" guests plus the plus-ones they confirmed.</div>' +
      (dupeCount
        ? '<div class="notice" role="alert" style="margin-bottom:18px;">' +
          (dupeCount === 1 ? 'One name appears more than once' : dupeCount + ' names appear more than once') +
          ' — check the flagged rows.</div>'
        : '') +
      '<div class="card">' + rows +
        '<div class="row" style="gap:8px;margin-top:18px;">' +
          '<input id="guest-input" placeholder="Add a guest name" aria-label="Name of the guest to add" style="flex:1;min-width:160px;" ' +
          'onkeydown="if(event.key===\'Enter\')APP.guestAdd()">' +
          '<button class="btn btn-primary" onclick="APP.guestAdd()">Add</button>' +
          '<button class="btn" onclick="APP.exportCsv()">Export CSV</button>' +
        '</div>' +
        (notice ? '<div class="notice" role="alert" style="margin-top:12px;">' + esc(notice) + '</div>' : '') +
      '</div>';
  }

  /* ---------------- timeline ---------------- */

  function timelineView() {
    var dated = !!parseDate(data.profile.date);
    var lateCount = 0, nowPhase = '';
    data.timeline.forEach(function (p) {
      var st = phaseState(p);
      if (st.status === 'overdue') lateCount++;
      if (st.status === 'now' && !nowPhase) nowPhase = p.phase;
    });

    var head = !dated
      ? '<div class="notice" style="margin-bottom:18px;">Add your wedding date in Settings and every phase will show the date it should be finished by.</div>'
      : '<div class="row longtext" style="gap:8px;margin-bottom:18px;font-size:13.5px;color:var(--body);">' +
        (lateCount
          ? '<span class="tag tag-over">' + lateCount + ' phase' + (lateCount > 1 ? 's' : '') + ' overdue</span>'
          : '<span class="tag tag-good">nothing overdue</span>') +
        (nowPhase ? '<span>Working on <strong>' + esc(nowPhase) + '</strong> right now.</span>'
          : '<span>Dates below are worked back from ' + esc(fmtDate(data.profile.date)) + '.</span>') +
        '</div>';

    var cards = data.timeline.map(function (p, pi) {
      var st = phaseState(p);
      var done = p.tasks.filter(function (t) { return t.done; }).length;

      var tag = st.status === 'overdue'
          ? '<span class="tag tag-over">overdue \u00b7 ' + st.left + ' left</span>'
        : st.status === 'now' ? '<span class="tag tag-warn">do this now</span>'
        : st.status === 'done' && p.tasks.length ? '<span class="tag tag-good">complete</span>'
        : '';

      var ago = st.days === null ? ''
        : st.days < 0 ? Math.abs(st.days) + ' day' + (Math.abs(st.days) === 1 ? '' : 's') + ' ago'
        : st.days === 0 ? 'today'
        : 'in ' + st.days + ' day' + (st.days === 1 ? '' : 's');

      var when = st.iso
        ? '<div class="muted longtext" style="margin-bottom:12px;">' +
          (st.status === 'done' ? 'Was due by ' : 'Finish by ') + esc(fmtDate(st.iso)) +
          (st.status === 'done' ? '' : ' \u00b7 ' + ago) + '</div>'
        : '';

      var tasks = p.tasks.map(function (t, ti) {
        return '' +
          '<div class="check' + (t.done ? ' done' : '') + '">' +
            '<input type="checkbox" id="tk-' + pi + '-' + ti + '"' + (t.done ? ' checked' : '') +
            ' onchange="APP.toggleTask(' + pi + ',' + ti + ')">' +
            '<label for="tk-' + pi + '-' + ti + '" class="txt longtext" style="font-size:13.5px;line-height:1.45;flex:1;cursor:pointer;">' + esc(t.text) +
            (t.key && !t.done ? ' <span class="tag tag-warn">often missed</span>' : '') +
            '</label>' +
            '<button class="btn-icon task-del" style="min-height:24px;min-width:24px;font-size:15px;padding:0 4px;" ' +
            'aria-label="Remove task: ' + esc(t.text) + '" title="Remove task" onclick="APP.taskRemove(' + pi + ',' + ti + ')">&times;</button>' +
          '</div>';
      }).join('');
      var adder = '' +
        '<div class="row" style="gap:6px;margin-top:6px;">' +
          '<input id="add-task-' + pi + '" placeholder="Add a task" aria-label="Add a task to ' + esc(p.phase) + '" ' +
          'style="flex:1;min-width:0;font-size:13px;padding:6px 9px;" maxlength="300" ' +
          'onkeydown="if(event.key===\'Enter\')APP.taskAdd(' + pi + ')">' +
          '<button class="btn btn-sm" onclick="APP.taskAdd(' + pi + ')">Add</button>' +
        '</div>';

      return '' +
        '<div class="card' + (st.status === 'overdue' ? ' phase-late' : st.status === 'now' ? ' phase-now' : '') + '">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:6px;">' +
            '<div class="serif longtext" style="font-size:19px;font-weight:600;">' + esc(p.phase) + '</div>' +
            '<div class="muted">' + done + ' / ' + p.tasks.length + '</div>' +
          '</div>' +
          (tag ? '<div class="row" style="margin-bottom:10px;">' + tag + '</div>' : '') +
          when +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' +
            (p.tasks.length ? (done / p.tasks.length) * 100 : 0) + '%;background:var(--good);"></div></div>' +
          tasks + adder +
        '</div>';
    }).join('');

    return head + '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));">' + cards + '</div>';
  }

  /* ---------------- vendors ---------------- */

  function vendorsView() {
    var rows = data.vendors.length ? data.vendors.map(function (v, i) {
      var who = esc(v.name || 'this vendor');
      var dep = paymentFlag(v.deposit, depositPaid(v));
      var fin = paymentFlag(v.final, finalPaid(v));
      function badge(flag, what) {
        if (flag === 'overdue') return '<span class="tag tag-over">' + what + ' OVERDUE</span>';
        if (flag === 'soon') return '<span class="tag tag-warn">' + what + ' due soon</span>';
        return '';
      }
      var m = vendorMoney(v);
      var conflict = vendorConflict(v);
      var balanceNote = m.cost > 0
        ? (m.balance > 0
            ? '<span>Balance <strong style="color:var(--ink);">' + esc(money(m.balance)) + '</strong> of ' + esc(money(m.cost)) + '</span>'
            : m.balance === 0
              ? '<span class="tag tag-good">paid in full</span>'
              : '<span class="tag tag-warn">overpaid by ' + esc(money(-m.balance)) + '</span>')
        : (m.paid > 0
            ? '<span>' + esc(money(m.paid)) + ' paid \u2014 no total cost recorded yet</span>'
            : '');

      return '' +
        '<div style="padding:14px 0;border-bottom:1px solid var(--line-soft);">' +
          '<div class="row" style="gap:8px;margin-bottom:9px;">' +
            '<input value="' + esc(v.name) + '" placeholder="Vendor name" aria-label="Vendor name" style="border:none;background:none;font-weight:600;flex:1;min-width:130px;" ' +
            'oninput="APP.vendorField(' + i + ',\'name\',this.value)">' +
            '<input value="' + esc(v.category || '') + '" placeholder="category" style="width:130px;" ' +
            'aria-label="Category for ' + who + '" oninput="APP.vendorField(' + i + ',\'category\',this.value)">' +
            '<input value="' + esc(v.contact || '') + '" placeholder="email or phone" style="width:190px;" ' +
            'aria-label="Contact for ' + who + '" oninput="APP.vendorField(' + i + ',\'contact\',this.value)">' +
            '<select aria-label="Booking status for ' + who + '" onchange="APP.vendorField(' + i + ',\'status\',this.value,true)">' +
              VENDOR_STATUSES.map(function (s) {
                return '<option' + (v.status === s ? ' selected' : '') + '>' + s + '</option>';
              }).join('') +
            '</select>' +
            '<button class="btn-icon" aria-label="Remove vendor ' + who + '" title="Remove vendor ' + who + '" ' +
            'onclick="APP.vendorRemove(' + i + ')">&times;</button>' +
          '</div>' +
          '<div class="money-row">' +
            '<label class="row" style="gap:6px;">total cost ' +
            '<input type="number" min="0" step="0.01" inputmode="decimal" value="' + m.cost + '" ' +
            'aria-label="Total cost for ' + who + '" onchange="APP.vendorNum(' + i + ',\'cost\',this.value)"></label>' +
            '<label class="row" style="gap:6px;">deposit ' +
            '<input type="number" min="0" step="0.01" inputmode="decimal" value="' + m.deposit + '" ' +
            'aria-label="Deposit amount for ' + who + '" onchange="APP.vendorNum(' + i + ',\'depositAmount\',this.value)"></label>' +
            '<label class="row" style="gap:6px;">paid so far ' +
            '<input type="number" min="0" step="0.01" inputmode="decimal" value="' + m.paid + '" ' +
            'aria-label="Amount paid so far to ' + who + '" onchange="APP.vendorNum(' + i + ',\'paidAmount\',this.value)"></label>' +
            balanceNote +
          '</div>' +
          (conflict
            ? '<div class="notice longtext" role="alert" style="margin-top:8px;">' +
              '<strong>Check this:</strong> ' + esc(conflict) + '</div>'
            : '') +
          '<div class="row" style="gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px;">' +
            '<label class="row" style="gap:6px;">deposit due <input type="date" value="' + esc(v.deposit || '') + '" style="font-size:12.5px;padding:5px 7px;" ' +
            'onchange="APP.vendorField(' + i + ',\'deposit\',this.value,true)"></label>' +
            badge(dep, 'deposit') +
            '<label class="row" style="gap:6px;">final due <input type="date" value="' + esc(v.final || '') + '" style="font-size:12.5px;padding:5px 7px;" ' +
            'onchange="APP.vendorField(' + i + ',\'final\',this.value,true)"></label>' +
            badge(fin, 'final payment') +
          '</div>' +
        '</div>';
    }).join('') : '<div class="empty">No vendors yet. Add the first one below.</div>';

    var tot = vendorTotals();
    var late = overduePayments();
    var soon = data.vendors.filter(function (v) {
      return paymentFlag(v.deposit, depositPaid(v)) === 'soon' || paymentFlag(v.final, finalPaid(v)) === 'soon';
    });

    var summary = data.vendors.length
      ? '<div class="row" style="gap:34px;margin-bottom:18px;">' +
          '<div><div class="label">Total cost</div><div id="vendor-total-cost" class="serif" style="font-size:28px;font-weight:600;">' +
            esc(money(tot.cost)) + '</div></div>' +
          '<div><div class="label">Paid</div><div id="vendor-total-paid" class="serif" style="font-size:28px;font-weight:600;">' +
            esc(money(tot.paid)) + '</div></div>' +
          '<div><div class="label">Still owed</div><div id="vendor-balance" class="serif" style="font-size:28px;font-weight:600;color:' +
            (tot.balance > 0 ? 'var(--ink)' : 'var(--good)') + ';">' + esc(money(tot.balance)) + '</div></div>' +
        '</div>' +
        (late.length
          ? '<div class="notice longtext" id="vendor-overdue" role="alert" style="margin-bottom:18px;">Payment overdue for ' +
            esc(listPhrase(late.map(function (v) { return tidy(v.name) || 'an unnamed vendor'; }))) + '.</div>'
          : soon.length
            ? '<div class="notice longtext" id="vendor-due-soon" style="margin-bottom:18px;">Payment due within two weeks for ' +
              esc(listPhrase(soon.map(function (v) { return tidy(v.name) || 'an unnamed vendor'; }))) + '.</div>'
            : '')
      : '';

    return summary + '<div class="card">' + rows +
      '<button class="btn" style="margin-top:16px;" onclick="APP.vendorAdd()">+ Add vendor</button></div>';
  }

  /* ---------------- diary ---------------- */

  function diaryView() {
    var moods = ['Joyful', 'Grateful', 'Excited', 'Overwhelmed', 'Reflective', 'Stressed'];
    var sorted = data.diary.slice().sort(function (a, b) { return (b.date || '').localeCompare(a.date || ''); });

    var entries = sorted.length ? sorted.map(function (e) {
      var i = data.diary.indexOf(e);
      return '' +
        '<div class="card" style="margin-bottom:14px;">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:9px;">' +
            '<div class="muted">' + esc(fmtDate(e.date)) + ' · ' + esc(e.mood || '') + '</div>' +
            '<div class="row" style="gap:10px;">' +
              '<label class="row" style="gap:5px;font-size:12.5px;color:var(--body);cursor:pointer;">' +
                '<input type="checkbox"' + (e.shared ? ' checked' : '') +
                ' aria-label="Include the ' + esc(fmtDate(e.date)) + ' entry in the keepsake"' +
                ' onchange="APP.diaryShare(' + i + ',this.checked)"> include in keepsake' +
              '</label>' +
              '<button class="btn-icon" aria-label="Remove the ' + esc(fmtDate(e.date)) + ' diary entry" ' +
              'title="Remove this entry" onclick="APP.diaryRemove(' + i + ')">&times;</button>' +
            '</div>' +
          '</div>' +
          '<div class="longtext" style="font-size:14.5px;line-height:1.65;color:#3d322c;white-space:pre-wrap;">' + esc(e.text) + '</div>' +
        '</div>';
    }).join('') : '<div class="empty">No entries yet. Write the first one above.</div>';

    return '' +
      '<div class="card" style="margin-bottom:20px;">' +
        '<div class="serif" style="font-size:20px;font-weight:600;margin-bottom:12px;">New entry</div>' +
        '<div class="row" style="gap:10px;margin-bottom:10px;">' +
          '<input type="date" id="d-date" aria-label="Date of this diary entry" value="' + esc(draft.diaryDate) + '" onchange="APP.draftSet(\'diaryDate\',this.value)">' +
          '<select id="d-mood" aria-label="Mood for this diary entry" onchange="APP.draftSet(\'diaryMood\',this.value)">' +
            moods.map(function (m) {
              return '<option' + (draft.diaryMood === m ? ' selected' : '') + '>' + m + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<textarea id="d-text" rows="3" style="width:100%;" placeholder="What happened? How did it feel?" ' +
        'aria-label="New diary entry" oninput="APP.draftSet(\'diaryText\',this.value)">' + esc(draft.diaryText) + '</textarea>' +
        '<div class="row" style="justify-content:space-between;margin-top:12px;">' +
          '<button class="btn btn-primary" onclick="APP.diaryAdd()">Save entry</button>' +
          '<button class="btn" onclick="APP.openKeepsake()">Compile keepsake</button>' +
        '</div>' +
      '</div>' + entries;
  }

  /* ---------------- vows ---------------- */

  function vowsView() {
    var v = data.vows;
    var notes = {
      Heartfelt: 'Keep it warm and sincere — say the true thing, even if your voice shakes.',
      Funny: 'A little humor never hurts, but let one line be completely serious.',
      Traditional: 'Classic and steady — built to be read aloud calmly.',
      Short: 'Under a minute. Every word has to earn its place.'
    };

    var tones = TONES.map(function (t) {
      var on = v.tone === t;
      return '<button type="button" class="btn' + (on ? ' btn-primary' : '') + '" style="padding:8px 16px;" ' +
             'aria-pressed="' + (on ? 'true' : 'false') + '" ' +
             'onclick="APP.setTone(\'' + t + '\')">' + t + '</button>';
    }).join('');

    var words = (v.opening + ' ' + v.memory + ' ' + v.promises + ' ' + v.closing)
      .trim().split(/\s+/).filter(Boolean).length;
    var wColor = words < 120 ? 'var(--muted)' : words <= 260 ? 'var(--good)' : 'var(--warn)';
    var wNote = words === 0 ? 'Start anywhere — the middle is fine.'
      : words < 120 ? 'Still finding your words — keep going.'
      : words <= 260 ? 'That\'s about right for one to two minutes.'
      : 'Getting long — consider trimming.';
    var secs = Math.round((words / 130) * 60);
    var speak = secs < 60 ? secs + ' sec' : (Math.round(secs / 6) / 10) + ' min';

    function block(key, title, hint, rows) {
      return '' +
        '<div style="margin-bottom:22px;">' +
          '<div class="label" style="margin-bottom:5px;" id="vow-' + key + '-label">' + title + '</div>' +
          '<div class="muted" style="margin-bottom:8px;">' + hint + '</div>' +
          '<textarea id="vow-' + key + '" rows="' + rows + '" style="width:100%;" aria-labelledby="vow-' + key + '-label" ' +
          'oninput="APP.setVow(\'' + key + '\',this.value)">' + esc(v[key]) + '</textarea>' +
        '</div>';
    }

    return '' +
      '<div class="grid vows-grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr);align-items:start;">' +
        '<div class="card">' +
          '<div class="row" style="gap:8px;margin-bottom:14px;">' + tones + '</div>' +
          '<div class="serif" style="font-style:italic;font-size:15px;color:var(--body);margin-bottom:24px;">' +
            esc(notes[v.tone] || '') + '</div>' +
          block('opening', 'Opening line', 'A first line that sounds like you, not like a wedding.', 2) +
          block('memory', 'A shared memory', 'What is the moment you knew this was it?', 3) +
          block('promises', 'Your promises', 'What promise matters most, on an ordinary day?', 5) +
          block('closing', 'Closing line', 'The last thing they hear before "I do."', 2) +
        '</div>' +
        '<div class="card">' +
          '<div class="label" style="margin-bottom:8px;" id="vow-count-label">Word count</div>' +
          '<div id="vow-word-count" class="serif" aria-labelledby="vow-count-label" style="font-size:38px;font-weight:600;color:' + wColor + ';">' + words + '</div>' +
          '<div id="vow-word-note" class="muted" style="margin:8px 0 16px;">' + wNote + '</div>' +
          '<div id="vow-speak-time" class="muted">About ' + speak + ' spoken aloud.</div>' +
          '<label class="row" style="gap:7px;margin-top:16px;font-size:13px;color:var(--body);cursor:pointer;">' +
            '<input type="checkbox"' + (v.inKeepsake ? ' checked' : '') + ' onchange="APP.vowKeepsake(this.checked)"> ' +
            'Include our vows in the keepsake</label>' +
          '<button class="btn btn-sm" style="margin-top:12px;" onclick="APP.go(\'concierge\');APP.aiMode(\'vows\')">Get help writing \u2726</button>' +
          '<div class="muted" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">' +
            'Read them out loud before the day. They always sound different in your mouth than on the page.' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- settings ---------------- */

  function settingsView() {
    // While an edit is being corrected, the fields show what was typed.
    var p = settingsDraft
      ? { partnerA: settingsDraft.partnerA, partnerB: settingsDraft.partnerB, date: settingsDraft.date,
          vibe: data.profile.vibe, currency: data.profile.currency }
      : data.profile;
    return '' +
      '<div style="max-width:640px;">' +
        '<div class="card" style="margin-bottom:20px;">' +
          '<div class="serif" style="font-size:21px;font-weight:600;margin-bottom:16px;">Your details</div>' +
          '<div class="field"><label for="set-a">Your name</label>' +
          '<input id="set-a" value="' + esc(p.partnerA) + '" oninput="APP.profileGuarded(\'partnerA\',this.value)"></div>' +
          '<div class="field"><label for="set-b">Partner\'s name</label>' +
          '<input id="set-b" value="' + esc(p.partnerB) + '" oninput="APP.profileGuarded(\'partnerB\',this.value)"></div>' +
          '<div class="field"><label for="set-date">Wedding date</label>' +
          '<input id="set-date" type="date" value="' + esc(p.date) + '" onchange="APP.profileGuarded(\'date\',this.value)"></div>' +
          '<div class="field"><label for="set-vibe">The vibe</label>' +
          '<input id="set-vibe" value="' + esc(p.vibe) + '" oninput="APP.profile(\'vibe\',this.value)"></div>' +
          '<div class="field" style="margin-bottom:0;"><label for="set-currency">Currency</label>' +
          '<select id="set-currency" onchange="APP.profile(\'currency\',this.value,true)">' + currencyOptions() + '</select>' +
          '<div class="muted" style="margin-top:6px;">Used everywhere money is shown. It changes the symbol only \u2014 your figures stay as typed.</div></div>' +
          '<div class="notice longtext" id="settings-error" role="alert" style="margin-top:14px;' +
          (settingsError ? '' : 'display:none;') + '">' + esc(settingsError) + '</div>' +
          ((!tidy(p.partnerA) || !tidy(p.partnerB) || !isIsoDate(p.date))
            ? '<div class="notice" role="alert" style="margin-top:14px;">Both names and a wedding date keep your countdown and keepsake headings working.</div>'
            : '') +
        '</div>' +

        '<div class="card" style="margin-bottom:20px;">' +
          '<div class="serif" style="font-size:21px;font-weight:600;margin-bottom:8px;">Backup</div>' +
          '<div class="muted" style="margin-bottom:16px;">' +
            'Everything lives in this browser only. Save a backup file before clearing your browser data, ' +
            'or to move your plan to another computer.' +
          '</div>' +
          '<div class="row" style="gap:10px;">' +
            '<button class="btn" onclick="APP.exportJson()">Save backup file</button>' +
            '<label class="btn" style="display:inline-block;" tabindex="0" ' +
            'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.querySelector(\'input\').click();}">Restore from backup' +
              '<input type="file" accept="application/json,.json" style="display:none;" onchange="APP.importJson(event)">' +
            '</label>' +
          '</div>' +
          '<div class="muted" id="last-backup" style="margin-top:12px;">' + esc(lastBackupLine()) + '</div>' +
          snapshotList() +
        '</div>' +

        aiSettingsCard() +

        '<div class="card">' +
          '<div class="serif" style="font-size:21px;font-weight:600;margin-bottom:8px;">Start over</div>' +
          '<div class="muted" style="margin-bottom:16px;">Erases everything and returns to the setup screen. This cannot be undone.</div>' +
          '<button class="btn" style="color:var(--over);border-color:#e6c4b8;" onclick="APP.reset()">Reset everything</button>' +
        '</div>' +

        '<div class="muted" id="offline-status" style="margin-top:18px;text-align:center;' +
          (offlineLine() ? '' : 'display:none;') + '">' + esc(offlineLine()) + '</div>' +
        '<div class="muted" id="app-version" style="margin-top:6px;text-align:center;">Evermore Wedding Planner \u00b7 Version ' + APP_VERSION +
          ' \u00b7 Smart Concierge works fully offline</div>' +
      '</div>';
  }

  function lastBackupLine() {
    var at = device().lastBackupAt;
    if (!at) return 'No backup saved from this browser yet.';
    var d = new Date(at);
    if (isNaN(d.getTime())) return '';
    var days = Math.floor((Date.now() - d.getTime()) / 86400000);
    return 'Last backup saved ' + (days <= 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago') +
      ' (' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) + ').';
  }

  function snapshotList() {
    var list = snapshots();
    if (!list.length) return '';
    return '' +
      '<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);">' +
        '<div class="label" style="margin-bottom:6px;">Automatic safety copies</div>' +
        '<div class="muted" style="margin-bottom:8px;">Taken before a restore, a reset or an AI-suggested change, and once a day. ' +
        'Kept in this browser only \u2014 a backup file is still the copy that survives clearing your browser.</div>' +
        list.map(function (sn, i) {
          var d = new Date(sn.at);
          var when = isNaN(d.getTime()) ? 'Unknown time'
            : d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
          return '<div class="row" style="justify-content:space-between;padding:6px 0;font-size:13px;">' +
            '<span>' + esc(when) + ' \u00b7 ' + esc(sn.reason || 'Safety copy') + '</span>' +
            '<button class="btn btn-sm" onclick="APP.restoreSnapshot(' + i + ')">Restore this copy</button></div>';
        }).join('') +
      '</div>';
  }

  /* ---------------- keepsake ---------------- */

  function keepsakeView() {
    var shared = data.diary.filter(function (e) { return e.shared; })
      .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });

    var body = shared.length ? shared.map(function (e) {
      return '' +
        '<div style="margin-bottom:28px;">' +
          '<div class="muted" style="margin-bottom:6px;">' + esc(fmtDate(e.date)) + '</div>' +
          '<div class="serif longtext" style="font-size:18px;line-height:1.75;white-space:pre-wrap;">' + esc(e.text) + '</div>' +
        '</div>';
    }).join('') : '<div class="empty">No entries marked yet — tick "include in keepsake" on any diary entry.</div>';

    var story = (data.profile.story || '').trim();
    var vw = data.vows;
    var vowText = ['opening', 'memory', 'promises', 'closing'].map(function (k) { return (vw[k] || '').trim(); })
      .filter(Boolean).join('\n\n');
    var vowBlock = vw.inKeepsake && vowText
      ? '<div style="margin:10px 0 40px;padding-top:28px;border-top:1px solid var(--line);">' +
          '<div class="label" style="text-align:center;margin-bottom:16px;">Our Vows</div>' +
          '<div class="serif longtext" style="font-size:18px;line-height:1.75;white-space:pre-wrap;font-style:italic;">' + esc(vowText) + '</div>' +
        '</div>'
      : '';

    return '' +
      '<div class="keepsake">' +
        '<div class="row no-print" style="justify-content:space-between;margin-bottom:34px;">' +
          '<button class="btn" onclick="APP.closeKeepsake()">&larr; Back</button>' +
          '<button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>' +
        '</div>' +
        '<div style="text-align:center;margin-bottom:44px;">' +
          '<div class="serif longtext" style="font-style:italic;font-size:clamp(28px,8vw,40px);color:var(--deep);">' + esc(coupleName()) + '</div>' +
          (data.profile.date ? '<div class="muted" style="margin-top:8px;">' + esc(fmtDate(data.profile.date)) + '</div>' : '') +
          '<div class="label" style="margin-top:12px;">Our Story</div>' +
        '</div>' +
        (story ? '<div class="serif" style="font-size:18px;line-height:1.75;text-align:center;margin-bottom:40px;white-space:pre-wrap;">' + esc(story) + '</div>' : '') +
        body + vowBlock +
      '</div>';
  }

  /* ===============================================================
     SMART CONCIERGE — offline, rule-based, and read-only.
     It reads the plan and says what matters most. It never changes a
     record by itself: every "fix" it offers goes through a confirmation
     that shows the change first, and a safety copy is taken before it.
  ================================================================*/

  var ESSENTIALS = [
    { id: 'venue', label: 'venue', re: /venue|hall|estate|barn|ballroom|reception site/i, by: 365, task: /venue/i },
    { id: 'photo', label: 'photographer', re: /photo/i, by: 270, task: /photograph/i },
    { id: 'catering', label: 'caterer', re: /cater|food|chef/i, by: 270, task: /caterer/i },
    { id: 'music', label: 'band or DJ', re: /\bdj\b|band|music|entertain/i, by: 240, task: null },
    { id: 'officiant', label: 'officiant', re: /officiant|celebrant|minister|priest|pastor|rabbi|imam|judge/i, by: 180, task: /officiant/i },
    { id: 'florist', label: 'florist', re: /flor|flower/i, by: 180, task: /florist/i },
    { id: 'beauty', label: 'hair and makeup', re: /hair|make-?up|beauty|stylist/i, by: 120, task: /hair and makeup/i },
    { id: 'cake', label: 'cake baker', re: /cake|bak(e|er|ery)|dessert|patisserie/i, by: 120, task: null }
  ];

  var SAVINGS_TIPS = [
    { re: /venue/i, tips: ['Friday, Sunday and off-season dates are often noticeably cheaper — ask the venue for its off-peak rate.',
      'Ask what the hire already includes (tables, linen, staff, cleaning) before paying anyone else for it.'] },
    { re: /cater|bar|food|drink/i, tips: ['Family-style service, a buffet or a shorter cocktail hour can lower the per-head price.',
      'Limit the bar to beer, wine and one signature drink.'] },
    { re: /photo|video/i, tips: ['Book fewer hours of coverage — getting-ready shots are usually the easiest to drop.',
      'Ask for a digital-only package and order prints later.'] },
    { re: /attire|dress|suit|beauty/i, tips: ['Sample sales, pre-loved and rental outfits cost a fraction of new.'] },
    { re: /flor|flower|decor/i, tips: ['Choose in-season local flowers, and move ceremony arrangements to the reception.',
      'Greenery and candles give a full look for less than all-flower designs.'] },
    { re: /music|entertain|dj|band/i, tips: ['A DJ usually costs less than a live band; a band for the ceremony only splits the difference.'] },
    { re: /cake|dessert/i, tips: ['A small display cake plus a kitchen sheet cake looks the same and costs far less.'] },
    { re: /station|invit/i, tips: ['Digital save-the-dates and an online RSVP cut printing and postage.'] },
    { re: /transport|car/i, tips: ['One shared shuttle often replaces several separate cars.'] },
    { re: /ring/i, tips: ['Lab-grown stones and alternative metals can save a great deal for the same look.'] }
  ];

  function vendorText(v) { return (v.category || '') + ' ' + (v.name || ''); }
  function vendorLabel(v) { return tidy(v.name) || (tidy(v.category) ? 'your ' + tidy(v.category).toLowerCase() + ' vendor' : 'an unnamed vendor'); }
  function committed(v) { return DEPOSIT_PAID.indexOf(v.status) !== -1; }

  /** The budget category a vendor most likely belongs to, or -1. */
  function budgetIndexFor(v) {
    var cat = normName(v.category);
    if (!cat) return -1;
    for (var i = 0; i < data.budget.length; i++) {
      var b = normName(data.budget[i].name);
      if (b && (b === cat || b.indexOf(cat) !== -1 || cat.indexOf(b) !== -1)) return i;
    }
    var words = cat.split(/[^a-z]+/).filter(function (w) { return w.length > 3; });
    for (var j = 0; j < data.budget.length; j++) {
      var bn = normName(data.budget[j].name);
      for (var k = 0; k < words.length; k++) {
        var stem = words[k].slice(0, 5);
        if (bn.indexOf(stem) !== -1) return j;
      }
    }
    return -1;
  }

  function vowWords() {
    var v = data.vows;
    return (v.opening + ' ' + v.memory + ' ' + v.promises + ' ' + v.closing).trim().split(/\s+/).filter(Boolean).length;
  }

  function taskDone(re) {
    return data.timeline.some(function (p) { return p.tasks.some(function (t) { return t.done && re.test(t.text); }); });
  }

  function Rec(id, pri, area, title, detail, tab, fix) {
    return { id: id, pri: pri, area: area, title: title, detail: detail || '', tab: tab || '', fix: fix || null };
  }

  var Concierge = {
    analyze: function () {
      var recs = [];
      var days = daysUntil(data.profile.date);
      var dated = days !== null;
      var after = dated && days < 0;
      var att = attendance();
      var bs = budgetState();

      /* ---- payments ---- */
      data.vendors.forEach(function (v, i) {
        var m = vendorMoney(v);
        var who = vendorLabel(v);
        var dep = paymentFlag(v.deposit, depositPaid(v));
        var fin = paymentFlag(v.final, finalPaid(v));
        var depOwed = m.deposit > 0 ? Math.max(0, sumMoney([m.deposit, -m.paid])) : 0;
        if (dep) {
          var dl = daysUntil(v.deposit);
          recs.push(Rec('pay-dep:' + i, dep === 'overdue' ? 97 : 86 - Math.max(0, dl), 'payments',
            (dep === 'overdue' ? 'Pay ' : 'Get ready to pay ') + who + '’s deposit',
            'Due ' + fmtDate(v.deposit) + (dl < 0 ? ' — ' + Math.abs(dl) + ' day' + (Math.abs(dl) === 1 ? '' : 's') + ' ago' : dl === 0 ? ' — today' : ' — in ' + dl + ' day' + (dl === 1 ? '' : 's')) +
            (depOwed > 0 ? '. ' + money(depOwed) + ' still to pay.' : '.'),
            'vendors', m.deposit > 0 ? { kind: 'depositPaid', label: 'Record the deposit as paid', vi: i } : null));
        }
        if (fin) {
          var fl = daysUntil(v.final);
          recs.push(Rec('pay-fin:' + i, fin === 'overdue' ? 98 : 87 - Math.max(0, fl), 'payments',
            (fin === 'overdue' ? 'Settle ' : 'Plan the final payment to ') + who,
            'Due ' + fmtDate(v.final) + (fl < 0 ? ' — ' + Math.abs(fl) + ' day' + (Math.abs(fl) === 1 ? '' : 's') + ' ago' : fl === 0 ? ' — today' : ' — in ' + fl + ' day' + (fl === 1 ? '' : 's')) +
            (m.balance > 0 ? '. Balance ' + money(m.balance) + '.' : '.'),
            'vendors', m.cost > 0 ? { kind: 'paidInFull', label: 'Record as paid in full', vi: i } : null));
        }
        var c = vendorConflict(v);
        if (c) recs.push(Rec('conflict:' + i, 60, 'payments', 'Reconcile ' + who + '’s records', c, 'vendors'));
        if (committed(v) && m.balance > 0 && !v.final && !after) {
          recs.push(Rec('nodate:' + i, 44, 'payments', 'Add a final payment date for ' + who,
            money(m.balance) + ' is still owed with no due date, so nothing can remind you in time.', 'vendors'));
        }
      });

      /* ---- RSVPs and guests ---- */
      if (!after) {
        var pending = data.guests.filter(function (g) { return g.status === 'Pending'; });
        if (pending.length) {
          var pp = !dated ? 50 : days <= 42 ? 89 : days <= 90 ? 72 : days <= 150 ? 48 : 30;
          var names = pending.slice(0, 5).map(function (g) { return tidy(g.name) || 'unnamed guest'; });
          recs.push(Rec('rsvp', pp, 'rsvp',
            'Follow up on ' + pending.length + ' RSVP' + (pending.length === 1 ? '' : 's'),
            listPhrase(names) + (pending.length > 5 ? ' and ' + (pending.length - 5) + ' more' : '') +
            ' still ' + (pending.length === 1 ? 'hasn’t' : 'haven’t') + ' replied' +
            (dated && days <= 42 ? ' — caterers usually need final numbers about a month out.' : '.'),
            'guests', { kind: 'rsvpText', label: 'Copy a friendly reminder' }));
        }
        var noMeal = data.guests.filter(function (g) { return g.status === 'Yes' && !tidy(g.meal); });
        if (noMeal.length) {
          recs.push(Rec('meals', dated && days <= 60 ? 66 : 34, 'rsvp',
            'Collect meal choices from ' + noMeal.length + ' attending guest' + (noMeal.length === 1 ? '' : 's'),
            listPhrase(noMeal.slice(0, 4).map(function (g) { return tidy(g.name) || 'unnamed guest'; })) +
            (noMeal.length > 4 ? ' and ' + (noMeal.length - 4) + ' more' : '') + ' said yes but have no meal recorded.', 'guests'));
        }
        var unnamed = data.guests.filter(function (g) { return g.status === 'Yes' && g.plusOne && !tidy(g.plusOneName); });
        if (unnamed.length) {
          recs.push(Rec('plusnames', 28, 'rsvp', 'Name ' + unnamed.length + ' confirmed plus-one' + (unnamed.length === 1 ? '' : 's'),
            'Place cards and the seating chart need a name for each one.', 'guests'));
        }
        var dupes = Object.keys(duplicateNameKeys()).length;
        if (dupes) recs.push(Rec('dupes', 52, 'rsvp', 'Check ' + dupes + ' duplicate guest name' + (dupes === 1 ? '' : 's'),
          'A name that appears twice can quietly double a seat and a meal.', 'guests'));
        if (dated && days <= 35 && att.attending > 0 && !taskDone(/headcount/i)) {
          recs.push(Rec('headcount', 77, 'deadlines', 'Send your caterer the final headcount: ' + att.attending,
            att.pending ? att.pending + ' RSVP' + (att.pending === 1 ? ' is' : 's are') + ' still open — settle them first, then confirm the number.'
              : 'Every RSVP is in, so the number is firm.', 'timeline'));
        }
      }

      /* ---- budget ---- */
      if (bs.notSet && !after) {
        recs.push(Rec('budget-set', 80, 'budget', 'Set your total budget together',
          'Add a planned amount to each category. Every other money decision hangs off this one.', 'budget'));
      }
      if (bs.over.length) {
        var overTotal = sumMoney(bs.over.map(function (c) { return sumMoney([c.spent, -c.planned]); }));
        recs.push(Rec('budget-over', 73, 'budget',
          'Rebalance ' + bs.over.length + ' over-budget categor' + (bs.over.length === 1 ? 'y' : 'ies'),
          listPhrase(bs.over.map(function (c) { return tidy(c.name) || 'a category'; })) + ' ' +
          (bs.over.length === 1 ? 'is ' : 'are ') + money(overTotal) + ' over in total. Move money from a category with room, or trim the plan.', 'budget'));
      }
      if (bs.unplanned.length) {
        recs.push(Rec('budget-unplanned', 64, 'budget', 'Give a budget to spending with no plan',
          listPhrase(bs.unplanned.map(function (c) { return tidy(c.name) || 'a category'; })) + ' ' +
          (bs.unplanned.length === 1 ? 'has' : 'have') + ' money spent but nothing planned.', 'budget'));
      }
      // Vendor commitments against the category they belong to.
      var byCat = {};
      data.vendors.forEach(function (v) {
        var bi = budgetIndexFor(v);
        if (bi === -1) return;
        var m = vendorMoney(v);
        var e = byCat[bi] || (byCat[bi] = { cost: [], paid: [], names: [] });
        if (committed(v) || v.status === 'Quoted') e.cost.push(m.cost);
        e.paid.push(m.paid);
        e.names.push(vendorLabel(v));
      });
      Object.keys(byCat).forEach(function (bi) {
        var c = data.budget[bi], e = byCat[bi];
        var cost = sumMoney(e.cost), paid = sumMoney(e.paid);
        var planned = money2(c.planned), spent = money2(c.spent);
        if (planned > 0 && cost > planned) {
          recs.push(Rec('vendor-over:' + bi, 62, 'budget',
            (tidy(c.name) || 'A category') + ' quotes are ' + money(sumMoney([cost, -planned])) + ' over budget',
            'Booked and quoted vendors here total ' + money(cost) + ' against ' + money(planned) + ' planned.', 'budget'));
        }
        if (paid > spent) {
          recs.push(Rec('sync:' + bi, 46, 'budget',
            'Update ' + (tidy(c.name) || 'a category') + ' spending to match payments',
            'Your vendors show ' + money(paid) + ' paid, but the budget says ' + money(spent) + ' spent.', 'budget',
            { kind: 'syncSpent', label: 'Set spent to ' + money(paid), bi: Number(bi), value: paid }));
        }
      });
      if (bs.planned > 0 && !after) {
        var buffer = data.budget.filter(function (c) { return /buffer|misc|contingen|emergenc/i.test(c.name); });
        var bufPlanned = sumMoney(buffer.map(function (c) { return c.planned; }));
        if (bufPlanned < bs.planned * 0.05) {
          recs.push(Rec('buffer', 42, 'budget', 'Keep 5–10% aside for surprises',
            'About ' + money(Math.round(bs.planned * 0.07)) + ' covers the costs nobody quotes: overtime, alterations, delivery fees, tips.', 'budget'));
        }
      }

      /* ---- timeline ---- */
      var nowShown = false;
      data.timeline.forEach(function (p, pi) {
        var st = phaseState(p);
        var open = p.tasks.filter(function (t) { return !t.done; });
        var keyFirst = open.filter(function (t) { return t.key; }).concat(open.filter(function (t) { return !t.key; }));
        var sample = keyFirst.slice(0, 3).map(function (t) { return t.text; });
        if (st.status === 'overdue' && !after) {
          recs.push(Rec('phase-late:' + pi, 81, 'deadlines',
            'Catch up on “' + p.phase + '” (' + st.left + ' left)',
            'Was due ' + fmtDate(st.iso) + '. Start with: ' + sample.join('; ') + '.', 'timeline'));
        } else if (st.status === 'now' && !nowShown) {
          nowShown = true;
          recs.push(Rec('phase-now:' + pi, 70, 'deadlines',
            'This month: ' + (sample[0] || 'finish “' + p.phase + '”'),
            '“' + p.phase + '” is due ' + fmtDate(st.iso) + ' with ' + st.left + ' task' + (st.left === 1 ? '' : 's') + ' left' +
            (sample.length > 1 ? ', including ' + sample.slice(1).join('; ') : '') + '.', 'timeline'));
        }
      });

      /* ---- essential bookings ---- */
      if (dated && !after) {
        var missing = [];
        ESSENTIALS.forEach(function (ess) {
          if (days > ess.by) return;
          var matches = data.vendors.filter(function (v) { return ess.re.test(vendorText(v)); });
          var booked = matches.some(committed) || (ess.task && taskDone(ess.task));
          if (booked) return;
          var lateBy = ess.by - days;
          var pri = Math.min(84, 50 + Math.round(lateBy / 10));
          if (matches.length) {
            recs.push(Rec('book:' + ess.id, pri, 'vendors', 'Confirm your ' + ess.label,
              vendorLabel(matches[0]) + ' is still “' + matches[0].status + '”. Most couples have their ' + ess.label +
              ' booked about ' + Math.round(ess.by / 30) + ' months out.', 'vendors'));
          } else {
            missing.push({ ess: ess, pri: pri });
          }
        });
        // One calm line for everything not yet found, rather than a wall of them.
        if (missing.length === 1) {
          var one = missing[0].ess;
          recs.push(Rec('book:' + one.id, missing[0].pri, 'vendors', 'Find and book ' + (/^[aeiou]/i.test(one.label) ? 'an ' : 'a ') + one.label,
            'Most couples book one about ' + Math.round(one.by / 30) + ' months out; you have ' + days + ' days. Skip this if you don’t need one.', 'vendors'));
        } else if (missing.length > 1) {
          recs.push(Rec('book:missing', Math.max.apply(null, missing.map(function (m) { return m.pri; })), 'vendors',
            'Book the essentials you haven’t found yet',
            'No ' + listPhrase(missing.map(function (m) { return m.ess.label; })) + ' recorded yet, and most couples have these booked by now (' +
            days + ' days to go). Add each one on the Vendors tab, or skip any you don’t need.', 'vendors'));
        }
      }

      /* ---- vows ---- */
      var words = vowWords();
      if (dated && !after && days <= 90 && words < 80) {
        recs.push(Rec('vows', days <= 21 ? 78 : 57, 'deadlines', words ? 'Finish your vows (' + words + ' words so far)' : 'Start writing your vows',
          'Most vows run 150–250 words. Draft now, read them aloud next week, and they’ll sound like you on the day.', 'vows'));
      }

      /* ---- after the wedding ---- */
      if (after) {
        recs.push(Rec('thanks', 55, 'deadlines', 'Send your thank-you cards',
          'Aim to send them within three months. The Guests tab has everyone who came.', 'guests'));
      }

      /* ---- backup ---- */
      var last = device().lastBackupAt;
      var hasContent = data.guests.length || data.vendors.length || data.diary.length || bs.planned > 0;
      if (hasContent) {
        var age = last ? Math.floor((Date.now() - new Date(last).getTime()) / 86400000) : null;
        if (age === null || isNaN(age)) {
          recs.push(Rec('backup', 58, 'backup', 'Save your first backup file',
            'Your plan lives only in this browser. A backup takes five seconds and survives cleared browsing data.', 'settings',
            { kind: 'backup', label: 'Save backup now' }));
        } else if (age > 30) {
          recs.push(Rec('backup', 45, 'backup', 'Save a fresh backup (' + age + ' days since the last)',
            'A monthly backup means a lost browser never costs you more than a few weeks.', 'settings',
            { kind: 'backup', label: 'Save backup now' }));
        }
      }

      // Hidden for a week when the couple says "not now".
      var snoozed = data.concierge.snoozed || {};
      var todayIso = today();
      var hidden = 0;
      var visible = recs.filter(function (r) {
        var until = snoozed[r.id];
        if (until && until > todayIso) { hidden++; return false; }
        return true;
      });
      visible.sort(function (a, b) { return b.pri - a.pri; });

      return { recs: visible, next: visible.slice(0, 3), hidden: hidden, days: days, savings: Concierge.savings(bs, att) };
    },

    savings: function (bs, att) {
      var ideas = [];
      var cats = data.budget.map(function (c, i) {
        return { c: c, i: i, size: Math.max(money2(c.planned), money2(c.spent)) };
      }).filter(function (x) { return x.size > 0; }).sort(function (a, b) { return b.size - a.size; });

      cats.slice(0, 6).forEach(function (x) {
        for (var k = 0; k < SAVINGS_TIPS.length; k++) {
          if (SAVINGS_TIPS[k].re.test(x.c.name)) {
            var tip = SAVINGS_TIPS[k].tips[(x.i + new Date().getDate()) % SAVINGS_TIPS[k].tips.length];
            ideas.push({ cat: tidy(x.c.name), tip: tip, room: Math.round(x.size * 0.1) });
            return;
          }
        }
      });
      var cater = data.budget.filter(function (c) { return /cater|food/i.test(c.name); });
      var caterPlanned = sumMoney(cater.map(function (c) { return c.planned; }));
      var heads = att.attending || (att.invited ? att.invited - att.no : 0);
      if (caterPlanned > 0 && heads > 0) {
        ideas.push({ cat: 'Guest list', tip: 'Each guest adds about ' + money(Math.round(caterPlanned / heads)) +
          ' in catering alone. Trimming even a handful of names is the single biggest lever on cost.', room: 0 });
      }
      if (!ideas.length && bs.planned === 0) {
        ideas.push({ cat: 'Getting started', tip: 'Add planned amounts on the Budget tab and the Concierge will point out where there is room to save.', room: 0 });
      }
      if (ideas.length < 4) {
        ideas.push({ cat: 'Every vendor', tip: 'Ask for an itemised quote. Line items are far easier to negotiate than one total.', room: 0 });
      }
      return ideas.slice(0, 6);
    },

    /** Offline answers to plain questions, from the plan itself. */
    answer: function (q) {
      var t = String(q || '').toLowerCase();
      var a = Concierge.analyze();
      var att = attendance(), bs = budgetState(), tot = vendorTotals();
      var days = daysUntil(data.profile.date);
      function lines(arr) { return arr.join('\n'); }

      if (!t.trim()) return 'Ask me about payments, RSVPs, your budget, deadlines or what to do next.';
      if (/\b(owe|owed|balance|outstanding|pay|payment|paid)\b/.test(t)) {
        var owing = data.vendors.filter(function (v) { return vendorMoney(v).balance > 0; });
        if (!data.vendors.length) return 'No vendors are recorded yet. Add them on the Vendors tab and I can track every payment.';
        return lines(['You still owe ' + money(tot.balance) + ' across ' + owing.length + ' vendor' + (owing.length === 1 ? '' : 's') +
          ' (' + money(tot.paid) + ' paid of ' + money(tot.cost) + ').']
          .concat(owing.slice(0, 8).map(function (v) {
            var m = vendorMoney(v);
            return '• ' + vendorLabel(v) + ': ' + money(m.balance) + (v.final ? ' — final due ' + fmtDate(v.final) : '');
          })));
      }
      if (/\b(rsvp|replied|reply|respond|pending|waiting)\b/.test(t)) {
        var pend = data.guests.filter(function (g) { return g.status === 'Pending'; });
        if (!data.guests.length) return 'Your guest list is empty so far.';
        if (!pend.length) return 'Every RSVP is in: ' + att.attending + ' attending, ' + att.no + ' declined.';
        return pend.length + ' guest' + (pend.length === 1 ? ' has' : 's have') + ' not replied: ' +
          pend.slice(0, 15).map(function (g) { return tidy(g.name) || 'unnamed guest'; }).join(', ') +
          (pend.length > 15 ? ' and ' + (pend.length - 15) + ' more.' : '.');
      }
      if (/\b(how many|headcount|attending|coming|guests?)\b/.test(t)) {
        return att.attending + ' attending (' + att.yes + ' yes + ' + att.plusOnes + ' plus-ones) out of ' + att.invited +
          ' invited. ' + att.pending + ' pending, ' + att.no + ' declined.';
      }
      if (/\b(save|saving|savings|cheaper|cut|reduce|afford)\b/.test(t)) {
        return lines(['Ideas to save, from your own budget:'].concat(a.savings.map(function (s) {
          return '• ' + s.cat + ': ' + s.tip + (s.room ? ' (rough room: up to ' + money(s.room) + ')' : '');
        })));
      }
      if (/\b(budget|spent|spend|left|remaining|cost)\b/.test(t)) {
        if (bs.notSet) return 'Your budget isn’t set yet — ' + money(bs.spent) + ' spent so far. Add planned amounts on the Budget tab.';
        return 'Planned ' + money(bs.planned) + ', spent ' + money(bs.spent) + ', remaining ' + money(sumMoney([bs.planned, -bs.spent])) + '.' +
          (bs.over.length ? ' Over budget: ' + listPhrase(bs.over.map(function (c) { return c.name; })) + '.' : ' No category is over.');
      }
      if (/\b(due|deadline|week|soon|upcoming|overdue|late)\b/.test(t)) {
        var items = a.recs.filter(function (r) { return r.area === 'payments' || r.area === 'deadlines'; }).slice(0, 6);
        if (!items.length) return 'Nothing is due or overdue right now.';
        return lines(['Coming up and overdue:'].concat(items.map(function (r) { return '• ' + r.title + ' — ' + r.detail; })));
      }
      if (/\b(vow|vows)\b/.test(t)) {
        var w = vowWords();
        return w ? 'Your vows are ' + w + ' words, about ' + Math.max(1, Math.round(w / 130 * 10) / 10) + ' min spoken. ' +
          (w < 120 ? 'Most land between 150 and 250 words.' : w <= 260 ? 'That is a lovely length.' : 'Consider trimming a little.')

  /* ---------------- actions ---------------- */

  // Text inputs call the *quiet* path: state + save, no re-render, so the
  // caret never jumps mid-word. Anything structural re-renders.
  function quiet() { save(); }
  function loud() { save(); render(); }

  /** Remove a row behind a confirmation, keeping one step of undo. */
  function removeRow(list, index, label) {
    if (!list || index < 0 || index >= list.length) return;
    var what = tidy(label) || 'this item';
    if (!window.confirm('Remove ' + what + '? You can undo this straight after.')) return;
    var snapshot = JSON.parse(JSON.stringify(list[index]));
    list.splice(index, 1);
    undoable = { label: what, index: index, restore: function () {
      list.splice(Math.min(index, list.length), 0, snapshot);
    } };
    notice = '';
    loud();
  }

  var APP = {
    go: function (t) {
      tab = t; notice = ''; undoable = null;
      // An edit that never validated is discarded, not carried around.
      settingsDraft = null; settingsError = '';
      window.scrollTo(0, 0);
      render();
    },

    finishSetup: function () {
      var a = tidy(document.getElementById('su-a').value);
      var b = tidy(document.getElementById('su-b').value);
      var date = document.getElementById('su-date').value;
      var vibe = tidy(document.getElementById('su-vibe').value);

      // Never throw away what they typed just because something is missing.
      setupDraft = { partnerA: a, partnerB: b, date: date, vibe: vibe };

      var missing = [];
      if (!a) missing.push('your name');
      if (!b) missing.push("your partner's name");
      if (!isIsoDate(date)) missing.push('your wedding date');
      if (missing.length === 3) {
        setupError = 'Add your names and your wedding date to start — the planner needs all three.';
        render(); return;
      }
      if (missing.length) {
        setupError = 'Still missing ' + listPhrase(missing) + '.';
        render(); return;
      }
      if (daysUntil(date) < 0) {
        setupError = 'That date has already passed — pick the day you are planning for.';
        render(); return;
      }

      setupError = '';
      setupDraft = null;
      data.profile.partnerA = a;
      data.profile.partnerB = b;
      data.profile.date = date;
      data.profile.vibe = vibe;
      data.setupDone = true;
      loud();
    },

    retrySave: function () { save(); updateWarnings(); if (!saveFailed) toast('Saved.'); },
    dismissLoadWarning: function () { loadFailed = false; updateWarnings(); },
    dismissRepairs: function () { loadRepairs = 0; updateWarnings(); },

    /* Every change the Concierge offers is shown first and confirmed. */
    cgFix: function (id) {
      var rec = null;
      Concierge.analyze().recs.forEach(function (r) { if (r.id === id) rec = r; });
      if (!rec || !rec.fix) return;
      var f = rec.fix;
      if (f.kind === 'backup') { APP.exportJson(); render(); return; }
      if (f.kind === 'rsvpText') {
        var text = rsvpReminder();
        openModal('A friendly RSVP reminder', '<p class="muted" style="margin-top:0;">Copy this into a text, email or message. Nothing is sent by Evermore.</p>' +
          '<pre id="rsvp-text">' + esc(text) + '</pre>', { ok: 'Copy text', cancel: 'Close',
          onConfirm: function () { copyText(text); return true; } });
        return;
      }
      var change = null;
      if (f.kind === 'depositPaid' || f.kind === 'paidInFull') {
        var v = data.vendors[f.vi];
        if (!v) return;
        var m = vendorMoney(v);
        var newPaid = f.kind === 'paidInFull' ? m.cost : Math.max(m.paid, m.deposit);
        var newStatus = f.kind === 'paidInFull' ? 'Paid in Full'
          : (DEPOSIT_PAID.indexOf(v.status) === -1 ? 'Deposit Paid' : v.status);
        change = {
          title: 'Update ' + vendorLabel(v),
          before: 'Paid so far: ' + money(m.paid) + '\nStatus: ' + v.status,
          after: 'Paid so far: ' + money(newPaid) + '\nStatus: ' + newStatus,
          note: 'Only confirm this if the payment has really been made.',
          apply: function () { v.paidAmount = newPaid; v.status = newStatus; }
        };
      } else if (f.kind === 'syncSpent') {
        var c = data.budget[f.bi];
        if (!c) return;
        change = {
          title: 'Update ' + (tidy(c.name) || 'this category'),
          before: 'Spent: ' + money(c.spent), after: 'Spent: ' + money(f.value),
          note: 'Matches the payments recorded against your vendors in this category.',
          apply: function () { c.spent = money2(f.value); }
        };
      }
      if (!change) return;
      openModal(change.title,
        '<div class="label" style="margin-bottom:4px;">Now</div><div class="diff-old">' + esc(change.before) + '</div>' +
        '<div class="label" style="margin:10px 0 4px;">After</div><div class="diff-new">' + esc(change.after) + '</div>' +
        '<p class="muted" style="margin:12px 0 0;">' + esc(change.note) + ' A safety copy is kept, and you can undo straight after.</p>',
        { ok: 'Make this change', onConfirm: function () {
          takeSnapshot('Before a Concierge change');
          var before = JSON.parse(JSON.stringify(data));
          change.apply();
          undoable = { text: 'Updated by the Concierge.', restore: function () { data = before; } };
          loud();
          toast('Done. Undo is at the top if you need it.');
        } });
    },
