<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evermore — Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0;
    --card: #fdfaf6;
    --line: #e8e0d6;
    --line-soft: #f0e9e1;
    --ink: #2e2521;
    --body: #6b5d54;
    --muted: #8a7a6e;
    --deep: #4a2f28;
    --blush: #f2e4dc;
    --accent: #a8705a;
    --good: #4a7c59;
    --warn: #c08a3e;
    --over: #b5573f;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  input, textarea, select, button { font-family: var(--sans); font-size: 14px; color: var(--ink); }
  input, textarea, select {
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    background: #fff; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; line-height: 1.6; }
  button { cursor: pointer; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--body);
    padding: 9px 16px; border-radius: 18px; font-size: 13px; font-weight: 500;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--blush); border-color: var(--accent); }
  .btn-primary { background: var(--deep); color: #fdfaf6; border-color: var(--deep); }
  .btn-primary:hover { background: #3a231e; border-color: #3a231e; color: #fdfaf6; }
  .btn-icon {
    border: none; background: none; color: var(--muted); font-size: 18px;
    line-height: 1; padding: 4px 8px; border-radius: 6px;
  }
  .btn-icon:hover { background: var(--blush); color: var(--over); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  .label {
    font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 500;
  }
  .serif { font-family: var(--serif); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grid { display: grid; gap: 22px; }

  /* Header */
  .topbar {
    position: sticky; top: 0; z-index: 20; background: rgba(250,246,240,.95);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .brand { font-family: var(--serif); font-size: 21px; font-style: italic; color: var(--deep); min-width: 0; }
  .tabs { display: flex; gap: 3px; flex-wrap: wrap; }
  .tab {
    border: none; background: none; color: var(--body);
    padding: 8px 14px; border-radius: 18px; font-size: 13.5px; font-weight: 500;
  }
  .tab:hover { background: var(--blush); }
  .tab.active { background: var(--deep); color: #fdfaf6; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Setup screen */
  .setup { max-width: 540px; margin: 0 auto; padding: 60px 24px; }
  .setup h1 { font-family: var(--serif); font-weight: 500; font-size: 42px; line-height: 1.1; margin: 0 0 14px; }
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--body); margin-bottom: 6px; font-weight: 500; }
  .field input, .field select { width: 100%; }

  /* Home */
  .quote {
    background: var(--blush); border-radius: 8px; padding: 20px 26px; margin-bottom: 26px;
    font-family: var(--serif); font-style: italic; font-size: 17.5px; line-height: 1.55; color: var(--deep);
  }
  .stat { font-family: var(--serif); font-size: 52px; font-weight: 600; line-height: 1; color: var(--deep); }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 4px; transition: width .3s; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  /* Lists */
  .list-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 0; border-bottom: 1px solid var(--line-soft);
  }
  .list-row:last-of-type { border-bottom: none; }
  .tag {
    font-size: 10.5px; background: var(--blush); color: var(--deep);
    padding: 3px 9px; border-radius: 10px; white-space: nowrap; font-weight: 500;
  }
  .tag-warn { background: #f7e3d3; color: #8a4a2e; }
  .check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 11px; cursor: pointer; }
  .check input { margin-top: 3px; flex-shrink: 0; cursor: pointer; }
  .check.done span.txt { color: var(--muted); text-decoration: line-through; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 28px 10px; }

  /* Warnings and undo */
  .warn-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    max-width: 1180px; margin: 12px auto 0; padding: 14px 20px; border-radius: 8px;
    background: #f7ded4; color: #6d3323; font-size: 13.5px; line-height: 1.5;
  }
  .warn-bar.warn-soft { background: #f7ecd6; color: #6b5324; }
  .warn-bar > div:first-child { max-width: 760px; overflow-wrap: anywhere; }
  .undo-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    max-width: 1180px; margin: 14px auto 0; padding: 11px 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    font-size: 13.5px; color: var(--body);
  }
  .notice {
    background: #f7ecd6; color: #6b5324; border-radius: 8px; padding: 11px 15px;
    font-size: 13px; line-height: 1.5; overflow-wrap: anywhere;
  }
  .btn-icon { min-width: 32px; min-height: 32px; }
  .brand { overflow-wrap: anywhere; }
  .longtext { overflow-wrap: anywhere; word-break: break-word; }
  .tag-over { background: var(--over); color: #fff; font-weight: 600; letter-spacing: .04em; }
  .tag-good { background: #dceadf; color: #2f5c3b; }
  .money-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--muted); margin-top: 8px;
  }
  .money-row input[type="number"] { width: 100px; font-size: 12.5px; padding: 5px 7px; }
  .phase-now { border-color: var(--accent); }
  .phase-late { border-color: #e6c4b8; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  @media (max-width: 780px) {
    .vows-grid { grid-template-columns: minmax(0, 1fr) !important; }
  }
  @media (max-width: 520px) {
    /* Stack the wide editing rows rather than letting a field overflow. */
    .list-row > input, .list-row > select { flex: 1 1 100%; width: auto !important; min-width: 0; }
    .money-row { gap: 8px 12px; }
    .money-row label { flex: 1 1 100%; }
    .money-row input[type="number"] { width: 100%; }
  }
  @media (max-width: 640px) {
    .wrap { padding: 22px 16px 60px; }
    .card { padding: 20px; }
    .topbar-inner { padding: 12px 16px; }
    .stat { font-size: 42px; }
    .setup { padding: 40px 18px; }
    .setup h1 { font-size: 32px; }
    .warn-bar, .undo-bar { margin-left: 16px; margin-right: 16px; padding: 12px 16px; }
    .keepsake { padding: 36px 16px; }
  }

  /* Keepsake print view */
  .keepsake { max-width: 680px; margin: 0 auto; padding: 50px 28px; }
  @media print {
    @page { margin: 1.4cm; }
    .no-print { display: none !important; }
    body { background: #fff; }
    .keepsake { padding: 0; max-width: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="warnings" aria-live="polite"></div>
<div id="app"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'evermore_planner_v1';

  /* ---------------------------------------------------------------
     Reflections shown on the Home tab. Chosen by planning context so
     the line matches where the couple actually is.
  ----------------------------------------------------------------*/
  var WISDOM = {
    general: [
      "The best marriages aren't built on grand gestures — they're built on choosing each other, quietly, every single day.",
      "Love is deciding, over and over, that this person's happiness matters as much as your own.",
      "The vows matter less than the version of you that keeps them, twenty years from now.",
      "Family isn't who you're born to — it's who you choose to build a life with, on purpose.",
      "Say the hard thing gently. Say the small thing often. That's most of what love actually is.",
      "The best partners aren't the ones who never disappoint you — they're the ones who stay to repair it.",
      "Plan the wedding together. It's practice for planning the life.",
      "You are not merging two lives. You're building a third one, made of both.",
      "A good marriage is two people who keep choosing curiosity over certainty about each other.",
      "The wedding is one day. The marriage is every ordinary Tuesday after it — plan for those, too."
    ],
    budget: [
      "Budgets are just love letters written in numbers — they say what you're willing to sacrifice for.",
      "Money fights are rarely about money. They're about what you each think safety looks like.",
      "A wedding that costs less but starts a marriage without debt is the better deal, every time.",
      "The guest list you can't afford isn't the wedding you're planning — the one you can is."
    ],
    rsvpDone: [
      "Now you know exactly who's showing up for you. Let that be enough for tonight.",
      "A full guest list is just a room full of people who already love you both. You did the hard part."
    ],
    weekOf: [
      "Nothing left to plan now but to notice it happening. Let the small mistakes be funny later.",
      "You will not remember the seating chart. You will remember how you felt walking in."
    ],
    justStarted: [
      "Start with the guest count and the budget. Every other decision hangs off those two.",
      "Book the venue and the date first. Everything else can move; those can't."
    ]
  };

  var STARTER_CATEGORIES = [
    'Venue', 'Catering & Bar', 'Photography', 'Attire & Beauty',
    'Flowers & Decor', 'Music & Entertainment', 'Cake & Desserts',
    'Stationery', 'Rings', 'Transport', 'Thank-You Cards', 'Buffer / Misc'
  ];

  function starterTimeline() {
    return [
      { phase: '12 Months Out', tasks: [
        { text: 'Set your total wedding budget together', done: false, key: true },
        { text: 'Choose your date and overall style', done: false, key: false },
        { text: 'Draft the guest list (this drives everything)', done: false, key: true },
        { text: 'Tour and book your venue', done: false, key: true },
        { text: 'Decide who is paying for what', done: false, key: true }
      ] },
      { phase: '9 Months Out', tasks: [
        { text: 'Book photographer and videographer', done: false, key: false },
        { text: 'Book caterer and schedule a tasting', done: false, key: false },
        { text: 'Choose your wedding party', done: false, key: false },
        { text: 'Check your marriage license requirements and timing', done: false, key: true },
        { text: 'Start shopping for attire', done: false, key: false }
      ] },
      { phase: '6 Months Out', tasks: [
        { text: 'Send save-the-dates', done: false, key: false },
        { text: 'Book florist and decor', done: false, key: false },
        { text: 'Book your officiant', done: false, key: true },
        { text: 'Order attire and schedule fittings', done: false, key: false },
        { text: 'Arrange guest accommodation and transport', done: false, key: false },
        { text: 'Book the honeymoon and check passport expiry', done: false, key: true }
      ] },
      { phase: '3 Months Out', tasks: [
        { text: 'Mail the invitations', done: false, key: false },
        { text: 'Plan the rehearsal dinner', done: false, key: true },
        { text: 'Finalize the menu and drinks', done: false, key: false },
        { text: 'Purchase the rings', done: false, key: false },
        { text: 'Write your vows (start early — it takes longer than you think)', done: false, key: true },
        { text: 'Book hair and makeup trials', done: false, key: false }
      ] },
      { phase: '1 Month Out', tasks: [
        { text: 'Give the caterer your final headcount', done: false, key: false },
        { text: 'Schedule all final vendor payments', done: false, key: true },
        { text: 'Book your marriage license appointment', done: false, key: true },
        { text: 'Build the seating chart', done: false, key: false },
        { text: 'Confirm timings with every vendor', done: false, key: true },
        { text: 'Set aside a thank-you card budget', done: false, key: true }
      ] },
      { phase: 'Week Of', tasks: [
        { text: 'Hold the rehearsal', done: false, key: false },
        { text: 'Pack an emergency kit (pins, plasters, stain pen, snacks)', done: false, key: true },
        { text: 'Confirm a weather backup plan', done: false, key: true },
        { text: 'Delegate day-of tasks to someone other than you two', done: false, key: true },
        { text: 'Prepare vendor tips and final envelopes', done: false, key: false },
        { text: 'Put your phone down and eat a real meal', done: false, key: false }
      ] }
    ];
  }

  function defaultData() {
    return {
      setupDone: false,
      profile: { partnerA: '', partnerB: '', date: '', vibe: '', story: '', currency: '$' },
      budget: STARTER_CATEGORIES.map(function (n) {
        return { name: n, planned: 0, spent: 0 };
      }),
      guests: [],
      vendors: [],
      timeline: starterTimeline(),
      diary: [],
      vows: { tone: 'Heartfelt', opening: '', memory: '', promises: '', closing: '' }
    };
  }

  /* ---------------- state ---------------- */

  var GUEST_STATUSES = ['Pending', 'Yes', 'No'];
  var VENDOR_STATUSES = ['Inquiring', 'Quoted', 'Deposit Paid', 'Contracted', 'Paid in Full'];
  var DEPOSIT_PAID = ['Deposit Paid', 'Contracted', 'Paid in Full'];
  var TONES = ['Heartfelt', 'Funny', 'Traditional', 'Short'];

  var loadFailed = false;     // saved data existed but could not be read
  var saveFailed = false;     // the browser refused the last write
  var undoable = null;        // one step of undo for a deletion
  var notice = '';            // inline message on the Guests tab
  var setupError = '';        // inline message on the setup screen
  var setupDraft = null;      // what was typed, kept across a failed attempt

  var data = load();
  var tab = 'home';
  var view = 'app';           // 'app' | 'keepsake'
  var draft = { guest: '', diaryText: '', diaryMood: 'Joyful', diaryDate: today() };

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
    if (raw == null) return defaultData();
    var parsed = null;
    try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
    var clean = parsed === null ? null : validate(parsed);
    if (clean) return clean;
    // Saved data we cannot trust is never partially applied and never
    // overwritten behind the couple's back — we say so and leave it alone.
    loadFailed = true;
    return defaultData();
  }

  /**
   * Returns a clean, fully-typed copy of `raw` when it is a complete plan,
   * or null when anything is missing or of the wrong type. A null result
   * must always mean "keep the current data".
   */
  function validate(raw) {
    function isObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
    function isStr(v) { return typeof v === 'string'; }
    function optStr(v) { return v == null || typeof v === 'string'; }
    function isNum(v) { return isFinite(Number(v)); }
    function optDate(v) { return v == null || v === '' || isIsoDate(v); }
    function optNum(v) { return v == null || v === '' || isFinite(Number(v)); }
    if (!isObj(raw)) return null;

    var p = raw.profile;
    if (!isObj(p) || !isStr(p.partnerA) || !isStr(p.partnerB)) return null;
    if (!optDate(p.date)) return null;
    if (!optStr(p.vibe) || !optStr(p.story)) return null;
    if (p.currency != null && typeof p.currency !== 'string') return null;

    if (!Array.isArray(raw.budget)) return null;
    var budget = [];
    for (var i = 0; i < raw.budget.length; i++) {
      var c = raw.budget[i];
      if (!isObj(c) || !isStr(c.name) || !isNum(c.planned) || !isNum(c.spent)) return null;
      budget.push({ name: c.name, planned: num(c.planned), spent: num(c.spent) });
    }

    if (!Array.isArray(raw.guests)) return null;
    var guests = [];
    for (var j = 0; j < raw.guests.length; j++) {
      var g = raw.guests[j];
      if (!isObj(g) || !isStr(g.name) || GUEST_STATUSES.indexOf(g.status) === -1) return null;
      if (!optStr(g.meal) || (g.plusOne != null && typeof g.plusOne !== 'boolean')) return null;
      if (!optStr(g.plusOneName)) return null;
      // A declined guest has no meal and no plus-one, whatever the file says.
      var declined = g.status === 'No';
      var hasPlus = !declined && g.plusOne === true;
      guests.push({ name: g.name, status: g.status, meal: declined ? '' : (g.meal || ''),
        plusOne: hasPlus, plusOneName: hasPlus ? (g.plusOneName || '') : '' });
    }

    if (!Array.isArray(raw.vendors)) return null;
    var vendors = [];
    for (var k = 0; k < raw.vendors.length; k++) {
      var v = raw.vendors[k];
      if (!isObj(v) || !isStr(v.name) || VENDOR_STATUSES.indexOf(v.status) === -1) return null;
      if (!optStr(v.category) || !optStr(v.contact)) return null;
      if (!optDate(v.deposit) || !optDate(v.final)) return null;
      if (!optNum(v.cost) || !optNum(v.depositAmount) || !optNum(v.paidAmount)) return null;
      vendors.push({ name: v.name, category: v.category || '', contact: v.contact || '',
        status: v.status, deposit: v.deposit || '', final: v.final || '',
        cost: Math.max(0, num(v.cost)), depositAmount: Math.max(0, num(v.depositAmount)),
        paidAmount: Math.max(0, num(v.paidAmount)) });
    }

    if (!Array.isArray(raw.timeline) || !raw.timeline.length) return null;
    var timeline = [];
    for (var m = 0; m < raw.timeline.length; m++) {
      var ph = raw.timeline[m];
      if (!isObj(ph) || !isStr(ph.phase) || !Array.isArray(ph.tasks)) return null;
      var tasks = [];
      for (var n = 0; n < ph.tasks.length; n++) {
        var t = ph.tasks[n];
        if (!isObj(t) || !isStr(t.text) || typeof t.done !== 'boolean') return null;
        tasks.push({ text: t.text, done: t.done, key: t.key === true });
      }
      timeline.push({ phase: ph.phase, tasks: tasks });
    }

    if (!Array.isArray(raw.diary)) return null;
    var diary = [];
    for (var q = 0; q < raw.diary.length; q++) {
      var e = raw.diary[q];
      if (!isObj(e) || !isIsoDate(e.date) || !isStr(e.text)) return null;
      if (!optStr(e.mood) || (e.shared != null && typeof e.shared !== 'boolean')) return null;
      diary.push({ date: e.date, text: e.text, mood: e.mood || 'Reflective', shared: e.shared === true });
    }

    var vw = raw.vows;
    if (!isObj(vw)) return null;
    var keys = ['opening', 'memory', 'promises', 'closing'], vows = {};
    for (var r = 0; r < keys.length; r++) {
      if (!optStr(vw[keys[r]])) return null;
      vows[keys[r]] = vw[keys[r]] || '';
    }
    vows.tone = TONES.indexOf(vw.tone) === -1 ? 'Heartfelt' : vw.tone;

    return {
      setupDone: raw.setupDone === true,
      profile: { partnerA: p.partnerA, partnerB: p.partnerB, date: p.date || '',
        vibe: p.vibe || '', story: p.story || '', currency: curSym(p.currency) },
      budget: budget, guests: guests, vendors: vendors, timeline: timeline, diary: diary, vows: vows
    };
  }

  /** Persist without throwing. Returns false when the browser refused. */
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      saveFailed = false;
    } catch (e) {
      saveFailed = true;
    }
    updateWarnings();
    return !saveFailed;
  }

  /* ---------------- helpers ---------------- */

  function today() { return new Date().toISOString().slice(0, 10); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  /* The symbol the couple picked in Settings. Kept as a plain symbol so a
     printed keepsake or an exported CSV reads the same as the screen. */
  var CURRENCIES = [
    ['$', '$  Dollar (USD)'], ['\u00a3', '\u00a3  Pound (GBP)'], ['\u20ac', '\u20ac  Euro (EUR)'],
    ['A$', 'A$  Australian dollar'], ['C$', 'C$  Canadian dollar'], ['NZ$', 'NZ$  New Zealand dollar'],
    ['\u00a5', '\u00a5  Yen / Yuan'], ['\u20b9', '\u20b9  Rupee (INR)'], ['R', 'R  Rand (ZAR)'],
    ['R$', 'R$  Real (BRL)'], ['Mex$', 'Mex$  Mexican peso'], ['\u20b1', '\u20b1  Philippine peso'],
    ['\u20a9', '\u20a9  Won (KRW)'], ['\u0e3f', '\u0e3f  Baht (THB)'], ['\u20a6', '\u20a6  Naira (NGN)'],
    ['RM', 'RM  Ringgit (MYR)'], ['S$', 'S$  Singapore dollar'], ['HK$', 'HK$  Hong Kong dollar'],
    ['kr', 'kr  Krone / Krona'], ['z\u0142', 'z\u0142  Z\u0142oty (PLN)'], ['CHF', 'CHF  Swiss franc'],
    ['AED', 'AED  Dirham'], ['\u20aa', '\u20aa  Shekel (ILS)'], ['\u20ba', '\u20ba  Lira (TRY)']
  ];

  /** Never blank, never long enough to break a layout. */
  function curSym(v) {
    var t = String(v == null ? '' : v).trim().slice(0, 4);
    return t || '$';
  }

  function currency() { return curSym(data.profile.currency); }

  function money(n) {
    var v = Math.round(num(n));
    var sym = currency();
    // 'CHF 1,200' reads properly; '$1,200' should not gain a space.
    var gap = /[A-Za-z]$/.test(sym) ? ' ' : '';
    return (v < 0 ? '-' : '') + sym + gap + Math.abs(v).toLocaleString();
  }

  function currencyOptions() {
    var cur = currency();
    var known = false;
    var opts = CURRENCIES.map(function (c) {
      if (c[0] === cur) known = true;
      return '<option value="' + esc(c[0]) + '"' + (c[0] === cur ? ' selected' : '') + '>' + esc(c[1]) + '</option>';
    });
    // A symbol restored from a backup we do not list still shows as chosen.
    if (!known) opts.unshift('<option value="' + esc(cur) + '" selected>' + esc(cur) + '  (current)</option>');
    return opts.join('');
  }

  /** Names match if they differ only by case or by extra whitespace. */
  function normName(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toLowerCase(); }
  function tidy(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' '); }

  function isIsoDate(s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !!parseDate(s);
  }

  /** Quote a CSV cell, neutralising anything a spreadsheet would run. */
  function csvCell(v) {
    var s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  }

  function listPhrase(items) {
    if (items.length <= 1) return items[0] || '';
    if (items.length === 2) return items[0] + ' and ' + items[1];
    return items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1];
  }

  /** A payment is 'overdue' once its date has passed unpaid, 'soon' within 14 days. */
  function paymentFlag(iso, paid) {
    if (paid || !isIsoDate(iso)) return null;
    var left = daysUntil(iso);
    if (left === null) return null;
    if (left < 0) return 'overdue';
    if (left <= 14) return 'soon';
    return null;
  }

  /* A payment counts as made either from the booking status or from the
     money actually recorded against the vendor \u2014 whichever says "paid"
     first, so a badge never nags about something already covered. */
  function depositPaid(v) {
    if (DEPOSIT_PAID.indexOf(v.status) !== -1) return true;
    var d = num(v.depositAmount);
    return d > 0 && num(v.paidAmount) >= d;
  }
  function finalPaid(v) {
    if (v.status === 'Paid in Full') return true;
    var c = num(v.cost);
    return c > 0 && num(v.paidAmount) >= c;
  }

  /** Cost / paid / balance for one vendor. */
  function vendorMoney(v) {
    var cost = Math.max(0, num(v.cost));
    var paid = Math.max(0, num(v.paidAmount));
    return { cost: cost, paid: paid, deposit: Math.max(0, num(v.depositAmount)), balance: cost - paid };
  }

  /** Totals across every vendor, for the summary at the top of the tab.
      'balance' adds up only what is still owed per vendor, so money paid
      ahead to one vendor never hides a debt to another. */
  function vendorTotals() {
    var cost = 0, paid = 0, owed = 0;
    data.vendors.forEach(function (v) {
      var m = vendorMoney(v);
      cost += m.cost;
      paid += m.paid;
      owed += Math.max(0, m.balance);
    });
    return { cost: cost, paid: paid, balance: owed };
  }

  /* Phases are named relative to the day ("6 Months Out"), so the wedding
     date is what turns them into real deadlines. */
  function phaseTarget(phase) {
    var wed = parseDate(data.profile.date);
    if (!wed) return null;
    var d = new Date(wed.getTime());
    var m = /(\d+)\s*month/i.exec(phase);
    if (m) {
      var day = d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() - Number(m[1]));
      // Clamp to a shorter month: 31 May minus 3 months is 28/29 Feb.
      var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
      return d;
    }
    if (/week/i.test(phase)) { d.setDate(d.getDate() - 7); return d; }
    return null;
  }

  function isoOf(d) {
    var m = d.getMonth() + 1, dd = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (dd < 10 ? '0' : '') + dd;
  }

  /** done | overdue | now | later | undated, plus what is left to do. */
  function phaseState(p) {
    var left = p.tasks.filter(function (t) { return !t.done; }).length;
    var target = phaseTarget(p.phase);
    var iso = target ? isoOf(target) : '';
    var days = iso ? daysUntil(iso) : null;
    var span = /week/i.test(p.phase) ? 7 : 30;
    var status = !p.tasks.length || left === 0 ? 'done'
      : days === null ? 'undated'
      : days < 0 ? 'overdue'
      : days <= span ? 'now'
      : 'later';
    return { left: left, iso: iso, days: days, status: status };
  }

  /** Budget state, shared by the Budget tab, Home milestones and health. */
  function budgetState() {
    var planned = 0, spent = 0, over = [], unplanned = [];
    data.budget.forEach(function (c) {
      var p = num(c.planned), s = num(c.spent);
      planned += p; spent += s;
      if (p > 0 && s > p) over.push(c);
      else if (p === 0 && s > 0) unplanned.push(c);
    });
    return { planned: planned, spent: spent, over: over, unplanned: unplanned,
      notSet: planned === 0, onTrack: planned > 0 && !over.length && !unplanned.length };
  }

  function overduePayments() {
    return data.vendors.filter(function (v) {
      return paymentFlag(v.deposit, depositPaid(v)) === 'overdue' ||
             paymentFlag(v.final, finalPaid(v)) === 'overdue';
    });
  }

  /** Confirmed attendance: yes guests plus the plus-ones they confirmed. */
  function attendance() {
    var yes = data.guests.filter(function (g) { return g.status === 'Yes'; });
    var plus = yes.filter(function (g) { return g.plusOne === true; }).length;
    return { yes: yes.length, plusOnes: plus, attending: yes.length + plus,
      no: data.guests.filter(function (g) { return g.status === 'No'; }).length,
      pending: data.guests.filter(function (g) { return g.status === 'Pending'; }).length,
      invited: data.guests.length };
  }

  function duplicateNameKeys() {
    var counts = {}, dupes = {};
    data.guests.forEach(function (g) {
      var k = normName(g.name);
      if (!k) return;
      counts[k] = (counts[k] || 0) + 1;
      if (counts[k] > 1) dupes[k] = true;
    });
    return dupes;
  }

  function parseDate(s) {
    if (!s) return null;
    var d = new Date(s + 'T00:00:00');
    return isNaN(d.getTime()) ? null : d;
  }

  function fmtDate(s) {
    var d = parseDate(s);
    if (!d) return '';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function daysUntil(s) {
    var d = parseDate(s);
    if (!d) return null;
    var now = new Date();
    now.setHours(0, 0, 0, 0);
    return Math.round((d - now) / 86400000);
  }

  function pick(arr, seed) { return arr[Math.abs(seed) % arr.length]; }

  function coupleName() {
    var a = (data.profile.partnerA || '').trim();
    var b = (data.profile.partnerB || '').trim();
    if (a && b) return a + ' & ' + b;
    return a || b || 'Our Wedding';
  }

  /* ---------------- derived ---------------- */

  function health() {
    var all = [];
    data.timeline.forEach(function (p) { all = all.concat(p.tasks); });
    var total = all.length;
    var done = all.filter(function (t) { return t.done; }).length;
    var score = total ? Math.round((done / total) * 100) : 0;
    var gaps = [];

    all.forEach(function (t) {
      if (t.key && !t.done) gaps.push(t.text);
    });

    var b = budgetState();
    if (b.over.length) {
      score -= 4 * b.over.length;
      gaps.unshift('Over budget on ' + b.over.map(function (c) { return c.name; }).join(', '));
    }
    if (b.unplanned.length) {
      score -= 4 * b.unplanned.length;
      gaps.unshift('Unplanned spending on ' + b.unplanned.map(function (c) { return c.name; }).join(', '));
    }
    if (b.notSet) gaps.push('No budget planned yet');

    var pending = data.guests.filter(function (g) { return g.status === 'Pending'; }).length;
    if (pending) gaps.push(pending + ' RSVP' + (pending > 1 ? 's' : '') + ' still outstanding');

    // A missed payment date is the most time-critical gap, so it leads.
    var late = overduePayments();
    if (late.length) {
      score -= 5 * late.length;
      gaps.unshift('Payment overdue for ' + late.map(function (v) { return v.name || 'a vendor'; }).join(', '));
    }

    return { score: Math.max(0, Math.min(100, score)), gaps: gaps, done: done, total: total };
  }

  function wisdomLine() {
    var left = daysUntil(data.profile.date);
    var bs = budgetState();
    var over = bs.over.length > 0 || bs.unplanned.length > 0;
    var rsvpDone = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });
    var h = health();
    var pool;
    if (left !== null && left <= 14 && left >= 0) pool = WISDOM.weekOf;
    else if (over) pool = WISDOM.budget;
    else if (rsvpDone) pool = WISDOM.rsvpDone;
    else if (h.done <= 2) pool = WISDOM.justStarted;
    else pool = WISDOM.general;
    var n = new Date();
    return pick(pool, n.getDate() + n.getMonth());
  }

  /* ---------------- render ---------------- */

  var app = document.getElementById('app');
  var warnBox = document.getElementById('warnings');

  function render() {
    updateWarnings();
    if (!data.setupDone) { app.innerHTML = setupView(); return; }
    if (view === 'keepsake') { app.innerHTML = keepsakeView(); return; }
    app.innerHTML = topbar() + undoBar() + '<div class="wrap">' + tabView() + '</div>';
  }

  /* Warnings live outside #app so they can appear while the couple is typing
     without re-rendering the tab (which would move the caret). */
  function updateWarnings() {
    if (!warnBox) return;
    var html = '';
    if (saveFailed) {
      html += '<div class="warn-bar" role="alert">' +
        '<div><strong>Your last change is not saved.</strong> This browser refused to store it \u2014 it may be ' +
        'full, or in private mode. Nothing you typed was lost, but it will go when you close this tab. ' +
        'Save a backup file now.</div>' +
        '<div class="row" style="gap:8px;">' +
          '<button class="btn" onclick="APP.exportJson()">Save backup file</button>' +
          '<button class="btn" onclick="APP.retrySave()">Try saving again</button>' +
        '</div></div>';
    }
    if (loadFailed) {
      html += '<div class="warn-bar warn-soft" role="alert">' +
        '<div>There is saved data in this browser that could not be read, so it has been left untouched. ' +
        'Restore a backup from Settings \u2014 or carry on here to start fresh.</div>' +
        '<button class="btn" onclick="APP.dismissLoadWarning()">Dismiss</button></div>';
    }
    warnBox.innerHTML = html;
  }

  function undoBar() {
    if (!undoable) return '';
    return '<div class="undo-bar" role="status">' +
      '<div>Removed ' + esc(undoable.label) + '.</div>' +
      '<div class="row" style="gap:8px;">' +
        '<button class="btn" onclick="APP.undo()">Undo</button>' +
        '<button class="btn-icon" aria-label="Dismiss undo notice" title="Dismiss" onclick="APP.dismissUndo()">&times;</button>' +
      '</div></div>';
  }

  function setupView() {
    var p = setupDraft || data.profile;
    return '' +
      '<div class="setup">' +
        '<div class="label" style="margin-bottom:14px;">Welcome</div>' +
        '<h1>Let\'s set up<br>your wedding.</h1>' +
        '<p style="color:var(--body);margin:0 0 30px;">Everything you enter stays on this computer. ' +
        'You can change any of it later.</p>' +

        '<div class="field"><label for="su-a">Your name</label>' +
        '<input id="su-a" value="' + esc(p.partnerA) + '" placeholder="e.g. Alex" autofocus></div>' +

        '<div class="field"><label for="su-b">Your partner\'s name</label>' +
        '<input id="su-b" value="' + esc(p.partnerB) + '" placeholder="e.g. Sam"></div>' +

        '<div class="field"><label for="su-date">Wedding date <span class="muted">(a rough guess is fine)</span></label>' +
        '<input id="su-date" type="date" value="' + esc(p.date) + '"></div>' +

        '<div class="field"><label for="su-vibe">The vibe you\'re going for <span class="muted">(optional)</span></label>' +
        '<input id="su-vibe" value="' + esc(p.vibe) + '" placeholder="e.g. cozy backyard, black tie, beach at sunset"></div>' +

        (setupError
          ? '<div class="notice" role="alert" style="margin-bottom:16px;">' + esc(setupError) + '</div>'
          : '') +

        '<button class="btn btn-primary" style="padding:13px 30px;font-size:14px;margin-top:8px;" ' +
        'onclick="APP.finishSetup()">Start planning</button>' +
      '</div>';
  }

  function topbar() {
    var tabs = [
      ['home', 'Home'], ['budget', 'Budget'], ['guests', 'Guests'],
      ['timeline', 'Timeline'], ['vendors', 'Vendors'], ['diary', 'Diary'],
      ['vows', 'Vows'], ['settings', 'Settings']
    ];
    var btns = tabs.map(function (t) {
      var on = tab === t[0];
      return '<button type="button" class="tab' + (on ? ' active' : '') + '"' +
             (on ? ' aria-current="page"' : '') +
             ' onclick="APP.go(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('');

    return '' +
      '<div class="topbar"><div class="topbar-inner">' +
        '<div class="brand">' + esc(coupleName()) + '</div>' +
        '<nav class="tabs" aria-label="Planner sections">' + btns + '</nav>' +
      '</div></div>';
  }

  function tabView() {
    switch (tab) {
      case 'budget': return budgetView();
      case 'guests': return guestsView();
      case 'timeline': return timelineView();
      case 'vendors': return vendorsView();
      case 'diary': return diaryView();
      case 'vows': return vowsView();
      case 'settings': return settingsView();
      default: return homeView();
    }
  }

  /* ---------------- home ---------------- */

  function homeView() {
    var h = health();
    var left = daysUntil(data.profile.date);
    var color = h.score >= 70 ? 'var(--good)' : h.score >= 40 ? 'var(--warn)' : 'var(--over)';

    var count;
    if (left === null) count = '<div class="stat">—</div><div class="muted" style="margin-top:8px;">Add your date in Settings</div>';
    else if (left > 0) count = '<div class="stat">' + left + '</div><div class="muted" style="margin-top:8px;">days to go — ' + esc(fmtDate(data.profile.date)) + '</div>';
    else if (left === 0) count = '<div class="stat serif" style="font-size:38px;">Today</div><div class="muted" style="margin-top:8px;">It\'s today. Go get married.</div>';
    else count = '<div class="stat serif" style="font-size:34px;">Married</div><div class="muted" style="margin-top:8px;">' + esc(fmtDate(data.profile.date)) + '</div>';

    var gaps = h.gaps.length
      ? h.gaps.slice(0, 3).map(function (g) {
          return '<div style="font-size:13.5px;color:var(--body);margin-bottom:7px;">· ' + esc(g) + '</div>';
        }).join('')
      : '<div style="font-size:13.5px;color:var(--body);">Nothing urgent — you\'re in good shape.</div>';

    // Counts either source of truth: the timeline checkbox, or a venue vendor
    // the couple has actually committed to. Otherwise the two disagree.
    var COMMITTED = ['Deposit Paid', 'Contracted', 'Paid in Full'];
    var venueBooked =
      data.timeline.some(function (p) {
        return p.tasks.some(function (t) { return /venue/i.test(t.text) && t.done; });
      }) ||
      data.vendors.some(function (v) {
        return /venue/i.test((v.category || '') + ' ' + (v.name || '')) &&
               COMMITTED.indexOf(v.status) !== -1;
      });
    var bs = budgetState();
    var rsvpIn = data.guests.length > 0 && data.guests.every(function (g) { return g.status !== 'Pending'; });

    function milestone(label, on) {
      return '<div class="row" style="margin-bottom:12px;gap:11px;">' +
        '<div class="dot" style="background:' + (on ? 'var(--good)' : 'var(--line)') + ';"></div>' +
        '<div style="font-size:13.5px;color:var(--body);">' + label + '</div></div>';
    }

    return '' +
      '<div class="quote">"' + esc(wisdomLine()) + '"</div>' +

      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:22px;">' +

        '<div class="card" style="text-align:center;">' +
          '<div class="label" style="margin-bottom:12px;">Countdown</div>' + count +
          (data.profile.vibe ? '<div class="muted" style="margin-top:10px;font-style:italic;">' + esc(data.profile.vibe) + '</div>' : '') +
        '</div>' +

        '<div class="card">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:14px;">' +
            '<div class="label">Planning Health</div>' +
            '<div class="serif" style="font-size:30px;font-weight:600;color:' + color + ';">' + h.score + '</div>' +
          '</div>' +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' + h.score + '%;background:' + color + ';"></div></div>' +
          gaps +
        '</div>' +

        '<div class="card">' +
          '<div class="label" style="margin-bottom:14px;">Milestones</div>' +
          milestone('Venue booked', venueBooked) +
          milestone(bs.notSet ? 'Budget not set' : 'Budget on track', bs.onTrack) +
          milestone('All RSVPs in', rsvpIn) +
          milestone('Vows written', (data.vows.promises || '').trim().length > 40) +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="serif" style="font-size:22px;font-weight:600;margin-bottom:6px;">Our Story</div>' +
        '<div class="muted" style="margin-bottom:12px;">How you met, or anything you want to remember later.</div>' +
        '<textarea rows="4" style="width:100%;" placeholder="We met when..." aria-label="Our story" ' +
        'oninput="APP.setStory(this.value)">' + esc(data.profile.story) + '</textarea>' +
      '</div>';
  }

  /* ---------------- budget ---------------- */

  function budgetView() {
    var bs = budgetState();
    var planned = bs.planned, spent = bs.spent;
    var problems = bs.over.map(function (c) { return c.name + ' is ' + money(num(c.spent) - num(c.planned)) + ' over'; })
      .concat(bs.unplanned.map(function (c) { return c.name + ' has ' + money(c.spent) + ' spent with nothing planned'; }));

    var warn = problems.length
      ? '<div class="quote longtext" style="font-family:var(--sans);font-style:normal;font-size:14px;">' +
        '<strong style="color:var(--over);">Heads up — </strong>' +
        esc(problems.join(', ')) + '.' +
        '<div class="serif" style="font-style:italic;font-size:15px;margin-top:8px;">"' +
        esc(pick(WISDOM.budget, new Date().getDate())) + '"</div></div>'
      : '';

    var rows = data.budget.map(function (c, i) {
      var p = num(c.planned);
      var s = num(c.spent);
      var isOver = p > 0 && s > p;
      var isUnplanned = p === 0 && s > 0;
      var label = esc(c.name || 'this category');
      // Each bar shows how much of THAT category's own budget is used, so a
      // small category running over still reads as full rather than a sliver.
      var w = p > 0 ? Math.min(100, (s / p) * 100) : (s > 0 ? 100 : 0);
      var note = isUnplanned ? 'Unplanned — ' + money(s) + ' spent with nothing planned'
        : isOver ? money(s - p) + ' over plan' : '';
      return '' +
        '<div style="padding:14px 0;border-bottom:1px solid var(--line-soft);">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:9px;">' +
            '<input value="' + esc(c.name) + '" aria-label="Budget category name" style="border:none;background:none;font-weight:600;font-size:15px;padding:4px 0;min-width:120px;flex:1;" ' +
            'oninput="APP.budgetField(' + i + ',\'name\',this.value)">' +
            '<div class="row" style="gap:7px;">' +
              '<label class="row" style="gap:6px;"><span class="muted">planned</span>' +
              '<input type="number" min="0" step="50" value="' + p + '" style="width:92px;" ' +
              'aria-label="Planned amount for ' + label + '" ' +
              'onchange="APP.budgetNum(' + i + ',\'planned\',this.value)"></label>' +
              '<label class="row" style="gap:6px;"><span class="muted">spent</span>' +
              '<input type="number" min="0" step="50" value="' + s + '" style="width:92px;" ' +
              'aria-label="Spent amount for ' + label + '" ' +
              'onchange="APP.budgetNum(' + i + ',\'spent\',this.value)"></label>' +
              '<button class="btn-icon" aria-label="Remove budget category ' + label + '" ' +
              'title="Remove budget category ' + label + '" onclick="APP.budgetRemove(' + i + ')">&times;</button>' +
            '</div>' +
          '</div>' +
          '<div class="bar"><div style="width:' + w + '%;background:' + (isOver || isUnplanned ? 'var(--over)' : 'var(--accent)') + ';"></div></div>' +
          (note ? '<div class="longtext" style="font-size:12.5px;color:var(--over);margin-top:7px;">' + esc(note) + '</div>' : '') +
        '</div>';
    }).join('');

    var remaining = planned - spent;

    return warn +
      '<div class="row" style="gap:34px;margin-bottom:22px;">' +
        '<div><div class="label">Planned</div><div id="budget-planned" class="serif" style="font-size:28px;font-weight:600;">' +
          (bs.notSet ? 'Not set' : money(planned)) + '</div></div>' +
        '<div><div class="label">Spent</div><div id="budget-spent" class="serif" style="font-size:28px;font-weight:600;">' + money(spent) + '</div></div>' +
        '<div><div class="label">Remaining</div><div id="budget-remaining" class="serif" style="font-size:28px;font-weight:600;color:' +
          (bs.notSet ? 'var(--muted)' : remaining < 0 ? 'var(--over)' : 'var(--good)') + ';">' +
          (bs.notSet ? '\u2014' : money(remaining)) + '</div></div>' +
      '</div>' +
      (bs.notSet
        ? '<div class="notice" id="budget-not-set" style="margin-bottom:18px;">Budget not set — add a planned amount to a category and we\'ll track your spending against it.</div>'
        : '') +
      '<div class="card">' + rows +
        '<button class="btn" style="margin-top:16px;" onclick="APP.budgetAdd()">+ Add category</button>' +
      '</div>';
  }

  /* ---------------- guests ---------------- */

  function guestsView() {
    var g = data.guests;
    var a = attendance();
    var dupes = duplicateNameKeys();
    var dupeCount = Object.keys(dupes).length;

    function stat(n, l, id) {
      return '<div' + (id ? ' id="' + id + '"' : '') + '><span style="font-weight:600;font-size:17px;">' + n +
        '</span> <span class="muted">' + l + '</span></div>';
    }

    var rows = g.length ? g.map(function (x, i) {
      var who = esc(x.name || 'this guest');
      var declined = x.status === 'No';
      var isDupe = dupes[normName(x.name)] === true;
      return '' +
        '<div class="list-row">' +
          '<input value="' + esc(x.name) + '" aria-label="Guest name" style="border:none;background:none;flex:1;min-width:120px;font-size:14.5px;" ' +
          'oninput="APP.guestField(' + i + ',\'name\',this.value)">' +
          (isDupe ? '<span class="tag tag-warn">duplicate name</span>' : '') +
          '<select aria-label="RSVP for ' + who + '" onchange="APP.guestField(' + i + ',\'status\',this.value,true)">' +
            GUEST_STATUSES.map(function (s) {
              return '<option' + (x.status === s ? ' selected' : '') + '>' + s + '</option>';
            }).join('') +
          '</select>' +
          '<input value="' + esc(x.meal || '') + '" placeholder="' + (declined ? 'not needed' : 'meal') + '" style="width:110px;"' +
          (declined ? ' disabled' : '') +
          ' aria-label="Meal for ' + who + '" oninput="APP.guestField(' + i + ',\'meal\',this.value)">' +
          '<label class="row" style="gap:5px;font-size:13px;color:' + (declined ? 'var(--muted)' : 'var(--body)') + ';cursor:pointer;">' +
            '<input type="checkbox"' + (x.plusOne && !declined ? ' checked' : '') + (declined ? ' disabled' : '') +
            ' aria-label="Plus-one attending with ' + who + '"' +
            ' onchange="APP.guestPlus(' + i + ',this.checked)"> +1' +
          '</label>' +
          // The +1's name only becomes editable once there is a +1 to name.
          '<input value="' + esc(x.plusOneName || '') + '" placeholder="+1 name" style="width:122px;"' +
          (x.plusOne && !declined ? '' : ' disabled') +
          ' aria-label="Name of the plus-one for ' + who + '"' +
          ' oninput="APP.guestField(' + i + ',\'plusOneName\',this.value)">' +
          '<button class="btn-icon" aria-label="Remove guest ' + who + '" title="Remove guest ' + who + '" ' +
          'onclick="APP.guestRemove(' + i + ')">&times;</button>' +

    }).join('') : '<div class="empty">No guests yet. Add your first one below.</div>';

    return '' +
      '<div class="row" style="gap:24px;margin-bottom:8px;">' +
        stat(a.attending, 'attending', 'guest-attending') + stat(a.invited, 'invited') +
        stat(a.yes, 'yes') + stat(a.no, 'no') + stat(a.pending, 'pending') +
        stat(a.plusOnes, 'confirmed plus-ones') +
      '</div>' +
      '<div class="muted" style="margin-bottom:18px;">Attending counts confirmed "yes" guests plus the plus-ones they confirmed.</div>' +
      (dupeCount
        ? '<div class="notice" role="alert" style="margin-bottom:18px;">' +
          (dupeCount === 1 ? 'One name appears more than once' : dupeCount + ' names appear more than once') +
          ' — check the flagged rows.</div>'
        : '') +
      '<div class="card">' + rows +
        '<div class="row" style="gap:8px;margin-top:18px;">' +
          '<input id="guest-input" placeholder="Add a guest name" aria-label="Name of the guest to add" style="flex:1;min-width:160px;" ' +
          'onkeydown="if(event.key===\'Enter\')APP.guestAdd()">' +
          '<button class="btn btn-primary" onclick="APP.guestAdd()">Add</button>' +
          '<button class="btn" onclick="APP.exportCsv()">Export CSV</button>' +
        '</div>' +
        (notice ? '<div class="notice" role="alert" style="margin-top:12px;">' + esc(notice) + '</div>' : '') +
      '</div>';

  /* ---------------- timeline ---------------- */

  function timelineView() {
    var dated = !!parseDate(data.profile.date);
    var lateCount = 0, nowPhase = '';
    data.timeline.forEach(function (p) {
      var st = phaseState(p);
      if (st.status === 'overdue') lateCount++;
      if (st.status === 'now' && !nowPhase) nowPhase = p.phase;
    });

    var head = !dated
      ? '<div class="notice" style="margin-bottom:18px;">Add your wedding date in Settings and every phase will show the date it should be finished by.</div>'
      : '<div class="row longtext" style="gap:8px;margin-bottom:18px;font-size:13.5px;color:var(--body);">' +
        (lateCount
          ? '<span class="tag tag-over">' + lateCount + ' phase' + (lateCount > 1 ? 's' : '') + ' overdue</span>'
          : '<span class="tag tag-good">nothing overdue</span>') +
        (nowPhase ? '<span>Working on <strong>' + esc(nowPhase) + '</strong> right now.</span>'
          : '<span>Dates below are worked back from ' + esc(fmtDate(data.profile.date)) + '.</span>') +
        '</div>';

    var cards = data.timeline.map(function (p, pi) {
      var st = phaseState(p);
      var done = p.tasks.filter(function (t) { return t.done; }).length;

      var tag = st.status === 'overdue'
          ? '<span class="tag tag-over">overdue \u00b7 ' + st.left + ' left</span>'
        : st.status === 'now' ? '<span class="tag tag-warn">do this now</span>'
        : st.status === 'done' && p.tasks.length ? '<span class="tag tag-good">complete</span>'
        : '';

      var ago = st.days === null ? ''
        : st.days < 0 ? Math.abs(st.days) + ' day' + (Math.abs(st.days) === 1 ? '' : 's') + ' ago'
        : st.days === 0 ? 'today'
        : 'in ' + st.days + ' day' + (st.days === 1 ? '' : 's');

      var when = st.iso
        ? '<div class="muted longtext" style="margin-bottom:12px;">' +
          (st.status === 'done' ? 'Was due by ' : 'Finish by ') + esc(fmtDate(st.iso)) +
          (st.status === 'done' ? '' : ' \u00b7 ' + ago) + '</div>'
        : '';

      var tasks = p.tasks.map(function (t, ti) {
        return '' +
          '<label class="check' + (t.done ? ' done' : '') + '">' +
            '<input type="checkbox"' + (t.done ? ' checked' : '') + ' onchange="APP.toggleTask(' + pi + ',' + ti + ')">' +
            '<span class="txt" style="font-size:13.5px;line-height:1.45;">' + esc(t.text) +
            (t.key && !t.done ? ' <span class="tag tag-warn">often missed</span>' : '') +
            '</span>' +
          '</label>';
      }).join('');

      return '' +
        '<div class="card' + (st.status === 'overdue' ? ' phase-late' : st.status === 'now' ? ' phase-now' : '') + '">' +
          '<div class="row" style="justify-content:space-between;margin-bottom:6px;">' +
            '<div class="serif longtext" style="font-size:19px;font-weight:600;">' + esc(p.phase) + '</div>' +
            '<div class="muted">' + done + ' / ' + p.tasks.length + '</div>' +
          '</div>' +
          (tag ? '<div class="row" style="margin-bottom:10px;">' + tag + '</div>' : '') +
          when +
          '<div class="bar" style="margin-bottom:16px;"><div style="width:' +
            (p.tasks.length ? (done / p.tasks.length) * 100 : 0) + '%;background:var(--good);"></div></div>' +
          tasks +
        '</div>';
    }).join('');

    return head + '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(290px,1fr));">' + cards + '</div>';
  }

  /* ---------------- vendors ---------------- */

  function vendorsView() {
    var rows = data.vendors.length ? data.vendors.map(function (v, i) {
      var who = esc(v.name || 'this vendor');
      var dep = paymentFlag(v.deposit, depositPaid(v));
      var fin = paymentFlag(v.final, finalPaid(v));
      function badge(flag, what) {
        if (flag === 'overdue') return '<span class="tag tag-over">' + what + ' OVERDUE</span>';
        if (flag === 'soon') return '<span class="tag tag-warn">' + what + ' due soon</span>';
        return '';
      }
      var m = vendorMoney(v);
      var balanceNote = m.cost > 0
        ? (m.balance > 0
            ? '<span>Balance <strong style="color:var(--ink);">' + esc(money(m.balance)) + '</strong> of ' + esc(money(m.cost)) + '</span>'
            : m.balance === 0
              ? '<span class="tag tag-good">paid in full</span>'
              : '<span class="tag tag-warn">overpaid by ' + esc(money(-m.balance)) + '</span>')
        : (m.paid > 0
            ? '<span>' + esc(money(m.paid)) + ' paid \u2014 no total cost recorded yet</span>'
            : '');

      return '' +
        '<div style="padding:14px 0;border-bottom:1px solid var(--line-soft);">' +
          '<div class="row" style="gap:8px;margin-bottom:9px;">' +
            '<input value="' + esc(v.name) + '" placeholder="Vendor name" aria-label="Vendor name" style="border:none;background:none;font-weight:600;flex:1;min-width:130px;" ' +
            'oninput="APP.vendorField(' + i + ',\'name\',this.value)">' +
            '<input value="' + esc(v.category || '') + '" placeholder="category" style="width:130px;" ' +
            'aria-label="Category for ' + who + '" oninput="APP.vendorField(' + i + ',\'category\',this.value)">' +
            '<input value="' + esc(v.contact || '') + '" placeholder="email or phone" style="width:190px;" ' +
            'aria-label="Contact for ' + who + '" oninput="APP.vendorField(' + i + ',\'contact\',this.value)">' +
            '<select aria-label="Booking status for ' + who + '" onchange="APP.vendorField(' + i + ',\'status\',this.value,true)">' +
              VENDOR_STATUSES.map(function (s) {
                return '<option' + (v.status === s ? ' selected' : '') + '>' + s + '</option>';
              }).join('') +
            '</select>' +
            '<button class="btn-icon" aria-label="Remove vendor ' + who + '" title="Remove vendor ' + who + '" ' +
            'onclick="APP.vendorRemove(' + i + ')">&times;</button>' +
          '</div>' +
          '<div class="money-row">' +
            '<label class="row" style="gap:6px;">total cost ' +
            '<input type="number" min="0" step="50" value="' + m.cost + '" ' +
            'aria-label="Total cost for ' + who + '" onchange="APP.vendorNum(' + i + ',\'cost\',this.value)"></label>' +
            '<label class="row" style="gap:6px;">deposit ' +
            '<input type="number" min="0" step="50" value="' + m.deposit + '" ' +
            'aria-label="Deposit amount for ' + who + '" onchange="APP.vendorNum(' + i + ',\'depositAmount\',this.value)"></label>' +
            '<label class="row" style="gap:6px;">paid so far ' +
            '<input type="number" min="0" step="50" value="' + m.paid + '" ' +
            'aria-label="Amount paid so far to ' + who + '" onchange="APP.vendorNum(' + i + ',\'paidAmount\',this.value)"></label>' +
            balanceNote +
          '</div>' +
          '<div class="row" style="gap:12px;font-size:12.5px;color:var(--muted);margin-top:8px;">' +
            '<label class="row" style="gap:6px;">deposit due <input type="date" value="' + esc(v.deposit || '') + '" style="font-size:12.5px;padding:5px 7px;" ' +
            'onchange="APP.vendorField(' + i + ',\'deposit\',this.value,true)"></label>' +
            badge(dep, 'deposit') +
            '<label class="row" style="gap:6px;">final due <input type="date" value="' + esc(v.final || '') + '" style="font-size:12.5px;padding:5px 7px;" ' +
            'onchange="APP.vendorField(' + i + ',\'final\',this.value,true)"></label>' +
            badge(fin, 'final payment') +
          '</div>' +
        '</div>';
    }).join('') : '<div class="empty">No vendors yet. Add the first one below.</div>';

    var tot = vendorTotals();
    var late = overduePayments();
    var soon = data.vendors.filter(function (v) {
      return paymentFlag(v.deposit, depositPaid(v)) === 'soon' || paymentFlag(v.final, finalPaid(v)) === 'soon';
    });

    var summary = data.vendors.length
      ? '<div class="row" style="gap:34px;margin-bottom:18px;">' +
          '<div><div class="label">Total cost</div><div id="vendor-total-cost" class="serif" style="font-size:28px;font-weight:600;">' +
            esc(money(tot.cost)) + '</div></div>' +
          '<div><div class="label">Paid</div><div id="vendor-total-paid" class="serif" style="font-size:28px;font-weight:600;">' +
            esc(money(tot.paid)) + '</div></div>' +
          '<div><div class="label">Still owed</div><div id="vendor-balance" class="serif" style="font-size:28px;font-weight:600;color:' +
            (tot.balance > 0 ? 'var(--ink)' : 'var(--good)') + ';">' + esc(money(tot.balance)) + '</div></div>' +
        '</div>' +
        (late.length
          ? '<div class="notice longtext" id="vendor-overdue" role="alert" style="margin-bottom:18px;">Payment overdue for ' +
            esc(listPhrase(late.map(function (v) { return tidy(v.name) || 'an unnamed vendor'; }))) + '.</div>'
          : soon.length
            ? '<div class="notice longtext" id="vendor-due-soon" style="margin-bottom:18px;">Payment due within two weeks for ' +
              esc(listPhrase(soon.map(function (v) { return tidy(v.name) || 'an unnamed vendor'; }))) + '.</div>'
            : '')
      : '';

    return summary + '<div class="card">' + rows +
      '<button class="btn" style="margin-top:16px;" onclick="APP.vendorAdd()">+ Add vendor</button></div>';
  }

  /* ---------------- diary ---------------- */

      '</div>' + entries;

  /* ---------------- vows ---------------- */

  function vowsView() {
    var v = data.vows;
    var notes = {
      Heartfelt: 'Keep it warm and sincere — say the true thing, even if your voice shakes.',
      Funny: 'A little humor never hurts, but let one line be completely serious.',
      Traditional: 'Classic and steady — built to be read aloud calmly.',
      Short: 'Under a minute. Every word has to earn its place.'
    };

    var tones = TONES.map(function (t) {
      var on = v.tone === t;
      return '<button type="button" class="btn' + (on ? ' btn-primary' : '') + '" style="padding:8px 16px;" ' +
             'aria-pressed="' + (on ? 'true' : 'false') + '" ' +
             'onclick="APP.setTone(\'' + t + '\')">' + t + '</button>';
    }).join('');

    var words = (v.opening + ' ' + v.memory + ' ' + v.promises + ' ' + v.closing)
      .trim().split(/\s+/).filter(Boolean).length;
    var wColor = words < 120 ? 'var(--muted)' : words <= 260 ? 'var(--good)' : 'var(--warn)';
    var wNote = words === 0 ? 'Start anywhere — the middle is fine.'
      : words < 120 ? 'Still finding your words — keep going.'
      : words <= 260 ? 'That\'s about right for one to two minutes.'
      : 'Getting long — consider trimming.';
    var secs = Math.round((words / 130) * 60);
    var speak = secs < 60 ? secs + ' sec' : (Math.round(secs / 6) / 10) + ' min';

    function block(key, title, hint, rows) {
      return '' +
        '<div style="margin-bottom:22px;">' +
          '<div class="label" style="margin-bottom:5px;" id="vow-' + key + '-label">' + title + '</div>' +
          '<div class="muted" style="margin-bottom:8px;">' + hint + '</div>' +
          '<textarea id="vow-' + key + '" rows="' + rows + '" style="width:100%;" aria-labelledby="vow-' + key + '-label" ' +
          'oninput="APP.setVow(\'' + key + '\',this.value)">' + esc(v[key]) + '</textarea>' +
        '</div>';
    }

    return '' +
      '<div class="grid vows-grid" style="grid-template-columns:minmax(0,2fr) minmax(220px,1fr);align-items:start;">' +
        '<div class="card">' +
          '<div class="row" style="gap:8px;margin-bottom:14px;">' + tones + '</div>' +
          '<div class="serif" style="font-style:italic;font-size:15px;color:var(--body);margin-bottom:24px;">' +
            esc(notes[v.tone] || '') + '</div>' +
          block('opening', 'Opening line', 'A first line that sounds like you, not like a wedding.', 2) +
          block('memory', 'A shared memory', 'What is the moment you knew this was it?', 3) +
          block('promises', 'Your promises', 'What promise matters most, on an ordinary day?', 5) +
          block('closing', 'Closing line', 'The last thing they hear before "I do."', 2) +
        '</div>' +
        '<div class="card">' +
          '<div class="label" style="margin-bottom:8px;" id="vow-count-label">Word count</div>' +
          '<div id="vow-word-count" class="serif" aria-labelledby="vow-count-label" style="font-size:38px;font-weight:600;color:' + wColor + ';">' + words + '</div>' +
          '<div id="vow-word-note" class="muted" style="margin:8px 0 16px;">' + wNote + '</div>' +
          '<div id="vow-speak-time" class="muted">About ' + speak + ' spoken aloud.</div>' +
          '<div class="muted" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">' +
            'Read them out loud before the day. They always sound different in your mouth than on the page.' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ---------------- actions ---------------- */

  // Text inputs call the *quiet* path: state + save, no re-render, so the
  // caret never jumps mid-word. Anything structural re-renders.
  function quiet() { save(); }
  function loud() { save(); render(); }

  /** Remove a row behind a confirmation, keeping one step of undo. */
  function removeRow(list, index, label) {
    if (!list || index < 0 || index >= list.length) return;
    var what = tidy(label) || 'this item';
    if (!window.confirm('Remove ' + what + '? You can undo this straight after.')) return;
    var snapshot = JSON.parse(JSON.stringify(list[index]));
    list.splice(index, 1);
    undoable = { label: what, index: index, restore: function () {
      list.splice(Math.min(index, list.length), 0, snapshot);
    } };
    notice = '';
    loud();
  }

  var APP = {
    go: function (t) { tab = t; notice = ''; undoable = null; window.scrollTo(0, 0); render(); },

    finishSetup: function () {
      var a = tidy(document.getElementById('su-a').value);
      var b = tidy(document.getElementById('su-b').value);
      var date = document.getElementById('su-date').value;
      var vibe = tidy(document.getElementById('su-vibe').value);

      // Never throw away what they typed just because something is missing.
      setupDraft = { partnerA: a, partnerB: b, date: date, vibe: vibe };

      var missing = [];
      if (!a) missing.push('your name');
      if (!b) missing.push("your partner's name");
      if (!isIsoDate(date)) missing.push('your wedding date');
      if (missing.length === 3) {
        setupError = 'Add your names and your wedding date to start — the planner needs all three.';
        render(); return;
      }
      if (missing.length) {
        setupError = 'Still missing ' + listPhrase(missing) + '.';
        render(); return;
      }
      if (daysUntil(date) < 0) {
        setupError = 'That date has already passed — pick the day you are planning for.';
        render(); return;
      }

      setupError = '';
      setupDraft = null;
      data.profile.partnerA = a;
      data.profile.partnerB = b;
      data.profile.date = date;
      data.profile.vibe = vibe;
      data.setupDone = true;
      loud();
    },

    retrySave: function () { save(); },
    dismissLoadWarning: function () { loadFailed = false; updateWarnings(); },
    undo: function () {
      if (!undoable) return;
      undoable.restore();
      undoable = null;
      loud();
    },
    dismissUndo: function () { undoable = null; render(); },

    profile: function (k, v, re) { data.profile[k] = v; re ? loud() : quiet(); },
    setStory: function (v) { data.profile.story = v; quiet(); },

    budgetField: function (i, k, v) { data.budget[i][k] = v; quiet(); },
    budgetNum: function (i, k, v) { data.budget[i][k] = Math.max(0, num(v)); loud(); },
    budgetAdd: function () { data.budget.push({ name: 'New category', planned: 0, spent: 0 }); loud(); },
    budgetRemove: function (i) { removeRow(data.budget, i, (data.budget[i] || {}).name || 'this category'); },

    guestField: function (i, k, v, re) {
      if (k === 'status') {
        v = GUEST_STATUSES.indexOf(v) === -1 ? 'Pending' : v;
        // A declined RSVP brings no plus-one and needs no meal, so both the
        // flag and the fields that depend on it are cleared with it.
        if (v === 'No') {
          data.guests[i].plusOne = false;
          data.guests[i].plusOneName = '';
          data.guests[i].meal = '';
        }
      }
      data.guests[i][k] = v;
      re ? loud() : quiet();
    },
    guestPlus: function (i, v) {
      data.guests[i].plusOne = data.guests[i].status !== 'No' && v === true;
      if (!data.guests[i].plusOne) data.guests[i].plusOneName = '';
      loud();
    },
    guestRemove: function (i) { removeRow(data.guests, i, (data.guests[i] || {}).name || 'this guest'); },
    guestAdd: function () {
      var el = document.getElementById('guest-input');
      var name = tidy(el && el.value);
      if (!name) {
        notice = 'Type a name before adding a guest.';
        render();
        var f = document.getElementById('guest-input');
        if (f) f.focus();
        return;
      }
      var clash = data.guests.some(function (g) { return normName(g.name) === normName(name); });
      if (clash) {
        notice = '“' + name + '” is already on the guest list.';
        render();
        var d = document.getElementById('guest-input');
        if (d) { d.value = name; d.focus(); d.select(); }
        return;
      }
      notice = '';
      data.guests.push({ name: name, status: 'Pending', meal: '', plusOne: false, plusOneName: '' });
      loud();
      var next = document.getElementById('guest-input');
      if (next) next.focus();
    },

    toggleTask: function (p, t) {
      data.timeline[p].tasks[t].done = !data.timeline[p].tasks[t].done;
      loud();
    },

    vendorField: function (i, k, v, re) { data.vendors[i][k] = v; re ? loud() : quiet(); },
    vendorNum: function (i, k, v) { data.vendors[i][k] = Math.max(0, num(v)); loud(); },
    vendorAdd: function () {
      data.vendors.push({ name: '', category: '', contact: '', status: 'Inquiring', deposit: '', final: '',
        cost: 0, depositAmount: 0, paidAmount: 0 });
      loud();
    },
    vendorRemove: function (i) { removeRow(data.vendors, i, (data.vendors[i] || {}).name || 'this vendor'); },

    draftSet: function (k, v) { draft[k] = v; },
    diaryAdd: function () {
      var text = (draft.diaryText || '').trim();
      if (!text) { var t = document.getElementById('d-text'); if (t) t.focus(); return; }
      data.diary.push({ date: draft.diaryDate || today(), text: text, mood: draft.diaryMood, shared: false });
      draft.diaryText = '';
      loud();
    },
    diaryShare: function (i, v) { data.diary[i].shared = v; quiet(); },
    diaryRemove: function (i) {
      var e = data.diary[i] || {};
      removeRow(data.diary, i, 'the entry from ' + (fmtDate(e.date) || 'this day'));
    },

    setTone: function (t) { data.vows.tone = t; loud(); },
    setVow: function (k, v) {
      data.vows[k] = v;
      save();
      // Live-update just the counter so typing stays smooth. Keyed by id, not
      // by a style-matching selector that any restyle would silently break.
      var words = (data.vows.opening + ' ' + data.vows.memory + ' ' + data.vows.promises + ' ' + data.vows.closing)
        .trim().split(/\s+/).filter(Boolean).length;
      var el = document.getElementById('vow-word-count');
      if (el) {
        el.textContent = words;
        el.style.color = words < 120 ? 'var(--muted)' : words <= 260 ? 'var(--good)' : 'var(--warn)';
      }
      var note = document.getElementById('vow-word-note');
      if (note) {
        note.textContent = words === 0 ? 'Start anywhere — the middle is fine.'
          : words < 120 ? 'Still finding your words — keep going.'
          : words <= 260 ? "That's about right for one to two minutes."
          : 'Getting long — consider trimming.';
      }
      var secs = Math.round((words / 130) * 60);
      var speak = document.getElementById('vow-speak-time');
      if (speak) speak.textContent = 'About ' + (secs < 60 ? secs + ' sec' : (Math.round(secs / 6) / 10) + ' min') + ' spoken aloud.';
    },

    openKeepsake: function () { view = 'keepsake'; window.scrollTo(0, 0); render(); },
    closeKeepsake: function () { view = 'app'; render(); },

    exportJson: function () {
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      download(blob, 'wedding-planner-backup.json');
    },

    importJson: function (ev) {
      var input = ev.target;
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onerror = function () {
        input.value = '';
        alert('That file could not be read. Your current plan is untouched.');
      };
      reader.onload = function () {
        input.value = '';
        var parsed = null;
        try { parsed = JSON.parse(reader.result); } catch (e) { parsed = null; }
        // Nothing is replaced until the whole backup checks out.
        var clean = parsed === null ? null : validate(parsed);
        if (!clean) {
          alert("That file isn't a complete wedding planner backup, so nothing was changed. Your current plan is still here.");
          return;
        }
        if (!window.confirm('Restore this backup? It replaces everything in the planner right now.')) return;
        data = clean;
        loadFailed = false;
        undoable = null;
        notice = '';
        tab = 'home';
        loud();
      };
      reader.readAsText(file);
    },

    exportCsv: function () {
      var rows = [['Name', 'RSVP', 'Meal', 'Plus One', 'Plus One Name', 'Attending']].concat(data.guests.map(function (g) {
        return [g.name, g.status, g.meal || '', g.plusOne ? 'Yes' : 'No', g.plusOne ? (g.plusOneName || '') : '',
          g.status === 'Yes' ? (g.plusOne ? 2 : 1) : 0];
      }));
      var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
      download(new Blob([csv], { type: 'text/csv' }), 'guest-list.csv');
    },

    reset: function () {
      if (!confirm('Erase everything and start over? This cannot be undone.')) return;
      if (!confirm('Last check: every guest, vendor, budget figure and diary entry will be erased. Save a backup first if you want one. Erase now?')) return;
      data = defaultData();
      tab = 'home';
      undoable = null;
      notice = '';
      loadFailed = false;
      setupError = '';
      setupDraft = null;
      loud();
    }
  };

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  window.APP = APP;
  render();
})();
</script>
</body>
</html>
