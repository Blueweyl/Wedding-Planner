    /* ---------- AI settings ---------- */

    focusAi: function () {
      var el = document.getElementById('ai-settings');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
      var f = document.getElementById(aiCfg.enabled ? 'ai-key' : 'ai-enabled');
      if (f) f.focus();
    },
    aiSet: function (k, v) {
      if (k === 'enabled') aiCfg.enabled = v === true;
      else if (k === 'provider') {
        if (!AI_PROVIDERS[v]) return;
        if (v !== aiCfg.provider) { aiCfg.provider = v; aiCfg.model = AI_PROVIDERS[v].def; aiCfg.verified = ''; aiCfg.consent = null; aiRun.test = ''; }
      } else if (k === 'model') {
        v = String(v || '').trim();
        if (v && !validModel(v)) { aiRun.test = 'That model name has characters a model name never has. Check it and try again.'; render(); return; }
        aiCfg.model = v; aiCfg.verified = ''; aiRun.test = '';
      } else if (k === 'endpoint') {
        v = String(v || '').trim();
        if (!validEndpoint(v)) { aiRun.test = 'The address must start with http://localhost or http://127.0.0.1 and include the path, e.g. http://localhost:11434/v1/chat/completions'; render(); return; }
        aiCfg.endpoint = v; aiCfg.verified = '';
      } else if (k === 'remember') {
        aiCfg.remember = v === true;
        var key = aiCfg.remember ? aiMemKey : aiCfg.key;
        if (aiCfg.remember) { aiCfg.key = key; } else { aiMemKey = key; aiCfg.key = ''; }
        try { aiCfg.remember ? sessionStorage.removeItem(AI_SESSION_KEY) : sessionStorage.setItem(AI_SESSION_KEY, aiMemKey); } catch (e) {}
      }
      saveAiCfg();
      render();
    },
    aiKey: function (v) {
      var k = String(v || '').trim();
      if (!k) return;
      if (!validKey(k)) { aiRun.test = 'That doesn’t look like an API key (it should be one line, with no spaces). Nothing was saved.'; render(); return; }
      var p = AI_PROVIDERS[aiCfg.provider];
      if (aiCfg.remember) aiCfg.key = k;
      else { aiMemKey = k; try { sessionStorage.setItem(AI_SESSION_KEY, k); } catch (e) {} }
      aiCfg.verified = '';
      aiRun.test = (p.keyRe && !p.keyRe.test(k) ? 'Saved — though ' + p.name + ' keys usually ' + p.keyHint + '. ' : 'Key saved. ') + 'Now press “Test connection”.';
      saveAiCfg();
      render();
    },
    aiForget: function () {
      aiCfg.key = ''; aiMemKey = ''; aiCfg.verified = '';
      try { sessionStorage.removeItem(AI_SESSION_KEY); } catch (e) {}
      saveAiCfg();
      aiRun.test = 'Key forgotten on this computer.';
      render();
    },
    aiShare: function (k, v) {
      if (!(k in aiCfg.share)) return;
      aiCfg.share[k] = v === true;
      aiCfg.consent = null;  // what is shared changed, so ask again before sending
      saveAiCfg();
      render();
    },
    aiRevoke: function () { aiCfg.consent = null; saveAiCfg(); aiRun.test = 'Consent withdrawn. You will be asked again before anything is sent.'; render(); },

    /* A tiny request with none of the plan in it: proves the key, the model
       and that this browser can reach the provider at all. */
    aiTest: function () {
      if (aiRun.busy) return;
      if (AI.status() === 'nokey') { aiRun.test = 'Paste your API key first.'; render(); return; }
      if (!validModel(aiCfg.model)) { aiRun.test = 'Enter the model name first.'; render(); return; }
      aiRun.busy = true; aiRun.testing = true; aiRun.test = 'Testing…';
      render();
      AI.call('Reply with the single word OK.', 'Connection test. Reply with OK.', 64).then(function () {
        aiCfg.verified = aiSignature();
        saveAiCfg();
        aiRun.test = 'Connected to ' + AI_PROVIDERS[aiCfg.provider].name + ' (' + aiCfg.model + '). The assistant is ready on the Concierge tab.';
      }, function (e) {
        aiCfg.verified = '';
        saveAiCfg();
        aiRun.test = 'Not connected: ' + e.message + ' The assistant stays off until a test succeeds.';
      }).then(function () { aiRun.busy = false; aiRun.testing = false; render(); });
    },

    /* ---------- AI studio ---------- */

    aiMode: function (m) {
      if (['advice', 'vows', 'vendor', 'ask'].indexOf(m) === -1) return;
      aiRun.mode = m; aiRun.err = '';
      if (tab === 'concierge') {
        render();
        var el = document.getElementById('ai-studio');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'start' });
      }

    aiDraft: function (k, v) {
      if (!(k in aiDraft)) return;
      aiDraft[k] = v;
      if (k === 'vendor' || k === 'purpose' || k === 'vowLength') return;
    },
    aiPreview: function () {
      var prompt = buildPrompt(aiRun.mode);
      openModal('Exactly what will be sent', '<p class="muted" style="margin-top:0;">This text, plus a short set of instructions telling the AI how to behave, is all that goes to ' +
        esc(AI_PROVIDERS[aiCfg.provider].name) + '.</p><pre>' + esc(SYSTEM_PREVIEW() + '\n\n---\n\n' + prompt) + '</pre>');
      function SYSTEM_PREVIEW() { return 'Instructions: ' + AI_SYSTEM; }
    },
    aiCancel: function () { if (aiRun.ctrl) aiRun.ctrl.abort(); },
    aiSend: function () {
      if (aiRun.busy || AI.status() !== 'ready') return;
      var mode = aiRun.mode;
      var prompt = buildPrompt(mode);
      if (!prompt) return;
      function go() {
        aiRun.busy = true; aiRun.err = ''; aiRun.out = ''; aiRun.tasks = [];
        render();
        var started = Date.now();
        AI.call(AI_SYSTEM, prompt, 16000).then(function (res) {
          aiRun.out = res.text;
          aiRun.lastMode = mode;
          aiRun.tasks = mode === 'advice' || mode === 'ask' ? parseTasks(res.text) : [];
          aiRun.meta = (res.note ? res.note + ' ' : '') + 'From ' + AI_PROVIDERS[aiCfg.provider].name + ' in ' + Math.max(1, Math.round((Date.now() - started) / 1000)) + 's.';
        }, function (e) {
          aiRun.err = e.message;
        }).then(function () {
          aiRun.busy = false;
          if (tab === 'concierge') render();
        });
      }
      if (!aiCfg.consent || aiCfg.consent.provider !== aiCfg.provider) {
        openModal('Before anything is sent', consentBody(prompt), { ok: 'Agree and send', okDisabled: true, onConfirm: function () {
          var box = document.getElementById('consent-ok');
          if (!box || !box.checked) return true;
          aiCfg.consent = { provider: aiCfg.provider, at: new Date().toISOString() };
          saveAiCfg();
          setTimeout(go, 0);
        } });
        return;
      }
      go();

    aiCopy: function () { if (aiRun.out) copyText(aiRun.out); },
    aiMail: function () {

      toast('Backup saved to your Downloads folder.');
    },

    importJson: function (ev) {
      var input = ev.target;
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onerror = function () {
        input.value = '';
        alert('That file could not be read. Your current plan is untouched.');
      };
      reader.onload = function () {
        input.value = '';
        var parsed = null;
        try { parsed = JSON.parse(reader.result); } catch (e) { parsed = null; }
        // Nothing is replaced until the whole backup checks out.
        var clean = parsed === null ? null : validate(parsed);
        if (!clean) {
          alert("That file isn't a wedding planner backup, so nothing was changed. Your current plan is still here.");
          return;
        }
        var repairs = lastRepairs;
        var meta = parsed && parsed._evermore && typeof parsed._evermore.exportedAt === 'string' ? parsed._evermore : null;
        var when = meta && !isNaN(new Date(meta.exportedAt).getTime())
          ? ' saved ' + new Date(meta.exportedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
        var who = tidy(clean.profile.partnerA) && tidy(clean.profile.partnerB)
          ? clean.profile.partnerA + ' & ' + clean.profile.partnerB : 'this plan';
        var summary = 'Restore the backup for ' + who + when + '?\n\n' +
          clean.guests.length + ' guests, ' + clean.vendors.length + ' vendors, ' + clean.diary.length + ' diary entries.' +
          (repairs ? '\n' + repairs + ' damaged field' + (repairs === 1 ? '' : 's') + ' will be reset to a safe default.' : '') +
          '\n\nIt replaces everything in the planner right now. A safety copy of your current plan is kept first, ' +
          'so you can undo this.';
        if (!window.confirm(summary)) return;
        takeSnapshot('Before restoring a backup');
        var before = data;
        data = clean;
        if (!data.setupDone && tidy(data.profile.partnerA) && tidy(data.profile.partnerB)) data.setupDone = true;
        loadFailed = false;
        loadRepairs = 0;
        undoable = { text: 'Backup restored.', restore: function () { data = before; } };
        notice = '';
        settingsDraft = null;
        settingsError = '';
        tab = 'home';
        loud();
        toast('Backup restored. Use Undo at the top if this was the wrong file.');
      };
      reader.readAsText(file);
    },

    restoreSnapshot: function (i) {
      var sn = snapshots()[i];
      if (!sn) return;
      var clean = validate(sn.data);
      if (!clean) { alert('That safety copy could not be read, so nothing was changed.'); return; }
      if (!window.confirm('Go back to the safety copy from ' + new Date(sn.at).toLocaleString() +
        '? Your plan as it is now is kept as a new safety copy first.')) return;
      takeSnapshot('Before going back to a safety copy');
      var before = data;
      data = clean;
      undoable = { text: 'Safety copy restored.', restore: function () { data = before; } };
      tab = 'home';
      loud();
    },

    exportCsv: function () {
      if (!data.guests.length) { notice = 'Add a guest before exporting the list.'; render(); return; }
      var rows = [['Name', 'RSVP', 'Meal', 'Plus One', 'Plus One Name', 'Attending']].concat(data.guests.map(function (g) {
        return [g.name, g.status, g.meal || '', g.plusOne ? 'Yes' : 'No', g.plusOne ? (g.plusOneName || '') : '',
          g.status === 'Yes' ? (g.plusOne ? 2 : 1) : 0];
      }));
      var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
      // A byte-order mark so Excel reads accented names (José, Zoë) correctly.
      download(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), 'guest-list-' + today() + '.csv');
    },

    reset: function () {
      if (!confirm('Erase everything and start over? This cannot be undone.')) return;
      if (!confirm('Last check: every guest, vendor, budget figure and diary entry will be erased. Save a backup first if you want one. Erase now?')) return;
      takeSnapshot('Before starting over');
      data = defaultData();
      tab = 'home';
      undoable = null;
      notice = '';
      loadFailed = false;
      setupError = '';
      setupDraft = null;
      settingsDraft = null;
      settingsError = '';
      loud();
    }
  };

  function download(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  window.APP = APP;
  if (window.EVERMORE_PWA) {
    window.EVERMORE_PWA.notify = function () { updateWarnings(); updateOfflineStatus(); };
  }
  // Another tab of the planner saved: say so rather than letting the two
  // quietly overwrite each other.
  window.addEventListener('storage', function (e) {
    if (e.key !== STORAGE_KEY || e.newValue == null) return;
    toast('This plan was changed in another tab. Reload this one before editing, so neither overwrites the other.');
  });
  dailySnapshot();
  render();
})();
</script>
</body>
</html>
